AutoName: TAWC

RepoType: git
Repo: https://github.com/wmww/tawc.git
Binaries: https://github.com/wmww/tawc/releases/download/v%v/tawc-v%v.apk

Builds:
  - versionName: '6'
    versionCode: 6
    commit: bf81550ca5fd86bd82f9c9ecd588cdafb3e03459
    subdir: app
    sudo:
      - apt-get update
      - apt-get install -y rustup build-essential make pkg-config curl libarchive-tools
        file meson ninja-build bison autoconf automake libtool libtool-bin libltdl-dev
        perl python3 python3-libxml2 xsltproc libexpat1-dev libwayland-dev libwayland-bin
        libwayland-egl-backend-dev wayland-protocols libvulkan-dev patchelf libx11-dev
        libx11-xcb-dev libxcb1-dev gcc-aarch64-linux-gnu g++-aarch64-linux-gnu binutils-aarch64-linux-gnu
        libc6-arm64-cross linux-libc-dev-arm64-cross
    gradle:
      - yes
    prebuild:
      - cd "$(git rev-parse --show-toplevel)"
      - printf 'tawcMethods=tawcroot\ntawcGraphics=libhybris,cpu\n' >> gradle.properties
      - cargo install cargo-ndk --version 4.1.2 --locked
      - scripts/fetch-release-deps.sh --offline
    scanignore:
      - deps/libhybris/utils/generate_nfc/symbols/libnfc.so.txt
      - deps/libhybris/utils/generate_nfc/symbols/libnfc_ndef.so.txt
      - deps/libxkbcommon/test/data/rules/utf-16be_with_bom
      - deps/libxkbcommon/test/data/rules/utf-16le_with_bom
      - deps/libxkbcommon/test/data/rules/utf-32be
      - deps/smithay/Cargo.toml
      - deps/smithay/*/Cargo.toml
      - deps/rutabaga_gfx/Cargo.toml
      - deps/rutabaga_gfx/ffi/Cargo.toml
      - deps/rutabaga_gfx/kumquat/server/Cargo.toml
      - deps/rutabaga_gfx/third_party/mesa3d/src/magma/Cargo.toml
      - deps/rutabaga_gfx/third_party/mesa3d/src/util/rust/Cargo.toml
      - deps/rutabaga_gfx/third_party/mesa3d/src/virtio/*/Cargo.toml
    ndk: 27.2.12479018

AllowedAPKSigningKeys: 0b2262d221a951b57d847b288324004ce3b2fefe1ef52a1140f2fbc1fbb990be

