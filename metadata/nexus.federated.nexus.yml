IssueTracker: https://git.federated.nexus/Nexus/nexus/issues

AutoName: Nexus

RepoType: git
Repo: https://git.federated.nexus/Nexus/nexus.git

Builds:
  - versionName: 1.1.4
    versionCode: 101042999
    commit: 53105025c97760fe87e4249b2a4bbf126da7c50c
    submodules: true
    sudo:
      - apt-get update
      - apt-get install -y cmake jq libclang-dev meson ninja-build
      - apt-get install -y -t trixie-backports golang-go
      - mkdir -p /home/runner/work/nexus
      - chown -R vagrant /home/runner
    output: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
    binary: 
      https://git.federated.nexus/Nexus/nexus/releases/download/v%v/app-arm64-v8a-release.apk
    srclibs:
      - flutter@stable
      - go@go1.27.4
    prebuild:
      - flutterVersion=$(sed -n -E 's/^\s+flutter:\s*([0-9.]+)$/\1/p' pubspec.yaml)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - goVersion=$(sed -n -E 's/^toolchain go([0-9.]+)$/\1/p' gomuks/go.mod)
      - '[[ $goVersion ]]'
      - git -C $$go$$ checkout -f go$goVersion
      - sed -i "/signingConfig = /d" android/app/build.gradle.kts
      - export repo=/home/runner/work/nexus/nexus
      - cd ..
      - mv nexus.federated.nexus $repo
      - pushd $repo
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
      - sed -i /play-services-location/d .pub-cache/git/flutterlocation-*/packages/location/android/build.gradle
      - popd
      - mv $repo nexus.federated.nexus
    scandelete:
      - .pub-cache
    build:
      - pushd $$go$$/src
      - GOROOT_BOOTSTRAP=$(go env GOROOT) ./make.bash
      - popd
      - export repo=/home/runner/work/nexus/nexus
      - cd ..
      - mv nexus.federated.nexus $repo
      - pushd $repo
      - export PATH=$$go$$/bin:$$flutter$$/bin:$PATH:/usr/sbin:/sbin
      - export PUB_CACHE=$(pwd)/.pub-cache
      - bash scripts/build_avif_native.sh
      - dart scripts/generate.dart
      - dart run build_runner build
      - flutter build apk --release --split-per-abi --target-platform android-arm64
        --dart-define=GIT_COMMIT=$(git rev-parse HEAD)
      - popd
      - mv $repo nexus.federated.nexus
    ndk: r28c

AllowedAPKSigningKeys: e82eabd9fca1080f9d35d9979973bcaf09c3ef9bf34a802953fb367c3c58ee82

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v\d+\.\d+\.\d+$
VercodeOperation:
  - '%c + 2000'
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
