Repo: https://github.com/rorystandley/rune.git

Builds:
  - versionName: 0.5.7
    versionCode: 151
    commit: a9eb4d43b516423efc1587c5faf177df33134da7
    subdir: app
    submodules: true
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    srclibs:
      - flutter@stable
    rm:
      - app/ios
      - app/macos
      - app/linux
      - app/windows
      - third_party/whisper.cpp/examples
      - third_party/whisper.cpp/bindings
      - third_party/whisper.cpp/models/for-tests-*.bin
    prebuild:
      - flutterVersion=$(sed -n -E 's/.*FLUTTER_VERSION:.*"([^"]*)".*/\1/p' ../.github/workflows/release.yml)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - sed -i -e 's|//f ||' android/app/build.gradle.kts
      - export PUB_CACHE="$(pwd)/.pub-cache"
      - $$flutter$$/bin/flutter config --no-analytics --no-cli-animations
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
    scanignore:
      - packages/notes_core/pubspec.yaml
      - app/assets/models/ggml-tiny.en-q5_1.bin
    scandelete:
      - app/.pub-cache
    build:
      - export PATH="$$flutter$$/bin:$PATH"
      - export PUB_CACHE="$(pwd)/.pub-cache"
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform=android-arm
    ndk: 28.2.13676358

