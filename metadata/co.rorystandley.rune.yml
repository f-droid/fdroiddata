MaintainerNotes: |
  The bundled ggml-tiny.en-q5_1.bin is MIT-licensed Whisper model data, not
  executable code. Its source revision and SHA-256 are documented upstream:
  https://github.com/rorystandley/rune/blob/a9eb4d43b516423efc1587c5faf177df33134da7/docs/transcription.md#pinned-inputs
  https://github.com/openai/whisper#license

  Unused whisper.cpp examples, language bindings and test models are removed.
  The native library is built from the pinned submodule's C/C++ sources.

  The R8 hook and ABI version mapping must remain in upstream release tags:
  https://github.com/rorystandley/rune/pull/92

AutoUpdateMode: Version
