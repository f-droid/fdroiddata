Categories:
  - Local Media Player
  - Online Media Player
License: MPL-2.0
AuthorName: TheZupZup
SourceCode: https://github.com/TheZupZup/Linthra
IssueTracker: https://github.com/TheZupZup/Linthra/issues
Changelog: https://github.com/TheZupZup/Linthra/releases

Name: Linthra
AutoName: Linthra

RepoType: git
Repo: https://github.com/TheZupZup/Linthra.git

Builds:
  - versionName: 0.1.0-alpha.40
    versionCode: 1000401
    commit: dbbbe403d9d21d06f78114a018eb587b1e328c51
    sudo:
      - mkdir -p /home/runner/work/Linthra
      - chown -R vagrant /home/runner/work
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    binary: 
      https://github.com/TheZupZup/Linthra/releases/download/v%v/linthra-v%v-armeabi-v7a-release-signed.apk
    srclibs:
      - flutter@stable
    prebuild:
      - flutterVersion=$(cat .flutter-version)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export repo=/home/runner/work/Linthra/Linthra
      - cd ..
      - mv io.github.thezupzup.linthra $repo
      - pushd $repo
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
      - popd
      - mv $repo io.github.thezupzup.linthra
    scandelete:
      - .pub-cache
    build:
      - export repo=/home/runner/work/Linthra/Linthra
      - cd ..
      - mv io.github.thezupzup.linthra $repo
      - pushd $repo
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform="android-arm"
      - popd
      - mv $repo io.github.thezupzup.linthra

