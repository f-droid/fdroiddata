AntiFeatures:
  TetheredNet:
    en-US: Offline routing downloads waterway tiles from a server run by the app author.
      The data is from OpenStreetMap (ODbL) and the generator is open source, but
      there is no setting to point the app at another instance.
    de: Für das Routing ohne Netz lädt die App Wasserwegkacheln von einem Server des
      Autors. Die Daten stammen aus OpenStreetMap (ODbL) und der Generator ist quelloffen,
      es gibt aber keine Einstellung für eine andere Gegenstelle.
