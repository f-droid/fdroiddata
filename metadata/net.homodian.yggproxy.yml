Categories:
  - VPN & Proxy
License: AGPL-3.0-only
AuthorName: homodian
WebSite: https://git.homodian.net
SourceCode: https://git.homodian.net/Sapiens_homo/yggproxy
IssueTracker: https://git.homodian.net/Sapiens_homo/yggproxy/issues

AutoName: Ygg Proxy

RepoType: git
Repo: https://git.homodian.net/Sapiens_homo/yggproxy.git

Builds:
  - versionName: 0.5.14.1
    versionCode: 51410
    commit: 433046255d2190ee934e472bafdbf6618082f318
    subdir: android/app
    sudo:
      - apt-get update
      - apt-get install -y -t trixie-backports golang-go
    gradle:
      - yes
    srclibs:
      - go@go1.26.7
    build:
      - export GOPATH="$PWD/.go-work"
      - export GOMODCACHE="$GOPATH/pkg/mod"
      - export GOPROXY="https://proxy.golang.org,direct"
      - export GOBIN="$GOPATH/bin"
      - mkdir -p "$GOPATH/pkg/gomobile" "$GOMODCACHE"
      - export PATH="$$go$$/bin:$GOPATH/bin${PATH:+:$PATH}"
      - export APPDIR="$PWD"
      - cd "$$go$$/src"
      - ./make.bash
      - cd "$APPDIR"
      - export ANDROID_NDK_HOME="$ANDROID_NDK"
      - sdkmanager "platforms;android-21"
      - mkdir -p libs
      - cd ../../yggproxy
      - go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20260908204917-8b95e45f8d3e
      - go install golang.org/x/mobile/cmd/gobind@v0.0.0-20260908204917-8b95e45f8d3e
      - gomobile bind -v -target android -androidapi 21 -tags mobile -o ../android/app/libs/yggproxy.aar
        -ldflags "-s -w -checklinkname=0" ./mobileproxy
    ndk: r26b
    gradleprops:
      - abiFilter=armeabi-v7a

