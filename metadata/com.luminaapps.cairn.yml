Categories:
  - Sports & Health
License: MIT
AuthorName: Max Fiedler
SourceCode: https://github.com/LuminaAppsDev/cairn
IssueTracker: https://github.com/LuminaAppsDev/cairn/issues

AutoName: Cairn

RepoType: git
Repo: https://github.com/LuminaAppsDev/cairn.git

Builds:
  - versionName: 0.2.3
    versionCode: 81
    commit: 460e6bff83c495680420e8dab8030512fd2eacbc
    sudo:
      - mkdir -p /build
      - chown -R vagrant /build
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    binary: 
      https://github.com/LuminaAppsDev/cairn/releases/download/v%v/cairn-v%v-armeabi-v7a.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
    prebuild:
      - flutterVersion=$(sed -n -E "s/.*FLUTTER_VERSION:\s*'?([0-9.]+)'?.*/\1/p" .forgejo/workflows/release.yml
        | head -1)
      - '[ -n "$flutterVersion" ]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export PATH=$(cd $$flutter$$ && pwd)/bin:$PATH
      - cd ..
      - rm -rf /build/cairn
      - mv com.luminaapps.cairn /build/cairn
      - pushd /build/cairn
      - export PUB_CACHE=$(pwd)/.pub-cache
      - flutter config --no-analytics
      - flutter pub get --enforce-lockfile
      - popd
      - mv /build/cairn com.luminaapps.cairn
    scandelete:
      - .pub-cache
    build:
      - export PATH=$(cd $$flutter$$ && pwd)/bin:$PATH
      - cd ..
      - rm -rf /build/cairn
      - mv com.luminaapps.cairn /build/cairn
      - pushd /build/cairn
      - export PUB_CACHE=$(pwd)/.pub-cache
      - flutter build apk --release --split-per-abi --target-platform=android-arm
      - popd
      - mv /build/cairn com.luminaapps.cairn

