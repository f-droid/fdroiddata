MaintainerNotes: |-
  native/build.sh downloads the LibreSSL and OpenSSH source tarballs from
  cdn.openbsd.org, checks them against the SHA-256 sums it holds, and
  builds them with the NDK for arm64-v8a into app/src/main/jniLibs.

  The build is reproducible: the GitHub release APK is the CI build of the
  same commit with the same NDK, signed by the developer.

