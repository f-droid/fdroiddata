Builds:
  - versionName: 5.1.19
    versionCode: 221
    commit: d5d5c5e84bb25d899af21aae8326cd4526e58171
    sudo:
      - mkdir -p /build
      - chown -R vagrant /build
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    binary: 
      https://github.com/invoiceninja/flutter/releases/download/v%v/InvoiceNinja-%v-armeabi-v7a.apk
    srclibs:
      - flutter@stable
    rm:
      - appimage
      - ios
      - linux
      - macos
      - snap
      - test_driver
      - web
      - windows
    prebuild:
      - flutterVersion=$(sed -n -E "s/^ *flutter-version:\ ([0-9.]+) *$/\1/p" .github/workflows/appimage.yml)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export repo=/build/com.invoiceninja.admin
      - cd ..
      - mv com.invoiceninja.admin $repo
      - pushd $repo
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - FLUTTER=$$flutter$$/bin/flutter tools/prepare_foss.sh
      - popd
      - mv $repo com.invoiceninja.admin
    scanignore:
      - .pub-cache/hosted/pub.dev/flutter_contacts-*/android/build.gradle
    scandelete:
      - .pub-cache
    build:
      - export repo=/build/com.invoiceninja.admin
      - cd ..
      - mv com.invoiceninja.admin $repo
      - pushd $repo
      - export PUB_CACHE=$(pwd)/.pub-cache
      - export ANDROID_NDK_HOME=$$NDK$$
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform=android-arm
      - popd
      - mv $repo com.invoiceninja.admin
    ndk: 28.2.13676358

