MaintainerNotes: |-
  Upstream builds and signs this exact recipe with fdroid build, in the
  fdroidserver:buildserver-trixie image, before publishing the binaries
  (tools/fdroid_build.sh, docs/fdroid.md in the source repo). The server it
  talks to uses the Elastic-2.0 license, which is approved neither by OSI nor
  FSF, see https://invoiceninja.github.io/docs/legal/license

  tools/prepare_foss.sh runs `flutter pub get --enforce-lockfile` against
  tools/foss/pubspec.lock, the committed lock of the FOSS dependency graph:
  the store build's pubspec.lock minus the store SDKs, checked in CI.

  prebuild checks out the Flutter version upstream releases with, read from
  .github/workflows/appimage.yml, so a Flutter bump needs no recipe change.
  ndk: is Flutter's ndkVersion and is not read from the source: upstream
  opens a merge request when a Flutter bump moves it. The JDK changes the
  DEX, so upstream's reproducibility gate builds in the same buildserver
  image, whose only JDK is 21.

  AutoName is the launcher label, "Ninja Beta"; the listing name comes from
  fastlane title.txt.

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v\d+\.\d+\.\d+$
VercodeOperation:
  - 10 * %c + 1
  - 10 * %c + 2
  - 10 * %c + 3
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
