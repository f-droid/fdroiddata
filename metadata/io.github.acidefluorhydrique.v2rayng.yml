Builds:
  - versionName: 2.3.13
    versionCode: 5075301
    commit: 67fbef7b7e049c7ddbb8dac862702e427f65de4a
    subdir: V2rayNG/app
    submodules: true
    sudo:
      - apt-get update
      - apt-get install -y -t trixie-backports golang-go
    gradle:
      - fdroid
    output: build/outputs/apk/fdroid/release/v2rayNG_$$VERSION$$-fdroid_armeabi-v7a.apk
    binary: 
      https://github.com/AcideFluorhydrique/v2rayNG/releases/download/v%v/v2rayNG_%v-fdroid_armeabi-v7a.apk
    srclibs:
      - go@go1.27.1
    rm:
      - AndroidLibXrayLite/assets/geoip.dat
      - AndroidLibXrayLite/assets/geosite.dat
      - hev-socks5-tunnel/third-part/wintun
    prebuild: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
    build:
      - pushd $$go$$/src
      - ./make.bash
      - popd
      - export GOROOT=$$go$$ GOPATH=$HOME/go GOTOOLCHAIN=local
      - export PATH=$GOROOT/bin:$GOPATH/bin:$PATH
      - export NDK_HOME=$$NDK$$ ANDROID_NDK_HOME=$$NDK$$
      - cd ../..
      - bash build-libv2ray.sh $PWD/aar/libv2ray.aar
      - bash compile-hevtun.sh
      - mkdir -p V2rayNG/app/libs
      - cp -r libs/. V2rayNG/app/libs/
      - cp aar/libv2ray.aar V2rayNG/app/libs/
      - cd V2rayNG
      - gradle licenseFdroidReleaseReport
      - python3 ../forkray-geodata/scripts/notice.py --append-to app/src/main/assets/open_source_licenses.html
    ndk: r29

