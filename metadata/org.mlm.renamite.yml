Builds:
  - versionName: 0.3.14
    versionCode: 16778121
    commit: 6325e07bd07757f240c2605c783e7ddba9b86da7
    subdir: apps/renamite-editor
    sudo:
      - apt-get update
      - apt-get install -y gcc libc6-dev rustup openjdk-21-jdk-headless
    output: ../../target/release/apk/renamite.apk
    binary: https://github.com/mlm-games/renamite/releases/download/v%v/renamite-%v-x86.apk
    srclibs:
      - reproducible-apk-tools@v0.3.0
    prebuild:
      - export PATH="$HOME/.cargo/bin:$PATH"
      - ANDROID_API=$(sed -nE 's/.*android-api.*"([^"]+)".*/\1/p' ../../.github/workflows/release.yml)
      - ANDROID_BUILD_TOOLS=$(sed -nE 's/.*android-build-tools.*"([^"]+)".*/\1/p'
        ../../.github/workflows/release.yml)
      - sdkmanager "platforms;android-$ANDROID_API" "build-tools;$ANDROID_BUILD_TOOLS"
      - rustup target add i686-linux-android
      - CARGO_RAPK_VERSION=$(sed -nE 's/.*cargo-rapk-version.*"([^"]+)".*/\1/p' ../../.github/workflows/release.yml)
      - cargo install "cargo-rapk@$CARGO_RAPK_VERSION" --locked
    build:
      - export JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64
      - export PATH="$JAVA_HOME/bin:$HOME/.cargo/bin:$PATH"
      - export ANDROID_BUILD_TOOLS=$(sed -nE 's/.*android-build-tools.*"([^"]+)".*/\1/p'
        ../../.github/workflows/release.yml)
      - export CARGO_RAPK_KOTLIN_VERSION=$(sed -nE 's/.*kotlin-version.*"([^"]+)".*/\1/p'
        ../../.github/workflows/release.yml)
      - cargo rapk build --release --deterministic --timestamp 0 --unsigned --target
        i686-linux-android --lib
    ndk: 29.0.14206865
    postbuild:
      - mv "$$OUT$$" unaligned.apk
      - $$reproducible-apk-tools$$/zipalign.py -P 16 --pad-like-apksigner --replace
        unaligned.apk "$$OUT$$"

