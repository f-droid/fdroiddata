AntiFeatures:
  TetheredNet:
    en-US: "The app enriches discovered IP addresses with network, location, and ASN
      information from RIPEstat (including the maxmind-geo-lite endpoint) over HTTPS.
      The resolver list and RIPEstat endpoint cannot be changed in settings. Providers
      see your requests and public IP address.\n"
  NonFreeNet:
    en-US: "DNS queries are sent to mhost's fixed list of predefined public resolvers
      over UDP, TCP, DNS-over-TLS, and DNS-over-HTTPS. UDP and TCP queries are unencrypted.
      The resolver list cannot be changed in settings.\n"
