Builds:
  - versionName: 1.9.7
    versionCode: 351
    commit: 5d2500caa511429abd12ad3579363e8af911be73
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    binary: 
      https://github.com/zaifears/locreminder/releases/download/v%v/app-armeabi-v7a-release.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
      - linux
      - macos
      - web
      - windows
    prebuild:
      - flutterVersion=$(sed -n -E "s/.*FLUTTER_VERSION:\s*'(.*)'/\1/p" .github/workflows/build.yml)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - sed -i -e '/signingConfig = if (hasReleaseSigning)/d' android/app/build.gradle.kts
      - export PUB_CACHE=$PWD/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
    scandelete:
      - .pub-cache
    build:
      - export ANDROID_NDK_ROOT=$ANDROID_NDK_HOME
      - export PUB_CACHE=$PWD/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform
        android-arm
    ndk: 28.2.13676358

