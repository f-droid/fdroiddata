AuthorName: Sidhant
AuthorWebSite: https://sidhant.is-a.dev/
SourceCode: https://github.com/sidhant947/LearnMath
IssueTracker: https://github.com/sidhant947/LearnMath/issues

AutoName: Learn Math

RepoType: git
Repo: https://github.com/sidhant947/LearnMath.git

Builds:
  - versionName: 1.0.0
    versionCode: 11
    commit: 03f80bed3ccaaad5aa2ed455587afcf5b66f0c41
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    srclibs:
      - flutter@stable
    prebuild:
      - export flutterVersion=$(sed -n -E "s/.*revision:\ \"(.*)\"/\1/p" .metadata)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform=android-arm

  - versionName: 1.0.0
    versionCode: 12
