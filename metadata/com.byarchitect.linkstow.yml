Repo: https://github.com/by-architect/KarakeepMobile.git

Builds:
  - versionName: 1.3.2
    versionCode: 61
    commit: d6055cd4edebf98de14e86a95d3c55ea35053880
    subdir: apps/flutter
    sudo:
      - mkdir -p /home/runner/work/KarakeepMobile
      - chown -R vagrant /home/runner
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    binary: 
      https://github.com/by-architect/KarakeepMobile/releases/download/v%v/linkstow-%v-armeabi-v7a.apk
    srclibs:
      - flutter@stable
    rm:
      - apps/flutter/ios
    prebuild:
      - flutterVersion=$(sed -n -E 's/.*"flutter"[[:space:]]*:[[:space:]]*"([^"]+)".*/\1/p'
        .fvmrc)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export repo=/home/runner/work/KarakeepMobile/KarakeepMobile
      - cd ../../..
      - mv com.byarchitect.linkstow $repo
      - pushd $repo/apps/flutter
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
      - sed -i -e '/^cmake_minimum_required/a add_link_options("LINKER:--build-id=none")'
        $PUB_CACHE/hosted/pub.dev/jni-*/src/CMakeLists.txt
      - popd
      - mv $repo com.byarchitect.linkstow
    scandelete:
      - apps/flutter/.pub-cache
    build:
      - export repo=/home/runner/work/KarakeepMobile/KarakeepMobile
      - cd ../../..
      - mv com.byarchitect.linkstow $repo
      - pushd $repo/apps/flutter
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform=android-arm
      - popd
      - mv $repo com.byarchitect.linkstow

