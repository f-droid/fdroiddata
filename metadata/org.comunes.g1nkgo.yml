Builds:
  - versionName: 2.0.27
    versionCode: 1041
    commit: 01f8d095a68c814b624dceb1445fefd4c2aac7d6
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-production-release.apk
    binary: 
      https://git.comunes.org/comunes/g1nkgo/releases/download/v%v/app-production-armeabi-v7a-release.apk
    srclibs:
      - flutter@stable
    prebuild:
      - export flutterVersion=$(sed -n -E 's,.*cirruslabs/flutter:([0-9.]+).*,\1,p'
        .forgejo/workflows/release.yml | head -1)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
      - pushd packages/duniter_datapod
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
      - popd
      - pushd packages/duniter_indexer
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
      - popd
      - cp dot.env.sample .env
      - cp dot.env.sample .env.dev
      - cp assets/translations/ast.json assets/translations/es-AST.json
      - $$flutter$$/bin/dart run build_runner build --delete-conflicting-outputs
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --flavor production -t lib/main.dart
        --dart-define=FDROID=true --split-per-abi --target-platform=android-arm

