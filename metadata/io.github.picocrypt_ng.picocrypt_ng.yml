MaintainerNotes: |-
  The 3.0 recipes use the published source and the Go 1.27.4 source tag.
  Match the release runner's four CPUs for Gradle and Kotlin. A different number
  of visible CPUs can change the emitted DEX. scanignore covers frozen crypto
  and ZIP test fixtures.

