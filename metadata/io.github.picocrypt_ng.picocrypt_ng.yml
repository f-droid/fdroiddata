  - versionName: '3.0'
    versionCode: 300001
    commit: 1a057eeb1e63c3d15e83fca8d858bbecf82acd4f
    subdir: android/app
    sudo:
      - apt-get update
      - apt-get install -y golang-go/trixie-backports golang-src/trixie-backports
        gcc libc-dev make jq openjdk-21-jdk-headless
      - update-java-alternatives --set java-1.21.0-openjdk-amd64
    gradle:
      - yes
    output: build/outputs/apk/release/app-armeabi-v7a-release-unsigned.apk
    binary: 
      https://github.com/Picocrypt-NG/Picocrypt-NG/releases/download/%v/Picocrypt-NG-android-armeabi-v7a.apk
    srclibs:
      - go@7b2881024c95a11ddb86663a616340aa3a88b67f
    prebuild:
      - sdkmanager "platforms;android-37.2" "build-tools;36.0.0"
      - sed -i -e '/^org\.gradle\.jvmargs=/s/$/ -XX:ActiveProcessorCount=4/' ../gradle.properties
      - printf '\norg.gradle.workers.max=4\nkotlin.daemon.jvmargs=-XX:ActiveProcessorCount=4\n'
        >> ../gradle.properties
      - printf '\nPICOCRYPT_VERSION_NAME=%s\nPICOCRYPT_VERSION_CODE=%s\n' "$$VERSION$$"
        "$(( $$VERCODE$$ / 10 ))" >> ../gradle.properties
    scandelete:
      - src/internal
    build:
      - pushd $$go$$/src
      - GOROOT_BOOTSTRAP=/usr/lib/go ./make.bash
      - popd
      - export GOROOT=$$go$$
      - export GOPATH="$HOME/go"
      - export PATH="$GOROOT/bin:$GOPATH/bin:$PATH"
      - export GOTOOLCHAIN=local
      - export GOFLAGS="-buildvcs=false"
      - go -C ../../src install golang.org/x/mobile/cmd/gomobile golang.org/x/mobile/cmd/gobind
      - mkdir -p "$HOME/go/pkg/gomobile"
      - pushd ..
      - ./build-gomobile.sh
      - popd
      - taskset --cpu-list 0-3 gradle --no-daemon --dependency-verification strict
        :app:assembleRelease
    ndk: 30.0.16248370
    postbuild:
      - expected=fe9df0432ba534f6e6556a01fe60cdf2b88379816b3a34282cfcaa5fea1af60d
      - for cpus in 0-7 0-15 0-3; do printf '%s  %s\n' "$expected" "$$OUT$$" | sha256sum
        -c --status && break; taskset --cpu-list "$cpus" gradle --no-daemon --dependency-verification
        strict :app:minifyReleaseWithR8 --rerun :app:assembleRelease; done
      - sha256sum "$$OUT$$"

