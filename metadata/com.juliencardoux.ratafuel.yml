AntiFeatures:
  TetheredNet:
    en-US: Fetches gas station amenities from a server (gitlab.com/ratafuel/openrenard)
      maintained by the developer. The backend is open source (AGPL-3.0) and uses
      OpenStreetMap data (ODbL), but there is currently no setting to point the app
      to another API endpoint.
    fr-FR: Récupère les données des stations service depuis un serveur (gitlab.com/ratafuel/openrenard)
      maintenu par le développeur. Le serveur est libre (AGPL-3.0) et basé sur OpenStreetMap
      (ODbL), mais l'application ne permet pas de configurer un endpoint.
