AutoName: Payanam

RepoType: git
Repo: https://github.com/Aravinth-Earth/Payanam

Builds:
  - versionName: 1.1.0
    versionCode: 1001000
    commit: e09921491a863483ad91d794f00b1cfff002c705
    subdir: app
    gradle:
      - yes
    prebuild:
      - sed -i 's/jvmToolchain(17)/jvmToolchain(21)/g' ../core/*/build.gradle.kts
      - sed -i -e 's/Xmx2560m -XX:MaxMetaspaceSize=512m/Xmx8g -XX:+UseParallelGC -XX:MaxMetaspaceSize=2g/'
        ../gradle.properties
    scanignore:
      - docs/db
    gradleprops:
      - fdroidBuild=true

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v\d+\.\d+\.\d+$
UpdateCheckData: gradle/version.properties|versionCode=([0-9]+)|.|version=([1-9.]+)
