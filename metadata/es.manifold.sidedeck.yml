Repo: https://github.com/manueljpy/SideDeck.git

Builds:
  - versionName: 1.0.4
    versionCode: 51
    commit: da86373b2ad56d81bd25e7134ca52a61c486b730
    sudo:
      - mkdir -p /home/runner/work/SideDeck
      - chown -R vagrant /home/runner
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    binary: 
      https://github.com/manueljpy/SideDeck/releases/download/v%v/app-armeabi-v7a-release.apk
    srclibs:
      - flutter@stable
    prebuild:
      - echo "fdroid=true" >> android/gradle.properties
      - git -C $$flutter$$ checkout -f $(sed -n -E "s/.*revision:\ \"(.*)\"/\1/p"
        .metadata)
      - export repo=/home/runner/work/SideDeck/SideDeck
      - cd ..
      - mv es.manifold.sidedeck $repo
      - pushd $repo
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
      - sed -i -e 's/-Wl,/-Wl,--build-id=none,/' "$PUB_CACHE"/hosted/pub.dev/jni-*/src/CMakeLists.txt
      - popd
      - mv $repo es.manifold.sidedeck
    scandelete:
      - .pub-cache
    build:
      - export repo=/home/runner/work/SideDeck/SideDeck
      - cd ..
      - mv es.manifold.sidedeck $repo
      - pushd $repo
      - export PUB_CACHE=$(pwd)/.pub-cache
      - export SOURCE_DATE_EPOCH=0
      - sed -i -e 's/-Wl,/-Wl,--build-id=none,/' "$PUB_CACHE"/hosted/pub.dev/jni-*/src/CMakeLists.txt
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform=android-arm
        -Pfdroid=true
      - popd
      - mv $repo es.manifold.sidedeck

