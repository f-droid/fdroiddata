Categories:
  - Shooter Game
License: CC0-1.0
AuthorName: DerpBiscuit
SourceCode: https://gitlab.com/DerpBiscuit/astro-strike
IssueTracker: https://gitlab.com/DerpBiscuit/astro-strike/-/issues

AutoName: Astro Strike

RepoType: git
Repo: https://gitlab.com/DerpBiscuit/astro-strike.git

Builds:
  - versionName: '1.1'
    versionCode: 2
    commit: c59b64847adf6363cdde8ed88a85c975fb78905e
    sudo:
      - apt-get update
      - apt-get install -y pkgconf scons g++
    output: AstroStrike-fdroid.apk
    srclibs:
      - Godot@4.6.3-stable
    build:
      - pushd $$Godot$$
      - sed -i "/^    buildTypes {/a\        release { minifyEnabled true; proguardFiles
        getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }" platform/android/java/app/build.gradle
      - printf '%s\n' '-keep class com.godot.** { *; }' '-keep class org.godotengine.**
        { *; }' > platform/android/java/app/proguard-rules.pro
      - export ANDROID_NDK_ROOT=$$NDK$$
      - export ANDROID_HOME=$$SDK$$
      - export JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64
      - export SCONS="scons -j `nproc` verbose=no warnings=no progress=no"
      - $SCONS target=editor platform=linuxbsd
      - export TARGS="target=template_release platform=android arch=arm64"
      - export TEMPLATE_FLAGS="production=yes swappy=no"
      - export APK_FLAGS="generate_android_binaries=yes generate_apk=yes"
      - $SCONS $TARGS $TEMPLATE_FLAGS $APK_FLAGS
      - popd
      - mv $$Godot$$/bin/android_release.apk ./android_release.apk
      - python3 scripts/check_android_template.py android_release.apk
      - export GODOT_EDITOR=$$Godot$$/bin/godot.linuxbsd.editor.x86_64
      - $GODOT_EDITOR --headless --import
      - $GODOT_EDITOR --headless --export-release F-Droid AstroStrike-fdroid.apk
    ndk: r29

AutoUpdateMode: Version
UpdateCheckMode: Tags
UpdateCheckData: export_presets.cfg|version/code=(\d+)|.|version/name="([\d.]+)"
CurrentVersion: '1.1'
CurrentVersionCode: 2
