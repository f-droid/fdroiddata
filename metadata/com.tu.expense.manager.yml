Categories:
  - Finance Manager
License: GPL-3.0-only
AuthorName: Jayachandran S
AuthorWebSite: https://www.instagram.com/hardcoree_gamerr/
SourceCode: https://github.com/Jayachandran-jayy/TU-Expense-Manager
IssueTracker: https://github.com/Jayachandran-jayy/TU-Expense-Manager/issues

AutoName: TU Expense Tracker

RepoType: git
Repo: https://github.com/Jayachandran-jayy/TU-Expense-Manager

Builds:
  - versionName: 2.5.6
    versionCode: 341
    commit: 4b53b7317bf258cdf775d53e05d007f74fb95e96
    sudo:
      - mkdir -p /home/runner/work/TU-Expense-Manager
      - mkdir -p /home/runner/.pub-cache
      - chown -R vagrant /home/runner
      - if [ ! -L /opt/android-sdk ]; then mkdir -p /usr/local/lib/android && mv /opt/android-sdk
        /usr/local/lib/android/sdk && ln -sfn /usr/local/lib/android/sdk /opt/android-sdk;
        fi
      - chown -R vagrant /usr/local/lib/android
    output: build/app/outputs/flutter-apk/app-x86_64-release.apk
    binary: 
      https://github.com/Jayachandran-jayy/TU-Expense-Manager/releases/download/v%v/app-x86_64-release.apk
    srclibs:
      - flutter@stable
    rm:
      - test
      - web
    prebuild:
      - flutterVersion=$(sed -n -E "s/.*flutter-version:\ (.*)/\1/p" .github/workflows/release.yml)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export repo=/home/runner/work/TU-Expense-Manager/TU-Expense-Manager
      - cd ..
      - mv com.tu.expense.manager $repo
      - pushd $repo
      - export HOME=/home/runner
      - export PUB_CACHE=/home/runner/.pub-cache
      - export ANDROID_HOME=/usr/local/lib/android/sdk
      - export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter config --android-sdk /usr/local/lib/android/sdk
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
      - cp -a /home/runner/.pub-cache .pub-cache
      - popd
      - mv $repo com.tu.expense.manager
    scandelete:
      - .pub-cache
    build:
      - export repo=/home/runner/work/TU-Expense-Manager/TU-Expense-Manager
      - cd ..
      - mv com.tu.expense.manager $repo
      - pushd $repo
      - export HOME=/home/runner
      - rm -rf /home/runner/.pub-cache
      - cp -a .pub-cache /home/runner/.pub-cache
      - export PUB_CACHE=/home/runner/.pub-cache
      - export ANDROID_HOME=/usr/local/lib/android/sdk
      - export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
      - export ANDROID_NDK=/usr/local/lib/android/sdk/ndk/28.2.13676358
      - export ANDROID_NDK_HOME=/usr/local/lib/android/sdk/ndk/28.2.13676358
      - export NDK=/usr/local/lib/android/sdk/ndk/28.2.13676358
      - sed -i -E 's|/opt/android-sdk|/usr/local/lib/android/sdk|g' android/local.properties
        || true
      - $$flutter$$/bin/flutter config --android-sdk /usr/local/lib/android/sdk
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --build-number
        $(( $$VERCODE$$/10 )) --build-name=$$VERSION$$ --target-platform="android-x64"
      - popd
      - mv $repo com.tu.expense.manager
    ndk: 28.2.13676358

