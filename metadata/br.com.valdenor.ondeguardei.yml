Builds:
  - versionName: 0.3.1
    versionCode: 31
    commit: e0104fe546a925612dde78d2875e6524bbb087ab
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@stable
    prebuild:
      - sed -i '/signingConfig = signingConfigs.getByName("debug")/d' android/app/build.gradle.kts
      - flutterVersion=$(cat .flutter-version)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f "$flutterVersion"
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --target-platform=android-arm
        --build-number=$$VERCODE$$
    ndk: 28.2.13676358

