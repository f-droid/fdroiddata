MaintainerNotes: |-
  Builds pass --dart-define=FDROID_BUILD=true, which compiles out the GitHub
  release check and the automatic yt-dlp update on app startup; the manual
  yt-dlp engine update in Settings remains and is covered by the NonFreeNet
  anti-feature. The Flutter version is read from the flutter-version pin in
  .github/workflows/flutter.yml. Version codes follow F-Droid's
  ABI split scheme: build number from pubspec.yaml * 10 + ABI code
  (armeabi-v7a=1, arm64-v8a=2, x86_64=3). The prebuilt libwebp libraries in
  android/app/src/main/jniLibs (16 KB-aligned replacements for the
  4 KB-aligned copies youtubedl-android's FFmpeg package extracts) are
  removed and rebuilt from source. For reproducibility the build is
  relocated to the GitHub Actions workspace path, since the Dart AOT
  snapshot embeds the project path; the published binaries are the
  app-<abi>-fdroid-release.apk release assets, built by CI from the same
  commit with the same FDROID_BUILD define and JDK 21, and signed with the
  upstream key.

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[0-9.]+$
VercodeOperation:
  - '%c * 10 + 1'
  - '%c * 10 + 2'
  - '%c * 10 + 3'
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
