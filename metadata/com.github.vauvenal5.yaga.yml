  - versionName: 1.0.4
    versionCode: 100041
    commit: 31876066c9a22ebc8445841028d070f590fd0e79
    sudo:
      - mkdir -p /home/runner/work/yaga
      - chown -R vagrant /home/runner
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    binary: 
      https://github.com/vauvenal5/yaga/releases/download/v%v/app-armeabi-v7a-release.apk
    srclibs:
      - flutter@stable
    prebuild:
      - version=$(sed -n -E 's/.*"flutter":\ "(.*)"/\1/p' .fvmrc)
      - pushd $$flutter$$
      - git checkout -f $version
      - popd
      - export repo=/home/runner/work/yaga/yaga
      - cd ..
      - mv com.github.vauvenal5.yaga $repo
      - pushd $repo
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
      - sed -i '1a add_link_options("LINKER:--build-id=none")' $PUB_CACHE/hosted/pub.dev/flutter_zxing-*/src/CMakeLists.txt
      - popd
      - mv $repo com.github.vauvenal5.yaga
    scandelete:
      - .pub-cache
    build:
      - export repo=/home/runner/work/yaga/yaga
      - cd ..
      - mv com.github.vauvenal5.yaga $repo
      - pushd $repo
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform=android-arm
      - popd
      - mv $repo com.github.vauvenal5.yaga

