AutoName: HOPE 26 Schedule
Description: |
  Program app for the HOPE 26 conference (2026)

  https://hope.net

  The 17th Hackers On Planet Earth (HOPE) conference will be held
  from August 14-16, 2026 at the New Yorker Hotel in Midtown Manhattan.

  The HOPE conferences are known for their creativity and diversity,
  not to mention a whole lot of hacker fun. We’ve been at this for
  over three decades now – the first HOPE conference was in 1994.

  In 2025, for the first time ever, HOPE became an annual event. Our
  first three conferences were separated by three years and every
  conference after that was biennial, or once every two years. After
  doing this 15 times, we decided we were finally ready to become
  a yearly tradition.

  There are so many projects, talks, workshops, presentations, villages,
  etc. that we can coordinate at HOPE 26 and we hope you will participate
  in as many ways as possible. We’ll be needing lots of volunteers to
  pull this off again and we’re really limited only by our imaginations.

  <b>Features</b>
  * View program by day and rooms (side by side)
  * Custom grid layout for smartphones (try landscape mode 🙃) and tablets
  * Read detailed descriptions (speaker names, start time, room name, links, ...) of sessions
  * Search and filter through all sessions
  * Add sessions to favorites list
  * Export favorites list
  * Setup alarms for individual sessions
  * Add sessions to your personal calendar
  * Share a website link to an session with others
  * Keep track of program changes
  * Automatic program updates (configurable in settings)
  * Integration with the Engelsystem project https://engelsystem.de - Online tool for coordinating helpers and shifts on large events

  <b>🔤 Supported languages</b>
  (Session descriptions excluded)
  * Danish
  * Dutch
  * English
  * Finnish
  * French
  * German
  * German (Austria)
  * Italian
  * Japanese
  * Lithuanian
  * Polish
  * Portuguese (Brazil)
  * Portuguese (Portugal)
  * Russian
  * Spanish
  * Swedish
  * Turkish

  💡 Questions regarding the content can only be answered by the
  HOPE conference content team. This app simply offers a
  way to consume and personalize the conference schedule.

  💣 Bug reports are very welcome. It would be awesome if you
  can describe how to reproduce the particular error in the
  issue tracker at https://github.com/EventFahrplan/EventFahrplan/issues.

  🏆 The app is based on the EventFahrplan app
  which was initially built for the camp and annual congress of
  the Chaos Computer Club. The source code of the app is publicly
  available on GitHub at:
  https://github.com/johnjohndoe/CampFahrplan/tree/hope-2026.

  🎨 The HOPE barricade artwork is copyrighted by kyle and mojomonger.

