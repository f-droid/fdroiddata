Name: Kinetic Kids
AutoName: Kinetic Kids

RepoType: git
Repo: https://github.com/ingmarstruijs/Kinetic.git

Builds:
  - versionName: 0.4.6
    versionCode: 161
    commit: 66e9f8e90fc73a7a1e2f9a3b1a033e8ef7a6d05e
    subdir: apps/kids
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    srclibs:
      - flutter@stable
    prebuild:
      - cd ../..
      - flutterVersion=$(tr -d '\r\n' < .flutter-version)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export PATH="$$flutter$$/bin:$PATH"
      - flutter config --no-analytics
      - flutter pub get --enforce-lockfile
    build:
      - export PATH="$$flutter$$/bin:$PATH"
      - flutter build apk --release --split-per-abi --target-platform=android-arm
        --build-name=$$VERSION$$ --build-number=$(($$VERCODE$$ / 10))

