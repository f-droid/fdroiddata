Repo: https://github.com/adpa1013/kompanion.git

Builds:
  - versionName: 1.4.5
    versionCode: 41
    commit: 2f31994a56f6ad0da49a777423c0bb40133becd2
    sudo:
      - mkdir -p /home/runner/work/kompanion
      - chown -R vagrant /home/runner/work
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    binary: 
      https://github.com/adpa1013/kompanion/releases/download/v%v/kompanion-v%v-armeabi-v7a.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
      - linux
      - macos
      - web
      - windows
    prebuild:
      - flutterVersion=$(sed -n -E "s/.*flutter-version:\ '(.*)'/\1/p" .github/workflows/release.yml)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export repo=/home/runner/work/kompanion/kompanion
      - cd ..
      - mv com.adpa1013.kompanion $repo
      - pushd $repo
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
      - popd
      - mv $repo com.adpa1013.kompanion
    scandelete:
      - .pub-cache
    build:
      - export repo=/home/runner/work/kompanion/kompanion
      - cd ..
      - mv com.adpa1013.kompanion $repo
      - pushd $repo
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform="android-arm"
      - popd
      - mv $repo com.adpa1013.kompanion

