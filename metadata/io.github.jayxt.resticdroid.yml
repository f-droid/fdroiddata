AuthorName: The ResticDroid contributors
WebSite: https://github.com/JayXT/ResticDroid
SourceCode: https://github.com/JayXT/ResticDroid
IssueTracker: https://github.com/JayXT/ResticDroid/issues
Changelog: https://github.com/JayXT/ResticDroid/releases

AutoName: ResticDroid

RepoType: git
Repo: https://github.com/JayXT/ResticDroid.git

Builds:
  - versionName: 0.3.0
    versionCode: 3001
    commit: 5df55e46b7139d1bae9dea5e8f27568b98bb31de
    subdir: app
    submodules: true
    sudo:
      - L=/etc/apt/sources.list.d/forky.list
      - echo 'deb https://deb.debian.org/debian forky main' > $L
      - apt-get update
      - apt-get install -y -t forky golang-go
      - rm -f $L
      - apt-get update
      - apt-get install -y gcc libc-dev
    gradle:
      - yes
    output: build/outputs/apk/release/app-armeabi-v7a-release-unsigned.apk
    binary: 
      https://github.com/JayXT/ResticDroid/releases/download/v%v/ResticDroid-v%v-armeabi-v7a.apk
    srclibs:
      - go@go1.26.7
    scandelete:
      - third_party/restic/cmd/restic/testdata
      - third_party/restic/internal/backend/testdata
      - third_party/restic/internal/repository/testdata
      - third_party/restic/internal/checker/testdata
    build:
      - set -e
      - GO_VER=$(tr -d '[:space:]' < ../.go-version)
      - git -C $$go$$ checkout -f "go${GO_VER#go}"
      - cd $$go$$/src
      - GOROOT_BOOTSTRAP=/usr/lib/go ./make.bash
      - cd -
      - NDK_VER=$(cat ../.ndk-version)
      - sdkmanager "ndk;$NDK_VER"
      - export ANDROID_NDK_HOME=$$SDK$$/ndk/$NDK_VER
      - export PATH=$$go$$/bin:$PATH
      - ../tools/build-restic.sh

