Builds:
  - versionName: 2.2.3
    versionCode: 24
    commit: 1ca9c410134c8e2ab6efc93f5ff81f88c3344c83
    subdir: app
    sudo:
      - export CPUS_MAX=16
      - export CPUS=$(getconf _NPROCESSORS_ONLN)
      - for (( c=$CPUS_MAX; c<$CPUS; c++ )) ; do echo 0 > /sys/devices/system/cpu/cpu$c/online
        ; done
    gradle:
      - yes

