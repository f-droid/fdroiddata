Repo: https://github.com/SuperDaveOrg/Nexpill.git

Builds:
  - versionName: 0.2.2
    versionCode: 2021
    commit: d57b2fc44c8d783ff39eff56a3e21a51042ce7f7
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    binary: 
      https://github.com/SuperDaveOrg/Nexpill/releases/download/v%v/nexpill-%v-armeabi-v7a.apk
    srclibs:
      - flutter@stable
    prebuild:
      - flutterVersion=$(sed -n -E "s/.*flutter-version:\ \"(.*)\"/\1/p" .github/workflows/ci.yml)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export repo=/tmp/nexpill-build
      - cd ..
      - mv com.superdavelab.nexpill $repo
      - pushd $repo
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
      - popd
      - mv $repo com.superdavelab.nexpill
    scandelete:
      - .pub-cache
    build:
      - export repo=/tmp/nexpill-build
      - cd ..
      - mv com.superdavelab.nexpill $repo
      - pushd $repo
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform
        android-arm
      - popd
      - mv $repo com.superdavelab.nexpill

