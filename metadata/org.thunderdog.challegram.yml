    versionCode: 1800202
    commit: 807947f544c82301859465cd8453531b4590a75b
    timeout: 18000
    submodules: true
    sudo:
      - apt-get update
      - apt-get install -y gperf build-essential cmake libssl-dev zlib1g-dev automake
        libtool
    gradle:
      - MarshmallowArm64
    output: app/build/outputs/apk/*/release/*.apk
    rm:
      - tdlib/source
      - app/jni/tgvoip/third_party/webrtc/test
    scanignore:
      - app/src/main/assets/fonts
    scandelete:
      - app/jni
      - thirdparty
      - tdlib
    build: ./scripts/setup.sh --skip-sdk-setup
    ndk: r27d

