Binaries: 
  https://github.com/rusty4444/hermes-android/releases/download/v%v/app-arm64-v8a-release.apk

Builds:
  - versionName: 3.2.8
    versionCode: 30361
    commit: aec30417b91da388d2962cb3c6af1933ee6b7cd7
    sudo:
      - mkdir -p /home/runner/work/hermes-android
      - rm -rf /home/runner/work/hermes-android/hermes-android
      - chown vagrant -R /home/runner/work
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    binary: 
      https://github.com/rusty4444/hermes-android/releases/download/v%v/app-armeabi-v7a-release.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
    prebuild:
      - flutterVersion=$(sed -n -E "s/.*flutter-version:\ '(.*)'/\1/p" .github/workflows/release.yml)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f "$flutterVersion"
      - export repo=/home/runner/work/hermes-android/hermes-android
      - cd ..
      - mv com.hermesagent.hermes_android $repo
      - pushd $repo
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
      - popd
      - mv $repo com.hermesagent.hermes_android
    scanignore:
      - third_party/sources/embedded-fcm-distributor-3.1.0/embedded-fcm-distributor-3.1.0-upstream.tar.gz
      - third_party/sources/embedded-fcm-distributor-3.1.0/embedded-fcm-distributor-3.1.0-sources.jar
    scandelete:
      - .pub-cache
      - docs/recovery-owner-detach/case-ids.json.gz
      - docs/recovery-owner-detach/evidence.tar.gz
      - docs/approval-authority-received-outcomes/case-ids.json.gz
      - docs/approval-authority-received-outcomes/evidence.tar.gz
      - docs/mutation-observer-isolation/case-ids.json.gz
      - docs/mutation-observer-isolation/evidence.tar.gz
      - docs/main-81d-integration/case-ids.json.gz
      - docs/main-81d-integration/evidence.tar.gz
      - docs/unreconciled-output/case-ids.json.gz
      - docs/unreconciled-output/oracles-raw.tar.gz
      - docs/unreconciled-output/oracles-policy.tar.gz
    build:
      - export repo=/home/runner/work/hermes-android/hermes-android
      - cd ..
      - mv com.hermesagent.hermes_android $repo
      - pushd $repo
      - export PUB_CACHE=$(pwd)/.pub-cache
      - sed -i -e 's/-Wl,/-Wl,--build-id=none,/' .pub-cache/hosted/pub.dev/jni-1.0.0/src/CMakeLists.txt
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform="android-arm"
        --split-debug-info=symbols
      - popd
      - mv $repo com.hermesagent.hermes_android

