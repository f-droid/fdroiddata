  - Note
License: MIT
AuthorName: Mikhail Basov
SourceCode: https://github.com/mvbasov/OMN-Go
IssueTracker: https://github.com/mvbasov/OMN-Go/issues

AutoName: OMN-Go

RepoType: git
Repo: https://github.com/mvbasov/OMN-Go.git

Builds:
  - versionName: 1.11.33
    versionCode: 111331
    commit: daafa15873fc9fef9293b790a3e5c51ebd0420da
    subdir: android/app
    sudo:
      - apt-get update
      - apt-get install -y golang-go gcc libc-dev
    gradle:
      - fdroid
    output: build/outputs/apk/fdroid/release/*-armeabi-v7a-release.apk
    srclibs:
      - go@go1.25.12
    prebuild: sdkmanager "platforms;android-34" "build-tools;33.0.1"
    scanignore:
      - local/icons/res-drawable.zip
    build:
      - export GOROOT_BOOTSTRAP=$(go env GOROOT)
      - pushd $$go$$/src
      - ./make.bash
      - popd
      - export GOROOT=$$go$$
      - export GOPATH="$HOME/go"
      - export PATH="$GOROOT/bin:$GOPATH/bin:$PATH"
      - cd ../..
      - sh android/fdroid_fetch_assets.sh
      - go get -tool golang.org/x/mobile/cmd/gobind golang.org/x/mobile/cmd/gomobile
      - go mod tidy
      - go install golang.org/x/mobile/cmd/gobind
      - go install golang.org/x/mobile/cmd/gomobile
      - gomobile init
      - mkdir -p android/app/libs
      - gomobile bind -target=android -androidapi 24 -javapkg net.basov.omngo -ldflags="-s
        -w" -o android/app/libs/omngo.aar ./backend
      - cd android/app
    ndk: 25.2.9519653

