AutoName: QR Jukebox

RepoType: git
Repo: https://github.com/lexygo/QRJukebox.git

Builds:
  - versionName: 1.0.15
    versionCode: 131
    commit: ccac4364a5a54bbe134643fc68ecd83ac93b651c
    sudo:
      - mkdir -p /home/runner/work/QRJukebox
      - chown -R vagrant /home/runner/work/QRJukebox
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    binary: 
      https://github.com/LEXYGO/QRJukebox/releases/download/v%v/QR_Jukebox_v%v_armv7.apk
    srclibs:
      - flutter@stable
    prebuild:
      - flutterVersion=$(sed -n -E "s/.*FLUTTER_VERSION:\ '(.*)'/\1/p" .github/workflows/build-release.yml
        | head -n 1)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export repo=/home/runner/work/QRJukebox/QRJukebox
      - cd ..
      - mv com.lennardhanss.qrjukebox $repo
      - pushd $repo
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
      - cd -
      - mv $repo com.lennardhanss.qrjukebox
    scandelete:
      - .pub-cache
    build:
      - export repo=/home/runner/work/QRJukebox/QRJukebox
      - cd ..
      - mv com.lennardhanss.qrjukebox $repo
      - pushd $repo
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --no-tree-shake-icons --split-per-abi
        --target-platform="android-arm"
      - cd -
      - mv $repo com.lennardhanss.qrjukebox

