Builds:
  - versionName: 1.0.0
    versionCode: 11
    commit: e382c4d2a9a2e93b6256abc6554d8cbee47882bc
    sudo:
      - mkdir -p /build
      - chown -R vagrant /build
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    binary: 
      https://codeberg.org/pako/tubester/releases/download/v%v/app-armeabi-v7a-release.apk
    srclibs:
      - flutter@stable
    prebuild:
      - flutterVersion=$(sed -n -E 's/^\s*revision:\s*"(.+)"/\1/p' .metadata)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export repo=/build/tubester
      - cd ..
      - mv org.codeberg.pako.tubester $repo
      - pushd $repo
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
      - sed -i -e '1a add_link_options("LINKER:--build-id=none")' $PUB_CACHE/hosted/pub.dev/flutter_zxing-*/src/CMakeLists.txt
      - sed -i -e '1a add_link_options("LINKER:--build-id=none")' $PUB_CACHE/hosted/pub.dev/jni-*/src/CMakeLists.txt
      - popd
      - mv $repo org.codeberg.pako.tubester
    scandelete:
      - .pub-cache
    build:
      - export repo=/build/tubester
      - cd ..
      - mv org.codeberg.pako.tubester $repo
      - pushd $repo
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform=android-arm
      - popd
      - mv $repo org.codeberg.pako.tubester
    ndk: 28.2.13676358

