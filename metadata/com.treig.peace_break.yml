AntiFeatures:
  TetheredNet:
    en-US: Accounts, progress and the leaderboard are stored on a Supabase instance
      hosted by the author. Supabase itself is free software (Apache-2.0) and the
      database schema is in the repository, so the backend can be self-hosted, but
      the instance is set at build time and cannot be changed from within the app.
Categories:
  - Casual Game
License: GPL-3.0-only
AuthorName: Tristan Reig
SourceCode: https://github.com/tristan-reig/Peace-Break
IssueTracker: https://github.com/tristan-reig/Peace-Break/issues

AutoName: Peace Break

RepoType: git
Repo: https://github.com/tristan-reig/Peace-Break.git

Builds:
  - versionName: 1.0.0
    versionCode: 11
    commit: 448e22c1bc40eab8ea967f242f678d05793dea70
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    srclibs:
      - flutter@stable
    prebuild:
      - flutterVersion=$(sed -n -E "s/^\s+flutter:\s*([0-9.]+)/\1/p" pubspec.yaml)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --config-only --release
      - cd android && ./gradlew assembleRelease

