AuthorEmail: gnosiworks@proton.me
SourceCode: https://github.com/GnosiWorks/Kryfo
IssueTracker: https://github.com/GnosiWorks/Kryfo/issues
Changelog: https://github.com/GnosiWorks/Kryfo/blob/HEAD/CHANGELOG.md

AutoName: Kryfo

RepoType: git
Repo: https://github.com/GnosiWorks/Kryfo.git

Builds:
  - versionName: 0.4.2
    versionCode: 201
    commit: da6f1ac180871b817710ee7cbc1ecea2661a8b60
    subdir: mobile
    sudo:
      - apt-get update
      - apt-get install -y --no-install-recommends -t trixie-backports golang-go
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    binary: 
      https://github.com/GnosiWorks/Kryfo/releases/download/v%v/app-armeabi-v7a-release.apk
    srclibs:
      - flutter@stable
      - go@go1.25.14
    rm:
      - mobile/ios
      - mobile/linux
      - mobile/macos
      - mobile/web
      - mobile/windows
    prebuild:
      - sed -i '/android.builder.sdkDownload=false/d' android/gradle.properties
      - 'flutterVersion=$(sed -n -E "s/^  flutter: ([0-9.]+)$/\1/p" pubspec.yaml)'
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
    scanignore:
      - mobile/assets/geo/places.bin.gz
      - mobile/assets/geo/world.bin
    scandelete:
      - mobile/.pub-cache
      - engine/vendor/gitlab.com/yawning/edwards25519-extra/h2c/testdata
      - engine/vendor/github.com/bytedance/sonic/testdata
      - engine/vendor/github.com/alexballas/go-libtor/linux/tor/src/ext/equix/Cargo.toml
    build:
      - pushd $$go$$/src
      - ./make.bash
      - popd
      - export GOROOT=$$go$$
      - export PATH=$GOROOT/bin:$PATH
      - export ANDROID_NDK_HOME=$$NDK$$
      - export PUB_CACHE=$(pwd)/.pub-cache
      - export CGO_ENABLED=1
      - export GOFLAGS=-trimpath
      - export CGO_LDFLAGS="-Wl,--build-id=none"
      - export HALO_FULL=1
      - cd ../engine
      - bash build.sh
      - cd ../mobile
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform=android-arm
    ndk: r28c

