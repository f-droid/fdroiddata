AutoName: FrOSCon Fahrplan
Description: |
  Programm App für die FrOSCon.

  https://froscon.org

  Freie Software und Open Source - das sind die Themen der FrOSCon.
  Jedes Jahr im Spätsommer veranstaltet der Fachbereich Informatik
  der Hochschule Bonn-Rhein-Sieg mit Hilfe des FrOSCon e.V. ein
  spannendes Programm mit Vorträgen und Workshops für Besucher aller
  Altersklassen, die Freie Software nutzen, kennenlernen wollen oder
  selbst entwickeln. Eine Ausstellung mit Ständen von Open-Source
  Projekten und Firmen rundet das Angebot ab. Beim Social Event am
  Samstagabend können sich Besuchende, Vortragende und Helfer_innen
  austauschen und zusammen feiern. 

  <b>Funktionen:</b>
  * Tagesüberblick über alle Programmpunkte (Vorträge, Workshop, Lounge)
  * Detaillierte Beschreibung von Veranstaltungen lesen
  * Veranstaltungen in persönlicher Favoritenliste verwalten
  * Alle Veranstaltungen durchsuchen und filtern
  * Favoritenliste exportieren
  * Alarm für Veranstaltungen setzen
  * Veranstaltungen in Kalender eintragen
  * Beschreibung und Link zu Veranstaltungen mit anderen teilen
  * Automatische, regelmäßige Aktualisierung des Programms
  * Programmänderungen einsehen
  * Bewertungen und Kommentare für Vorträge und Workshops hinterlassen
  * Integration mit dem Helfer_innen-System https://helfen.froscon.org - Online-Tool für Helfer- und Schichtplanung auf großen Events
  * Integration mit Chaosflix https://github.com/NiciDieNase/chaosflix - Android App für https://media.ccc.de, teile Fahrplan-Favoriten mit Chaosflix und importiere sie als Bookmarks

  🔤 <b>Unterstützte Sprachen</b>
  (Programmtexte ausgenommen)
  * Dänisch
  * Deutsch
  * Deutsch, Österreich
  * Englisch
  * Finnisch
  * Französisch
  * Italienisch
  * Japanisch
  * Litauisch
  * Niederländisch
  * Polnisch
  * Portugiesisch, Brasilien
  * Portugiesisch, Portugal
  * Russisch
  * Spanisch
  * Schwedisch
  * Türkisch

  🤝 Du kannst mithelfen, die App zu übersetzen. Siehe Link hier.

  💡 Inhaltliche Fragen zum Programm kann nur das FrOSCon-Content-Team
  beantworten. Diese App stellt lediglich das Programm zur Verfügung.

  💣 Fehlerberichte sind herzlich willkommen, aber achte darauf,
  dass du erklärst, wie man den Fehler reproduzieren kann. Bitte
  nutze den Issue-Tracker: https://github.com/EventFahrplan/EventFahrplan/issues.

  🏆 Die App basiert auf der <b>EventFahrplan-App</b>
  https://play.google.com/store/apps/details?id=info.metadude.android.congress.schedule
  für den Kongress des Chaos Computer Clubs. Der Quellcode der Anwendung ist auf GitHub
  https://github.com/johnjohndoe/CampFahrplan/tree/froscon-2026 zu finden.

  🎨 Das FrOSCon-Logo steht unter der Creative Commons License (CC BY-ND 3.0 DE).

