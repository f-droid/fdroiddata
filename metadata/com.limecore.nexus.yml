Builds:
  - versionName: 1.7.2
    versionCode: 26
    commit: 190187b2f9bc755b4776f771b1146f67d90dab4d
    subdir: android/app
    sudo:
      - echo "deb https://deb.debian.org/debian forky main" > /etc/apt/sources.list.d/forky.list
      - apt-get update
      - apt-get install -y -t forky nodejs npm
    init:
      - cd ../..
      - npm ci
    gradle:
      - yes
    prebuild:
      - cd ../..
      - npm run build
      - npx cap sync android
    scandelete:
      - node_modules

