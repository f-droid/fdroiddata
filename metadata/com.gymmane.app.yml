Builds:
  - versionName: 1.0.0
    versionCode: 11
    commit: baceaf087cd945ed55b2ab8f1d98fd02e1fb470d
    sudo:
      - mkdir -p /home/runner/work/GymMane
      - chown -R vagrant /home/runner
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    binary: https://github.com/InlitX/GymMane/releases/download/v%v/GymMane-armeabi-v7a.apk
    srclibs:
      - flutter@stable
    prebuild:
      - flutterVersion=$(sed -n -E "s/.*FLUTTER_VERSION:\ '(.*)'/\1/p" .github/workflows/build-apk.yml)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - cd ..
      - mv com.gymmane.app /home/runner/work/GymMane/GymMane
      - pushd /home/runner/work/GymMane/GymMane
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
      - sed -i -e 's/-Wl,/-Wl,--build-id=none,/' "$PUB_CACHE"/hosted/pub.dev/jni-*/src/CMakeLists.txt
      - popd
      - mv /home/runner/work/GymMane/GymMane com.gymmane.app
    scandelete:
      - .pub-cache
    build:
      - cd ..
      - mv com.gymmane.app /home/runner/work/GymMane/GymMane
      - pushd /home/runner/work/GymMane/GymMane
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --split-debug-info=build/symbols
      - popd
      - mv /home/runner/work/GymMane/GymMane com.gymmane.app

