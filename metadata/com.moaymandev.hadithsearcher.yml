AntiFeatures:
  NonFreeNet:
    en-US: Optional crash reports and analytics use Sentry and PostHog. The startup
      choices take effect after Continue and can be disabled in Settings.
  Tracking:
    en-US: Crash reports and usage analytics are preselected on first launch. Uncheck
      either option before Continue to keep it disabled.
  TetheredNet:
    en-US: Search uses a hosted Dorar Hadith API endpoint that cannot be changed in
      the app settings.
