MaintainerNotes: |-
  Publish all three signed FOSS APKs from scripts/release.py foss on the
  <versionName> GitHub release. GitHub and F-Droid distribute the same APKs.
  Each ABI has a per-build binary URL. F-Droid must reproduce each APK before
  publishing the upstream signature. The updater checks both sources once a day
  unless disabled in Settings.

  Search uses https://hadith-searcher-dorar-api-amx.vercel.app, backed by
  https://github.com/MAymanKH/dorar-hadith-api and content from https://dorar.net.
  The API endpoint can be changed at build time, but not in the app settings.
  Please review service and content licensing during inclusion.

  Sentry and PostHog SDKs are included. Both options are preselected on first
  launch; SDKs start only after Continue with the saved selections.
  See docs/telemetry.md and the privacy policy linked in the store description.

  The unsigned builder uses /var/tmp/hadithsearcher-foss for stable Dart URIs
  and disables the JNI native library build ID. Both upstream and recipe use it.

  The Flutter version is read from upstream .flutter-version. The foss flavor
  excludes the Shorebird asset and does not enable the Play update implementation.
  Play-only sources and the Play dependency declaration are removed before scanning.

  Base version codes in pubspec.yaml are divisible by 10. ABI suffixes are
  1 for arm64-v8a, 2 for armeabi-v7a, and 3 for x86_64. VercodeOperation
  generates all three update recipes from each new base version code.

AutoUpdateMode: Version
UpdateCheckMode: Tags ^[0-9]+\.[0-9]+\.[0-9]+$
VercodeOperation:
  - '%c+1'
  - '%c+2'
  - '%c+3'
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
