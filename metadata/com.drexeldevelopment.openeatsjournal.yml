AutoName: Open Eats Journal

RepoType: git
Repo: https://github.com/Drexel2k/OpenEatsJournal.git

Builds:
  - versionName: '1.19'
    versionCode: 371
    commit: e011e3f53b5d6be00516d75e9ea6ad30ba7bb93e
    sudo:
      - mkdir -p /home/runner/work/OpenEatsJournal
      - chown -R vagrant /home/runner
    output: src/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    binary: 
      https://github.com/Drexel2k/OpenEatsJournal/releases/download/%v/openeatsjournal-fdroid-v%v-armeabi-v7a.apk
    srclibs:
      - flutter@stable
    rm:
      - src/ios
    prebuild:
      - export repo=/home/runner/work/OpenEatsJournal/OpenEatsJournal
      - cd ..
      - mv com.drexeldevelopment.openeatsjournal $repo
      - pushd $repo/src
      - export APP_CONTACT_EMAIL="$(printf '%s' 'ZHJleGVsLmRldmVsb3BtZW50QGdtYWlsLmNvbQ=='
        | base64 -d)"
      - export APP_CONTACT_ADDRESS="$(printf '%s' 
        'TWF0dGhpYXMgTmFja2VcXG5GYWxrc3RyLiAxMmJcXG40NDgwOSBCb2NodW1cXG5cXG4ke2FwcENvbnRhY3RNYWlsIX0='
        | base64 -d)"
      - sed -i "s|String? get appContactMail => null;|String? get appContactMail =>
        \"$APP_CONTACT_EMAIL\";|g" lib/repository/settings_repository.dart
      - sed -i "s|String? get appContactAddress => null;|String? get appContactAddress
        => \"$APP_CONTACT_ADDRESS\";|g" lib/repository/settings_repository.dart
      - flutterVersion=$(sed -n -E "s/.*flutter-version:\ '(.*)'/\1/p" ../.github/workflows/release.yml
        | head -n1)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
      - sed -i -e 's/-Wl,/-Wl,--build-id=none,/' $PUB_CACHE/hosted/pub.dev/jni-*/src/CMakeLists.txt
      - sed -i -e 's/-Wl,/-Wl,--build-id=none,/' $PUB_CACHE/hosted/pub.dev/flutter_zxing-*/src/CMakeLists.txt
      - popd
      - mv $repo com.drexeldevelopment.openeatsjournal
    scandelete:
      - src/.pub-cache
    build:
      - export repo=/home/runner/work/OpenEatsJournal/OpenEatsJournal
      - cd ..
      - mv com.drexeldevelopment.openeatsjournal $repo
      - pushd $repo/src
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform="android-arm"
        --split-debug-info=build/symbols
      - popd
      - mv $repo com.drexeldevelopment.openeatsjournal

