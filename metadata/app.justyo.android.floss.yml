AntiFeatures:
  TetheredNet:
    en-US: Yo talks only to the Yo Hub (its server, open source in the same repository).
Categories:
  - Messaging
License: MIT
AuthorName: YoAgain
WebSite: https://justyo.co
SourceCode: https://github.com/YoAgain/yo
IssueTracker: https://github.com/YoAgain/yo/issues
Changelog: https://github.com/YoAgain/yo/releases

AutoName: Yo

RepoType: git
Repo: https://github.com/YoAgain/yo.git

Builds:
  - versionName: 1.0.0-RC39
    versionCode: 39
    commit: fc4d4d5cec7acdf1c9c4e83288d887aa8f96a2d0
    subdir: app/android/app
    sudo:
      - apt-get update
      - apt-get install -y protobuf-compiler clang cmake ninja-build rustup
    gradle:
      - floss
    prebuild:
      - rustup toolchain install 1.100.0 --profile minimal --target aarch64-linux-android,x86_64-linux-android
      - rustup default 1.100.0
      - cargo install cargo-ndk --version 4.1.2 --locked
    scandelete:
      - fuzz/seeds
    ndk: 30.0.16248370

  - versionName: 1.0.0-RC46
    versionCode: 46
    commit: 83a32acb1a1d6a5f6a480c1299cd3cd16c2ee83e
    subdir: app/android/app
    sudo:
      - apt-get update
      - apt-get install -y protobuf-compiler clang cmake ninja-build rustup
    gradle:
      - floss
    prebuild:
      - rustup toolchain install 1.100.0 --profile minimal --target aarch64-linux-android,x86_64-linux-android
      - rustup default 1.100.0
      - cargo install cargo-ndk --version 4.1.2 --locked
    scandelete:
      - tests/fuzz/seeds
    ndk: 30.0.16248370

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[0-9]+\.[0-9]+\.[0-9]+(-RC[0-9]+)?$
UpdateCheckData: app/android/version.properties|versionCode=(\d+)|.|versionName=(.+)
CurrentVersion: 1.0.0-RC46
