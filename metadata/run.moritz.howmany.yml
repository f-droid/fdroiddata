MaintainerNotes: |-
  Counts objects in a photo with a few-shot model (GeCo2) run on-device by
  ONNX Runtime; the app has no internet permission.

  The APK bundles a pre-exported, int8-quantized ONNX model. The Gradle build
  downloads it from the pinned GitHub release v1 asset and checks it against a
  SHA-256 hard-coded in app/build.gradle.kts, so no model is trained or
  exported during the build. Its provenance and license are documented at
  https://github.com/EiSiMo/howmany/blob/main/model/PROVENANCE.md. A local
  export in model/data takes precedence over the download.

  Reproducible: the signed release APK is rebuilt byte-for-byte from the tagged
  commit with JDK 21; Binaries and AllowedAPKSigningKeys publish the upstream
  signature. Native libraries ship unstripped (keepDebugSymbols) so the build is
  reproducible across NDKs.

