AutoName: RZR

RepoType: git
Repo: https://github.com/bilalsul/rzr.git

Builds:
  - versionName: 0.6.9
    versionCode: 261
    commit: 25849677c37f2147afa3e8c40d2cae47354320ba
    sudo:
      - mkdir -p /home/runner/work/rzr
      - chown -R vagrant /home/runner
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    binary: 
      https://github.com/bilalsul/rzr/releases/download/v%v/RZR-android-%v-armeabi-v7a.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
      - linux
      - macos
      - web
      - windows
    prebuild:
      - flutterVersion=$(cat .github/flutter-version)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export repo=/home/runner/work/rzr/rzr
      - cd ..
      - mv bilalsul.rzr $repo
      - pushd $repo
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
      - $$flutter$$/bin/flutter gen-l10n
      - popd
      - mv $repo bilalsul.rzr
    scandelete:
      - .pub-cache
    build:
      - export repo=/home/runner/work/rzr/rzr
      - cd ..
      - mv bilalsul.rzr $repo
      - pushd $repo
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/dart run build_runner build --delete-conflicting-outputs
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform="android-arm"
        --dart-define=isFdroid=true
      - popd
      - mv $repo bilalsul.rzr

