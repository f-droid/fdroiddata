Builds:
  - versionName: 1.0.3
    versionCode: 41
    commit: 69877ce3f8d02c00e5f4ab33342a34378520ae7f
    subdir: app
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    binary: 
      https://github.com/RuslanLit/Tutor_Language/releases/download/v%v/TutorLanguage-%v-armeabi-v7a-signed.apk
    srclibs:
      - flutter@stable
    prebuild:
      - flutterVersion=$(sed -n -E "s/^FLUTTER_VERSION=(.*)$/\1/p" ../tool/release/TOOLCHAIN.env)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
    scandelete:
      - app/.pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform=android-arm

