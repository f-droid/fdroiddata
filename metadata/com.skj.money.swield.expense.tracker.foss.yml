AutoName: Money Swield

RepoType: git
Repo: https://github.com/skj-skj/Money-Swield.git

Builds:
  - versionName: 1.0.2
    versionCode: 10001
    commit: b8f1b1572e58ee667c3a49a3b4e7effaaac361c0
    sudo:
      - mkdir -p /home/runner/work/Money-Swield
      - chown -R vagrant /home/runner
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-foss-release.apk
    binary: 
      https://github.com/skj-skj/Money-Swield/releases/download/v%v/money-swield-%v-foss-armeabi-v7a.apk
    srclibs:
      - flutter@stable
    rm:
      - android/app/src/play
      - android/app/src/playNoSms
      - ios
    prebuild:
      - flutterVersion=$(sed -n -E "s/.*flutter-version:\s*'?([0-9.]+)'?.*/\1/p" .github/workflows/release.yml)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - sed -i -e '/signingConfigs.getByName("debug")/d' android/app/build.gradle.kts
      - export repo=/home/runner/work/Money-Swield/Money-Swield
      - cd ..
      - mv com.skj.money.swield.expense.tracker.foss $repo
      - pushd $repo
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
      - sed -i -e 's/-Wl,/-Wl,--build-id=none,/' $PUB_CACHE/hosted/pub.dev/jni-*/src/CMakeLists.txt
      - grep -q -- --build-id=none $PUB_CACHE/hosted/pub.dev/jni-*/src/CMakeLists.txt
      - popd
      - mv $repo com.skj.money.swield.expense.tracker.foss
    scandelete:
      - .pub-cache
    build:
      - export repo=/home/runner/work/Money-Swield/Money-Swield
      - cd ..
      - mv com.skj.money.swield.expense.tracker.foss $repo
      - pushd $repo
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --flavor foss --split-per-abi
        --target-platform=android-arm
      - popd
      - mv $repo com.skj.money.swield.expense.tracker.foss
    ndk: r28c

