MaintainerNotes: |-
  app/src/main/assets/safety is data, not code (scanignore): the bundled
  link-list snapshot as gzipped text tables and one binary table, list.bin,
  built from the public list repository
  https://gitlab.com/verdettoqr/link-safety-list by its own tooling.
  core/fixtures and tools/screens/fixtures/hot-fixture are test and rig data
  the release build never reads (scandelete).

