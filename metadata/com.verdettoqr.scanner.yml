AntiFeatures:
  TetheredNet:
    en-US: Online lookups (recalls, products, vehicles) use the developer's own service;
      they are on by default and turned off with one switch in Settings.
    ar: عمليات البحث عبر الإنترنت (الاستدعاءات والمنتجات والمركبات) تستخدم خدمة المطوّر
      الخاصة؛ وهي مفعّلة افتراضيًا وتُوقَف بمفتاح واحد في الإعدادات.
    bn-BD: অনলাইন অনুসন্ধান (রিকল, পণ্য, যানবাহন) ডেভেলপারের নিজস্ব পরিষেবা ব্যবহার
      করে; এটি ডিফল্টভাবে চালু থাকে এবং সেটিংসে একটি সুইচে বন্ধ করা যায়।
    cs-CZ: Online vyhledávání (stažení z trhu, produkty, vozidla) používá vlastní
      službu vývojáře; ve výchozím stavu je zapnuté a vypíná se jedním přepínačem
      v Nastavení.
    da-DK: Onlineopslag (tilbagekaldelser, produkter, køretøjer) bruger udviklerens
      egen tjeneste; de er slået til som standard og slås fra med én kontakt i Indstillinger.
    de-DE: Online-Abfragen (Rückrufe, Produkte, Fahrzeuge) nutzen den eigenen Dienst
      des Entwicklers; sie sind standardmäßig an und lassen sich mit einem Schalter
      in den Einstellungen abstellen.
    el-GR: Οι διαδικτυακές αναζητήσεις (ανακλήσεις, προϊόντα, οχήματα) χρησιμοποιούν
      την υπηρεσία του ίδιου του προγραμματιστή· είναι ενεργές από προεπιλογή και
      απενεργοποιούνται με έναν διακόπτη στις Ρυθμίσεις.
    es-ES: Las consultas en línea (retiradas, productos, vehículos) usan el servicio
      propio del desarrollador; están activadas por defecto y se apagan con un interruptor
      en Ajustes.
    fa: استعلام‌های آنلاین (فراخوان‌ها، محصولات، خودروها) از سرویس خودِ توسعه‌دهنده
      استفاده می‌کنند؛ به‌طور پیش‌فرض روشن‌اند و با یک کلید در تنظیمات خاموش می‌شوند.
    fi-FI: Verkkohaut (takaisinvedot, tuotteet, ajoneuvot) käyttävät kehittäjän omaa
      palvelua; ne ovat oletuksena päällä, ja ne poistetaan käytöstä yhdellä kytkimellä
      Asetuksissa.
    fr-FR: Les recherches en ligne (rappels, produits, véhicules) utilisent le service
      du développeur lui-même ; elles sont activées par défaut et se coupent d'un
      seul interrupteur dans les Paramètres.
    hi-IN: ऑनलाइन खोज (रिकॉल, उत्पाद, वाहन) डेवलपर की अपनी सेवा का उपयोग करती है;
      यह डिफ़ॉल्ट रूप से चालू है और सेटिंग में एक स्विच से बंद की जा सकती है।
    hu-HU: Az online lekérdezések (visszahívások, termékek, járművek) a fejlesztő
      saját szolgáltatását használják; alapértelmezés szerint be vannak kapcsolva,
      és a Beállításokban egyetlen kapcsolóval kikapcsolhatók.
    id: Pencarian online (penarikan, produk, kendaraan) memakai layanan milik pengembang
      sendiri; pencarian ini aktif secara bawaan dan dimatikan dengan satu sakelar
      di Pengaturan.
    it-IT: Le ricerche online (richiami, prodotti, veicoli) usano il servizio dello
      sviluppatore stesso; sono attive per impostazione predefinita e si disattivano
      con un solo interruttore nelle Impostazioni.
    iw-IL: חיפושים מקוונים (ריקולים, מוצרים, כלי רכב) משתמשים בשירות של המפתח עצמו;
      הם מופעלים כברירת מחדל ונכבים במתג אחד בהגדרות.
    ja-JP: オンライン照会（リコール、商品、車両）は開発者自身のサービスを使います。初期状態でオンで、設定のスイッチ一つで切れます。
    ko-KR: 온라인 조회(리콜, 제품, 차량)는 개발자 자체 서비스를 사용해요. 기본적으로 켜져 있고 설정에서 스위치 하나로 끌 수 있어요.
    ms: Carian dalam talian (penarikan balik, produk, kenderaan) menggunakan perkhidmatan
      pembangun sendiri; carian ini dihidupkan secara lalai dan dimatikan dengan satu
      suis di Tetapan.
    nl-NL: Online opzoekingen (terugroepacties, producten, voertuigen) gebruiken de
      eigen dienst van de ontwikkelaar; ze staan standaard aan en worden met één schakelaar
      in Instellingen uitgezet.
    no-NO: Nettoppslag (tilbakekallinger, produkter, kjøretøy) bruker utviklerens
      egen tjeneste; de er på som standard og slås av med én bryter i Innstillinger.
    pl-PL: Wyszukiwania online (wycofania, produkty, pojazdy) korzystają z własnej
      usługi twórcy aplikacji; są domyślnie włączone i wyłącza się je jednym przełącznikiem
      w Ustawieniach.
    pt-BR: As consultas online (recalls, produtos, veículos) usam o serviço do próprio
      desenvolvedor; elas vêm ligadas por padrão e são desligadas com uma chave em
      Configurações.
    pt-PT: As consultas online (recolhas, produtos, veículos) usam o serviço do próprio
      programador; estão ativadas por predefinição e desativam-se com um só interruptor
      nas Definições.
    ro: Căutările online (rechemări, produse, vehicule) folosesc serviciul propriu
      al dezvoltatorului; sunt activate implicit și se dezactivează dintr-un singur
      comutator în Setări.
    ru-RU: Онлайн-запросы (отзывы, товары, автомобили) используют собственный сервис
      разработчика; они включены по умолчанию и отключаются одним переключателем в
      настройках.
    sv-SE: Uppslag online (återkallelser, produkter, fordon) använder utvecklarens
      egen tjänst; de är på som standard och stängs av med en brytare i Inställningar.
    th: การค้นหาออนไลน์ (การเรียกคืน สินค้า ยานพาหนะ) ใช้บริการของผู้พัฒนาเอง โดยเปิดอยู่โดยค่าเริ่มต้นและปิดได้ด้วยสวิตช์เดียวในการตั้งค่า
    tr-TR: Çevrimiçi sorgular (geri çağırmalar, ürünler, araçlar) geliştiricinin kendi
      hizmetini kullanır; varsayılan olarak açıktır ve Ayarlar'da tek bir anahtarla
      kapatılır.
    uk: Онлайн-запити (відкликання, товари, автомобілі) використовують власний сервіс
      розробника; їх увімкнено за замовчуванням, і вони вимикаються одним перемикачем
      у налаштуваннях.
    ur: آن لائن تلاش (ریکالز، پروڈکٹس، گاڑیاں) ڈیولپر کی اپنی سروس استعمال کرتی ہے؛
      یہ ڈیفالٹ طور پر آن رہتی ہے اور ترتیبات میں ایک سوئچ سے بند کی جا سکتی ہے۔
    vi: Tra cứu trực tuyến (thu hồi, sản phẩm, xe) dùng dịch vụ riêng của nhà phát
      triển; tính năng này bật theo mặc định và tắt bằng một công tắc trong Cài đặt.
    zh-CN: 在线查询（召回、商品、车辆）使用开发者自己的服务；默认开启，在设置里用一个开关即可关闭。
    zh-TW: 線上查詢（召回、商品、車輛）使用開發者自己的服務；預設開啟，在設定中一個開關即可關閉。
