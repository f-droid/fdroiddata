Repo: https://github.com/aryany9/MyLexicon.git

Builds:
  - versionName: 1.3.1
    versionCode: 51
    commit: d10c52acc30672e7972aa6fea32ff7567014a14f
    sudo:
      - mkdir -p /home/runner/work/MyLexicon
      - chown -R vagrant /home/runner
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    binary: 
      https://github.com/aryany9/MyLexicon/releases/download/v%v/MyLexicon-armeabi-v7a.apk
    srclibs:
      - flutter@stable
    prebuild:
      - flutterVersion=$(sed -n -E "s/.*FLUTTER_VERSION:\ '(.*)'/\1/p" .github/workflows/android-release.yml)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - cd ..
      - mv com.aryanyadav.mylexicon /home/runner/work/MyLexicon/MyLexicon
      - pushd /home/runner/work/MyLexicon/MyLexicon
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
      - sed -i -e 's/-Wl,/-Wl,--build-id=none,/' "$PUB_CACHE"/hosted/pub.dev/jni-*/src/CMakeLists.txt
      - popd
      - mv /home/runner/work/MyLexicon/MyLexicon com.aryanyadav.mylexicon
    scandelete:
      - .pub-cache
    build:
      - cd ..
      - mv com.aryanyadav.mylexicon /home/runner/work/MyLexicon/MyLexicon
      - pushd /home/runner/work/MyLexicon/MyLexicon
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --split-debug-info=build/symbols
      - popd
      - mv /home/runner/work/MyLexicon/MyLexicon com.aryanyadav.mylexicon

