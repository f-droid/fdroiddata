  - versionName: 2.0.1
    versionCode: 6
    commit: 89046224248edba14d3c697026a2192134ae36a1
    subdir: android/app
    sudo:
      - apt-get update
      - apt-get install -y golang-go make npm
    gradle:
      - foss
    srclibs:
      - esbuild@v0.21.5
    prebuild:
      - cd ../..
      - npm ci
    scanignore:
      - node_modules/@capacitor/cli/assets/capacitor-cordova-android-plugins.tar.gz
    scandelete:
      - node_modules
    build:
      - pushd $$esbuild$$
      - make esbuild
      - popd
      - cd ../..
      - cp $$esbuild$$/esbuild node_modules/@esbuild/linux-x64/bin/
      - cp $$esbuild$$/esbuild node_modules/esbuild/bin/
      - npm run build
      - npx cap sync android

