Builds:
  - versionName: 1.0.0-beta.8
    versionCode: 70111
    commit: 9ad1272fdb11063f370f3201d3ff001bff0ac34b
    sudo:
      - apt-get update
      - apt-get install -y golang-go make gcc libc-dev
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    binary: https://github.com/veil-notes/app/releases/download/v%v/%c.apk
    srclibs:
      - flutter@stable
      - openpgp-mobile@v1.13.0
    rm:
      - ios
      - linux
      - macos
      - web
      - windows
    prebuild:
      - "flutterVersion=$(sed -n 's/^[[:space:]]*flutter-version: \"\\([^\"]*\\)\"\
        [[:space:]]*$/\\1/p' .github/workflows/android-release.yml)"
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f "$flutterVersion"
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
      - python3 tool/fdroid/prepare_reproducible_build.py . "$$flutter$$"
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - export SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)
      - python3 tool/fdroid/build_openpgp.py "$$openpgp-mobile$$" --ndk "$$NDK$$"
      - pushd "$$openpgp-mobile$$"
      - pushd output/binding/android
      - openpgp_dir=($PUB_CACHE/hosted/pub.dev/openpgp-*)
      - find . -type f -name '*.so' -print0 | xargs --null -I{} mv "{}" "$openpgp_dir/android/src/main/{}"
      - popd
      - popd
      - $$flutter$$/bin/flutter build apk --release --build-number=$(( $$VERCODE$$
        / 10 )) --split-per-abi --target-platform="android-arm" --android-project-arg="filesystem-roots=$(pwd)"
        --android-project-arg=filesystem-scheme=org-dartlang-root
    ndk: 28.2.13676358

