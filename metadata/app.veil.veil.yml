MaintainerNotes: |
  Veil is an Android-first local-first encrypted notes application.
  Stable releases and numbered beta tags are tracked automatically.
  The repository keeps the existing application ID app.veil.veil so
  users can update existing installations without losing app-private data.

  Beta.8 uses base 7011 and version codes base * 10 + ABI (1, 2, 3).
  Increment the base by at least one for each future release.

  The openpgp package contains Android native libraries. The build recipe
  replaces those libraries with bindings compiled from openpgp-mobile source.

  Upstream-signed APK verification is enabled so the F-Droid build can remain
  compatible with existing GitHub installations. Do not accept the release if
  the reproducibility or signature checks fail.

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?$
VercodeOperation:
  - '%c * 10 + 1'
  - '%c * 10 + 2'
  - '%c * 10 + 3'
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 1.0.0-beta.8
