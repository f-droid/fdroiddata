Builds:
  - versionName: 1.3.5
    versionCode: 241
    commit: 8c6fcefd8336ce4eabceb5a35b216357331a0668
    subdir: android/app
    sudo:
      - apt-get update
      - apt-get install -y nodejs npm jq
    gradle:
      - yes
    binary: 
      https://github.com/afoni95/react-native-paperless/releases/download/%v/PaperlessNative-%v-armeabi-v7a.apk
    prebuild:
      - cd ../..
      - npm ci
      - jq '(.expo.plugins[] | select(type == "array" and .[0] == "expo-build-properties")
        | .[1].android.buildArchs) = ["armeabi-v7a"]' app.json > app.json.tmp
      - mv app.json.tmp app.json
      - sed -i "s/\(versionCode[^0-9]*\)[0-9]*/\1$$VERCODE$$/" app.json
      - npx expo prebuild --platform android --clean --no-install
      - bash scripts/patch-jdk21.sh
    scanignore:
      - node_modules/@react-native-async-storage/async-storage/android/build.gradle
      - node_modules/@react-native-community/netinfo/android/build.gradle
      - node_modules/expo-modules-autolinking/scripts/android/autolinking_implementation.gradle
      - node_modules/expo-modules-core/android/ExpoModulesCorePlugin.gradle
      - node_modules/react-native-safe-area-context/android/build.gradle
      - node_modules/react-native-screens/android/build.gradle
      - node_modules/react-native-svg/android/build.gradle
      - node_modules/react-native-webview/android/build.gradle
      - node_modules/react-native/sdks/hermesc/linux64-bin/hermesc
    scandelete:
      - node_modules
    ndk: 27.1.12297006

