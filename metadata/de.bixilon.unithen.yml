    srclibs:
      - zxing-cpp@v3.1.1
    prebuild:
      - git -C $$zxing-cpp$$ checkout -f $(cat libs/zxingcpp.ref)
      - cat libs/zxingcpp.cmake $$zxing-cpp$$/wrappers/android/zxingcpp/src/main/cpp/CMakeLists.txt
        > CMakeLists.txt
      - mv CMakeLists.txt $$zxing-cpp$$/wrappers/android/zxingcpp/src/main/cpp/CMakeLists.txt
    scandelete:
      - app/libs
    build:
      - pushd $$zxing-cpp$$
      - cd wrappers/android/zxingcpp
      - gradle assembleRelease
      - popd
      - cp $$zxing-cpp$$/wrappers/android/zxingcpp/build/outputs/aar/zxingcpp-release.aar
        libs/zxingcpp-release.aar
    gradleprops:
      - fdroid=true

