AntiFeatures:
  NonFreeNet:
    en-US: Optional turn-by-turn routing depends on GraphHopper, a proprietary network
      service that requires an API key from graphhopper.com.
    pt-BR: O roteamento ponto a ponto opcional depende do GraphHopper, um serviço
      de rede proprietário que exige uma chave de API do graphhopper.com.
  TetheredNet:
    en-US: The app fetches weather (Open-Meteo), map tiles (OpenFreeMap) and geocoding
      (OpenStreetMap Nominatim) from fixed third-party services that are not easily
      self-hostable or replaceable.
    pt-BR: O app busca clima (Open-Meteo), tiles de mapa (OpenFreeMap) e geocodificação
      (OpenStreetMap Nominatim) de serviços de terceiros fixos, de difícil auto-hospedagem
      ou substituição.
