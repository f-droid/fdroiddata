RepoType: git
Repo: https://gitlab.com/mudlej_android/mj_pdf_reader.git

Builds:
  - versionName: 3.1.0
    versionCode: 5801
    commit: 18f9a3b2f685cd26f7dc145b33f40f9e91a9c20f
    subdir: app
    sudo:
      - apt-get update
      - apt-get install -y python3-requests pkg-config cmake ninja-build gcc g++ libc-dev
        make
    gradle:
      - yes
    prebuild: sed -i 's/offset \* 1000 + android\.defaultConfig\.versionCode/$$VERCODE$$/'
      build.gradle
    build:
      - export ANDROID_NDK=$$NDK$$
      - export ANDROID_NDK_ROOT=$$NDK$$
      - cd ..
      - python3 build_dependencies.py --pdfium from-source --abi armeabi-v7a
    ndk: r28c
    gradleprops:
      - fdroidAbi=armeabi-v7a

