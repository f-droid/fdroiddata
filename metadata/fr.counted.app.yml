Builds:
  - versionName: 3.2.5
    versionCode: 3002005
    commit: b02dfae8896eb395a3e1db2cb88947ddbd0be17d
    subdir: packages/mobile
    sudo:
      - apt-get update
      - apt-get install -y make gcc g++ libc-dev pkg-config libssl-dev rustup
    output: ../../Counted-unsigned.apk
    prebuild:
      - rustup toolchain install 1.98.1 --profile minimal --target aarch64-linux-android
      - rustup default 1.98.1
      - cargo install dioxus-cli --version 0.7.10 --locked
    build:
      - export JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64 ANDROID_NDK_HOME=$$NDK$$
        PATH=$HOME/.cargo/bin:$PATH
      - cd ../..
      - cargo fetch --locked
      - make -f packages/mobile/android.mk android-fdroid-apk
    ndk: 25.2.9519653

