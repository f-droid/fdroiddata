Builds:
  - versionName: 0.12.1
    versionCode: 34
    commit: 9d32040ff8a177e8441adf1294ded9280ab99e0d
    subdir: mobile
    submodules: true
    sudo:
      - apt-get update
      - apt-get install -y npm make
    gradle:
      - yes
    srclibs:
      - rustup@1.27.1
    prebuild: sed -i -e '/minSdkVersion/a maxSdkVersion 32' -e '/targetSdkVersion/s/34/32/'
      build.gradle
    build:
      - cd ..
      - $$rustup$$/rustup-init.sh -y --default-toolchain 1.76.0 --target aarch64-linux-android
        armv7-linux-androideabi x86_64-linux-android i686-linux-android
      - source $HOME/.cargo/env
      - ./scripts/setup-rust-with-ndk.sh
      - env RELEASE=true make aw-server-rust
      - make aw-server-rust/aw-webui/dist
    ndk: r25c

  - versionName: 0.14.1
    versionCode: 42
    commit: a92177ac1beb7f2e49fd8a14a204f93b1a2bad68
    subdir: mobile
    submodules: true
    sudo:
      - apt-get update
      - apt-get install -y npm make rustup gcc libc-dev
    gradle:
      - yes
    prebuild: sed -i -e '/foojay/d' ../settings.gradle
    build:
      - cd ..
      - rustup default 1.98.1
      - rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
        i686-linux-android
      - ./scripts/setup-rust-with-ndk.sh
      - env RELEASE=true make aw-server-rust
      - make aw-server-rust/aw-webui/dist
    ndk: r28c

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[\d.]+$
