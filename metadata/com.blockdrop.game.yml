  - versionName: 1.0.26
    versionCode: 231
    commit: 9c60deb31a6ba5936d642b7e59907537deec4e20
    submodules: true
    sudo:
      - mkdir -p /home/runner/work/BlockDrop
      - chown -R vagrant /home/runner
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    binary: 
      https://github.com/brandonp2412/BlockDrop/releases/download/v%v/app-armeabi-v7a-release.apk
    rm:
      - ios
      - linux
      - web
      - windows
      - macos
    prebuild:
      - cd ..
      - export repo=/home/runner/work/BlockDrop/BlockDrop
      - mv com.blockdrop.game $repo
      - pushd $repo
      - export PUB_CACHE=$(pwd)/.pub-cache
      - ./flutter/bin/flutter config --no-analytics
      - ./flutter/bin/flutter pub get
      - popd
      - mv $repo com.blockdrop.game
    scanignore:
      - flutter/bin/cache
    scandelete:
