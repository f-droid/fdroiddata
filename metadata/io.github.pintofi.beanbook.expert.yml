Builds:
  - versionName: 1.0.1
    versionCode: 21
    commit: 52f3486c5821f824d85492574d7608700cf8e59a
    subdir: app
    sudo:
      - apt-get update
      - apt-get install -y python3.13 python3.13-venv rustup m4 gcc libc6-dev
    init: ../tools/build-wheels.sh --out ../wheels
    gradle:
      - expert
    output: build/outputs/apk/expert/release/*arm64-v8a*.apk
    binary: 
      https://github.com/pintofi/beanbook/releases/download/v%v/beanbook-%v-arm64-v8a.apk
    prebuild: echo "beancount.wheelDir=$(realpath ../wheels)" >> ../gradle.properties
    ndk: r27d

