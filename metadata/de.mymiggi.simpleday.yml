MaintainerNotes: Binary scanner detects `com.google.firebase.messaging.*` classes
  from the firebase-stub srclib (FLOSS stub). Only local notifications are used -
  no FCM/push. android/ is generated by `expo prebuild` at build time, so checkupdates
  reads the version from app.json via UpdateCheckData instead of build.gradle. Per-ABI
  split APKs (versionCode 1000*upstream+1/2/3 for armeabi-v7a/arm64-v8a/x86_64).

AutoUpdateMode: Version
UpdateCheckMode: Tags ^\d+\.\d+\.\d+$
VercodeOperation:
  - 1000 * %c + 1
  - 1000 * %c + 2
  - 1000 * %c + 3
UpdateCheckData: app.json|"versionCode":\s(\d+)|.|"version":\s"([^"]+)"
CurrentVersion: 1.4.0
CurrentVersionCode: 8003
