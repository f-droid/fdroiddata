  - Reading
License: AGPL-3.0-only
AuthorName: bearyjd
SourceCode: https://gitlab.com/selector4560/paperless-go
IssueTracker: https://github.com/bearyjd/paperless-go/issues

Name: Paperless Go
AutoName: Paperless Go

RepoType: git
Repo: https://gitlab.com/selector4560/paperless-go.git

Builds:
  - versionName: 1.1.7
    versionCode: 121
    commit: 230b54e7a73a55bc703256e9c02cf5d06073f7cf
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    srclibs:
      - flutter@stable
    prebuild:
      - flutterVersion=$(sed -n -E "s/.*flutter-version:\ '(.*)'/\1/p" .github/workflows/release.yml)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - sed -i -e '/google_mlkit/d' -e '/cunning_document_scanner/d' pubspec.yaml
      - sed -i 's/applicationId = "com.ventouxlabs.paperlessgo"/applicationId = "com.ventouxlabs.paperlessgo.nogoogle"/'
        android/app/build.gradle.kts
      - cp pubspec.lock.fdroid pubspec.lock
      - cp lib/features/scanner/processing/mlkit_deskew_stub.dart lib/features/scanner/processing/mlkit_deskew.dart
      - cp lib/features/scanner/processing/ocr_extractor_stub.dart lib/features/scanner/processing/ocr_extractor.dart
      - cp lib/features/scanner/document_scanner_stub.dart lib/features/scanner/document_scanner.dart
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform=android-arm

