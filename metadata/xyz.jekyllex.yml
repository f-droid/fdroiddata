    gradle:
      - yes
    scandelete:
      - app/srcLib/termux-packages/packages/python-torch/0011-dlopen-libc.so.patch
      - app/srcLib/termux-packages/packages/sideloader/plist-d-Add-filename-for-termux-libplist-2.0.so.diff
    ndk: r29
    gradleprops:
      - targetABI=armeabi-v7a

