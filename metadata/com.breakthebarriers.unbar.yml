AutoName: Unbar

RepoType: git
Repo: https://github.com/viahamed/unbar.git

Builds:
  - versionName: 1.0.1
    versionCode: 21
    commit: 93a652464d9699371793722a85d116c5b1816c0f
    subdir: android/app
    sudo:
      - apt-get update
      - apt-get install -y -t trixie-backports golang-1.26-go
    gradle:
      - yes
    output: build/outputs/apk/release/app-armeabi-v7a-release-unsigned.apk
    rm:
      - core/unbar-core-sources.jar
    prebuild:
      - sed -i -e '/REQUEST_INSTALL_PACKAGES/d' src/main/AndroidManifest.xml
      - sed -i -e 's/versionCode = .*/versionCode = $$VERCODE$$/' -e 's/include("arm64-v8a",
        "armeabi-v7a", "x86_64")/include("armeabi-v7a")/' -e 's/isUniversalApk = true/isUniversalApk
        = false/' build.gradle.kts
    build:
      - export PATH=/usr/lib/go-1.26/bin:$PATH GOTOOLCHAIN=local
      - export ANDROID_HOME=$$SDK$$ ANDROID_NDK_HOME=$$NDK$$
      - sdkmanager 'platforms;android-35'
      - pushd ../../core
      - go install golang.org/x/mobile/cmd/gomobile golang.org/x/mobile/cmd/gobind
      - export PATH=$(go env GOPATH)/bin:$PATH
      - gomobile init
      - gomobile bind -androidapi 21 -target android/arm -o ../android/app/libs/unbar-core.aar
        .
      - popd
    ndk: 27.2.12479018
    gradleprops:
      - fdroid

