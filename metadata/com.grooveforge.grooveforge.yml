AutoName: GrooveForge

RepoType: git
Repo: https://github.com/yakari/grooveforge.git

Builds:
  - versionName: 3.3.0
    versionCode: 771
    commit: 6b0af17326d8db5201c88560ebeb490b68423e01
    submodules: true
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
      - linux
      - macos
      - web
      - windows
      - libaudio_input.dylib
      - libdart_vst_host.dylib
      - lib/services/libaudio_input.dylib
      - native_audio/libaudio_input.dylib
      - packages/flutter_midi_pro/android/gradle/wrapper/gradle-wrapper.jar
      - packages/flutter_midi_pro/android/src/main/cpp/fluidsynth-src/test/manual
    prebuild:
      - FLUTTER_VERSION=$(sed -n -E "s/.*flutter-version:\ '(.*)'/\1/p" .github/workflows/release.yml
        | head -1)
      - '[[ $FLUTTER_VERSION ]]'
      - git -C $$flutter$$ checkout -f $FLUTTER_VERSION
      - sdkmanager 'cmake;3.22.1'
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform=android-arm
    ndk: r28c

