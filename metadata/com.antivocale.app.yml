RepoType: git
Repo: https://github.com/RisorseArtificiali/anti-vocale

Builds:
  - versionName: 1.9.2
    versionCode: 341
    commit: 6c444c6fe28f58a535045d62f1b9575bb3758393
    subdir: app
    sudo:
      - apt-get update
      - apt-get install -y wget build-essential cmake g++ zip unzip
    gradle:
      - fdroid
    output: build/outputs/apk/fdroid/release/app-fdroid-armeabi-v7a-release-unsigned.apk
    binary: 
      https://github.com/RisorseArtificiali/anti-vocale/releases/download/v%v/app-fdroid-armeabi-v7a-release.apk
    srclibs:
      - sherpa_onnx@142807252687d81b40d6315f23470a1512a00de3
      - reproducible-apk-tools@v0.3.0
    prebuild:
      - sed -E -i "/(crashlytics|com\.google\.firebase|com\.google\.gms)/d" build.gradle.kts
        ../build.gradle.kts
      - mkdir -p libs
    build:
      - pushd $$sherpa_onnx$$
      - export SHERPA_ONNX_ENABLE_JNI=ON SHERPA_ONNX_ENABLE_C_API=OFF
      - ./build-android-armv7-eabi.sh
      - popd
      - J=$$sherpa_onnx$$/android/SherpaOnnxAar/sherpa_onnx/src/main/jniLibs
      - mkdir -p $J/armeabi-v7a
      - cp $$sherpa_onnx$$/build-android-armv7-eabi/install/lib/lib*.so $J/armeabi-v7a/
      - gradle -p $$sherpa_onnx$$/android/SherpaOnnxAar :sherpa_onnx:assembleRelease
      - cp 
        $$sherpa_onnx$$/android/SherpaOnnxAar/sherpa_onnx/build/outputs/aar/sherpa_onnx-release.aar
        libs/sherpa-onnx.aar
    ndk: r27c
    postbuild:
      - mv $$OUT$$ unaligned.apk
      - $$reproducible-apk-tools$$/zipalign.py --page-size 16 --pad-like-apksigner
        --replace unaligned.apk $$OUT$$

