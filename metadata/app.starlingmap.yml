AntiFeatures:
  TetheredNet:
    en-US: The street basemap fetches tiles from tile.openstreetmap.org and the tile
      host cannot be changed in the app; the Off-grid basemap makes no tile requests.
      Location sharing defaults to the developer's relay at starlingmap.app. The relay
      is free software (MIT, in the same repository) and a custom relay address can
      be set in the app.
