AutoName: Mathe-Trainer

RepoType: git
Repo: https://github.com/chrbayer/mt.git

Builds:
  - versionName: 2.13.9
    versionCode: 213091
    commit: a615035b6ab37e600f9a34f271e853309bb5fed5
    sudo:
      - mkdir -p /home/chrbayer
      - chown -R vagrant /home/chrbayer
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    binary: https://github.com/chrbayer/mt/releases/download/v%v/mt-%v-armeabi-v7a.apk
    srclibs:
      - flutter@stable
    prebuild:
      - flutterVersion=$(cat .flutter-version)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export repo=/home/chrbayer/mt
      - cd ..
      - mv com.chrbayer.mathe_trainer $repo
      - pushd $repo
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
      - popd
      - mv $repo com.chrbayer.mathe_trainer
    scandelete:
      - .pub-cache
    build:
      - export repo=/home/chrbayer/mt
      - cd ..
      - mv com.chrbayer.mathe_trainer $repo
      - pushd $repo
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform=android-arm
        --dart-define=MT_VERSION=$$VERSION$$
      - popd
      - mv $repo com.chrbayer.mathe_trainer

