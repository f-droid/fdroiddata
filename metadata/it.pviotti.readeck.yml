SourceCode: https://github.com/pviotti/readeck-flutter
IssueTracker: https://github.com/pviotti/readeck-flutter/issues

AutoName: Readeck

RepoType: git
Repo: https://github.com/pviotti/readeck-flutter.git

Builds:
  - versionName: 0.3.4
    versionCode: 11
    commit: 91cf89c3d9ab49cd08594ba1d87131b10a8ba5f4
    sudo:
      - mkdir -p /home/runner/work/readeck-flutter
      - chown -R vagrant /home/runner
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    binary: 
      https://github.com/pviotti/readeck-flutter/releases/download/v%v/readeck-android-armeabi-v7a-release.apk
    srclibs:
      - flutter@stable
    rm:
      - linux
    prebuild:
      - flutterVersion=$(sed -n -E 's/.*FLUTTER_VERSION:\s*(.*)/\1/p' .github/workflows/ci.yml)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export repo=/home/runner/work/readeck-flutter
      - cd ..
      - mv it.pviotti.readeck $repo/readeck-flutter
      - pushd $repo/readeck-flutter
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
      - popd
      - mv $repo/readeck-flutter it.pviotti.readeck
    scandelete:
      - .pub-cache
    build:
      - export repo=/home/runner/work/readeck-flutter
      - cd ..
      - mv it.pviotti.readeck $repo/readeck-flutter
      - pushd $repo/readeck-flutter
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform="android-arm"
      - popd
      - mv $repo/readeck-flutter it.pviotti.readeck

