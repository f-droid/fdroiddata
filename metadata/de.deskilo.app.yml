IssueTracker: https://github.com/fdittgen-png/deskilo/issues
Changelog: https://github.com/fdittgen-png/deskilo/releases

AutoName: DesKilo

RepoType: git
Repo: https://github.com/fdittgen-png/deskilo.git

Builds:
  - versionName: 1.0.1
    versionCode: 21
    commit: d0b4d4e167e261644b289d8bc5948f1a3b253e9e
    sudo:
      - apt-get update
      - apt-get install -y --no-install-recommends cmake ninja-build
      - mkdir -p /home/runner/work/deskilo
      - chown -R vagrant /home/runner
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    binary: 
      https://github.com/fdittgen-png/deskilo/releases/download/v%v/deskilo-%v-armeabi-v7a.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
      - macos
      - web
      - windows
    prebuild:
      - export repo=/home/runner/work/deskilo/deskilo
      - cd ..
      - mv de.deskilo.app $repo
      - pushd $repo
      - flutterVersion=$(cat .flutter-version)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - bash tool/fdroid_foss_swap.sh
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
      - popd
      - mv $repo de.deskilo.app
    scandelete:
      - .pub-cache
    build:
      - export repo=/home/runner/work/deskilo/deskilo
      - cd ..
      - mv de.deskilo.app $repo
      - pushd $repo
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/dart run build_runner build --delete-conflicting-outputs
      - $$flutter$$/bin/flutter gen-l10n
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform=android-arm
      - popd
      - mv $repo de.deskilo.app

