Builds:
  - versionName: 1.19.0
    versionCode: 119001
    commit: e436f546f71481d786cbc2a74316b1be1ef678c1
    subdir: tools/viewer/android
    sudo:
      - apt-get update
      - apt-get install -y clang libclang-dev python3 ninja-build make rustup
    gradle:
      - yes
    output: app/build/outputs/apk/release/app-armeabi-v7a-release-unsigned.apk
    binary: 
      https://github.com/slint-ui/slint/releases/download/v%v/slint-viewer-armeabi-v7a.apk
    prebuild: sdkmanager "platforms;android-36" "build-tools;36.0.0"
    build:
      - export PATH=$HOME/.cargo/bin:$PATH
      - ./build-native.sh armeabi-v7a
      - echo "slint.abi=armeabi-v7a" >> gradle.properties
    ndk: r27

