MaintainerNotes: The build downloads a prebuilt libsqlite3 for the target ABI from
  a GitHub release (the sqlite3 package's Dart build hook, pulled in transitively)
  and verifies a hash hard-coded in that package. If that download is rate-limited
  or truncated the build fails with a hash-mismatch error naming the downloaded file.
  That is transient rather than a problem with this recipe - retrying the job has
  succeeded, and the upstream file hashes correctly.

