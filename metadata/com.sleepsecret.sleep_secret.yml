Builds:
  - versionName: 2.19.4
    versionCode: 219041
    commit: cc60c76b0eb59cef5f80fb01f0e2ed0656de1c00
    subdir: app
    sudo:
      - mkdir -p /home/runner/work/sleep-secret
      - chown -R vagrant /home/runner/work/sleep-secret
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    binary: 
      https://github.com/14790897/sleep-secret/releases/download/v%v/app-armeabi-v7a-release.apk
    srclibs:
      - flutter@stable
    rm:
      - app/windows
    prebuild:
      - "flutterVersion=$(sed -n -E \"s/.*FLUTTER_VERSION: '(.*)'/\\1/p\" ../.github/workflows/ci.yml)"
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - cd ../..
      - mv com.sleepsecret.sleep_secret /home/runner/work/sleep-secret/sleep-secret
      - pushd /home/runner/work/sleep-secret/sleep-secret/app
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
      - popd
      - mv /home/runner/work/sleep-secret/sleep-secret com.sleepsecret.sleep_secret
    scandelete:
      - app/.pub-cache
    build:
      - cd ../..
      - mv com.sleepsecret.sleep_secret /home/runner/work/sleep-secret/sleep-secret
      - pushd /home/runner/work/sleep-secret/sleep-secret/app
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --split-per-abi
      - popd
      - mv /home/runner/work/sleep-secret/sleep-secret com.sleepsecret.sleep_secret
    ndk: r28c

