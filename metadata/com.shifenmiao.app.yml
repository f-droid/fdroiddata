Builds:
  - versionName: 1.5.9
    versionCode: 159
    commit: 907cf83df83ad2e69419fcc4af75f1265b1181fe
    subdir: app
    sudo:
      - apt-get update
      - apt-get install -y make
    gradle:
      - foss
      - arm64
    prebuild:
      - sed -i -e '/mirrors.cloud.tencent.com/d' -e '/maven.aliyun.com/d' -e '/foojay/d'
        -e '/artifact.bytedance.com/,/^        }$/d' ../settings.gradle.kts ../build.gradle.kts
        ../build-logic/settings.gradle.kts
      - sed -i -e 's/-Xmx16g/-Xmx8g/' -e 's/-Xmx4g/-Xmx2g/' ../gradle.properties
      - echo 'org.gradle.workers.max=2' >> ../gradle.properties
      - echo 'subprojects { tasks.configureEach { if (name.contains("intVital")) enabled
        = false } }' >> ../build.gradle.kts
    scandelete:
      - core/weather/libs
      - web
    ndk: 30.0.16248370

