Builds:
  - versionName: 0.1.18
    versionCode: 1018
    commit: 7ee0811bab065e3caa7d16561c194050e0445e58
    subdir: app
    sudo: apt-get install -y golang-go
    gradle:
      - yes
    srclibs:
      - go@go1.24.13
    build:
      - pushd $$go$$/src
      - ./make.bash
      - popd
      - export PATH=$$go$$/bin:$PATH
      - mkdir -p src/main/jniLibs/arm64-v8a
      - CGO_ENABLED=0 GOOS=android GOARCH=arm64 go build -C ../core -trimpath -buildvcs=false
        -ldflags "-s -w -X main.version=$$VERSION$$" -o ../app/src/main/jniLibs/arm64-v8a/libparvaz.so
        ./cmd/parvazd

