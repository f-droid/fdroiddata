AntiFeatures:
  NonFreeNet:
    en-US: Optional Strava integration uses Strava OAuth + api/v3 via the Cloudflare
      Worker proxy at strava-proxy.alankyshum.workers.dev. Optional AI Coach requests
      go directly to OpenRouter and the selected hosted model using a user-supplied
      API key. Core workout/nutrition tracking is local-first and works fully offline.
Categories:
  - Sports & Health
  - Workout
License: AGPL-3.0-or-later
AuthorName: alankyshum
WebSite: https://github.com/alankyshum/cablesnap
SourceCode: https://github.com/alankyshum/cablesnap
IssueTracker: https://github.com/alankyshum/cablesnap/issues
Changelog: https://github.com/alankyshum/cablesnap/blob/HEAD/CHANGELOG.md

AutoName: CableSnap

RepoType: git
Repo: https://github.com/alankyshum/cablesnap.git

Builds:
  - versionName: 0.26.119
    versionCode: 187001
    commit: 35db6e07662d1dd1885c872c11b22d92bb5ec57c
    sudo:
      - apt-get update
      - apt-get install -y npm
    init:
      - node scripts/fdroid-prepare.js init
      - npm install
    output: android/app/build/outputs/apk/releaseFdroid/*.apk
    prebuild:
      - node scripts/fdroid-prepare.js prebuild-deps
      - CABLESNAP_FDROID=1 CI=true npx expo prebuild -p android --clean
      - FDROID_VERCODE=$$VERCODE$$ FDROID_ARCH=armeabi-v7a node scripts/fdroid-prepare.js
        prebuild
    scanignore:
      - node_modules/hermes-compiler/hermesc/linux64-bin/hermesc
      - node_modules/expo-modules-core/android/ExpoModulesCorePlugin.gradle
      - node_modules/@react-native-community/netinfo/android/build.gradle
      - node_modules/react-native-safe-area-context/android/build.gradle
      - node_modules/react-native-view-shot/android/build.gradle
    scandelete:
      - node_modules
    build:
      - npm install --ignore-scripts --no-save --omit=optional
      - cd android
      - CABLESNAP_FDROID=1 CI=true NODE_ENV=production SENTRY_DISABLE_AUTO_UPLOAD=true
        gradle --no-daemon assembleReleaseFdroid -x lintVitalAnalyzeRelease

