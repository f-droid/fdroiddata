AutoName: Daak

RepoType: git
Repo: https://github.com/darshitpp/daak.git

Builds:
  - versionName: 0.1.4
    versionCode: 51
    commit: 53c49398bcc060fbcf75cc9dd7133ac8fd5bba0a
    subdir: apps/mobile/android
    sudo:
      - apt-get update
      - apt-get install -y rustup nodejs npm build-essential
      - npm install -g pnpm@9.12.0
    init:
      - rustup default 1.98.1
      - rustup target add aarch64-linux-android armv7-linux-androideabi
    gradle:
      - yes
    output: app/build/outputs/apk/release/daak-*-armeabi-v7a.apk
    binary: https://github.com/darshitpp/daak/releases/download/v%v/daak-%v-armeabi-v7a.apk
    prebuild:
      - cd ../../..
      - sed -i -e 's/^reactNativeArchitectures=.*/reactNativeArchitectures=armeabi-v7a/'
        apps/mobile/android/gradle.properties
      - pnpm install --frozen-lockfile
      - cd apps/mobile/node_modules/@react-native/gradle-plugin
      - find . -name '*.kt*' -exec sed -i 's/(17)/(21)/;s/_17/_21/' {} +
      - cd -
      - cargo fetch --locked
    scanignore:
      - node_modules/.pnpm/hermes-compiler@*/node_modules/hermes-compiler/hermesc/linux64-bin/hermesc
    scandelete:
      - node_modules
    build:
      - cd ../../..
      - DAAK_CARGO_OFFLINE=0 bash apps/mobile/scripts/gen-android-ffi.sh
    ndk: 27.1.12297006

