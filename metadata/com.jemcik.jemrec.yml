MaintainerNotes: |-
  prebuild installs platforms;android-36 because AGP will not: nothing in the
  Gradle build declares it. The shell-side daemon is compiled outside Gradle by
  shellserver/build.sh, which reads platforms/android-36/android.jar by path
  (it links @hide framework internals, so it is built against the platform the
  device runs, not the app's compileSdk) and dexes it with
  build-tools/36.0.0/d8. AGP installs the compileSdk platform and build-tools
  36.0.0, its default, on its own. If the daemon's platform or build-tools
  version changes, ANDROID_PLATFORM and BUILD_TOOLS at the top of
  shellserver/build.sh say so.

