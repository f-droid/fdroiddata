Name: Storii - audiobookshelf client

RepoType: git
Repo: https://github.com/likhithpraveenk/storii

Builds:
  - versionName: 0.5.13
    versionCode: 5031
    commit: b5a60b4293e9986ab0d20186ebd5de10ba2dd155
    sudo:
      - mkdir -p /home/runner/work/storii
      - chown -R vagrant /home/runner/work
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    binary: 
      https://github.com/likhithpraveenk/storii/releases/download/v%v/storii-v%v-armeabi.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
    prebuild:
      - flutterVersion=$(sed -n -E 's/^[[:space:]]*flutter:[[:space:]]+([0-9]+\.[0-9]+\.[0-9]+)/\1/p'
        pubspec.yaml)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export repo=/home/runner/work/storii/storii
      - cd ..
      - mv com.likhithpraveenk.storii $repo
      - pushd $repo
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
      - sed -i -e 's/-Wl,/-Wl,--build-id=none,/' ${PUB_CACHE}/hosted/*/jni-*/src/CMakeLists.txt
      - popd
      - mv $repo com.likhithpraveenk.storii
    scandelete:
      - .pub-cache
    build:
      - export repo=/home/runner/work/storii/storii
      - cd ..
      - mv com.likhithpraveenk.storii $repo
      - pushd $repo
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform=android-arm
      - popd
      - mv $repo com.likhithpraveenk.storii

