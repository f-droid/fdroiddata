MaintainerNotes: |-
  Reproducible against the developer's signed APKs (binary: on each entry).

  usesCleartextTraffic is deliberate: self-hosted Plausible instances often run without TLS on a LAN. Since 1.4.0 the app shows a warning on an http server address and refuses to save one until the user ticks a box.

  Build in /tmp/build on both sides. The Dart AOT snapshot bakes in the absolute path to .dart_tool/flutter_build/dart_plugin_registrant.dart, so upstream CI builds from there too (.github/workflows/release.yml).

  Flutter is read out of upstream's release workflow at the pinned commit, 3.32.8 for these entries. android/app/build.gradle.kts sets each split's versionCode itself, in an androidComponents onVariants block computing flutter.versionCode * 10 + abiCode, because Flutter 3.32.x reads output.versionCodeOverride without ever assigning to it (flutter/flutter#169790). Recheck the versionCodes and the ndk: pin after any Flutter bump.

  Order matters in the last three build entries. Ascending versionCode, and each entry's output:/binary: must match the ABI its index implies (1 = armeabi-v7a, 2 = x86_64, 3 = arm64-v8a). checkupdates copies those entries verbatim and zips them against sorted versionCodes, so swapping two of them mislabels every autoupdate afterwards.

