Builds:
  - versionName: 2.5.0
    versionCode: 205001
    commit: 95ce633080e404fe085e7d6faff4870cb584044e
    subdir: android/app
    sudo:
      - apt-get update
      - apt-get install -y rustup build-essential
    gradle:
      - yes
    binary: 
      https://github.com/valnesfjord/tg-ws-proxy-rs/releases/download/v%v/tg-ws-proxy-rs-android-%v-armeabi-v7a.apk
    prebuild:
      - NDK_VERSION=$(sed -n -E 's/^ndk = "(.+)"/\1/p' ../../android/gradle/libs.versions.toml)
      - sdkmanager --install "ndk;$NDK_VERSION"
    gradleprops:
      - TG_ANDROID_ABIS=armeabi-v7a

