  - versionName: 2.1.1
    versionCode: 4
    commit: beb7d0a07a1a9d19dca1c8481108cf50c2b01aa2
    subdir: android/app
    sudo:
      - apt-get update
      - apt-get install -y build-essential rustup
    gradle:
      - fdroid
    prebuild:
      - rustup default 1.86.0
      - rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
        i686-linux-android
    build:
      - cargo install cargo-ndk --version "4.1.2" --locked
      - cd ../neuron-encrypt-jni
      - cargo ndk --platform 24 -t arm64-v8a -t armeabi-v7a -t x86_64 -t x86 -o ../app/src/main/jniLibs
        build --release
    ndk: r26b

