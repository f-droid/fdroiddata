Categories:
  - Puzzle Game
License: GPL-3.0-only
AuthorName: Sidhant
AuthorWebSite: https://sidhant947.github.io
SourceCode: https://github.com/sidhant947/water-sort
IssueTracker: https://github.com/sidhant947/water-sort/issues

AutoName: Water Sort

RepoType: git
Repo: https://github.com/sidhant947/water-sort.git

Builds:
  - versionName: 1.0.0
    versionCode: 11
    commit: 1090dd1192df6892ecb98c521d0687edd95d1eb3
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    srclibs:
      - flutter@stable
    prebuild:
      - git -C $$flutter$$ checkout -f $(sed -n -E "s/.*revision:\ \"(.*)\"/\1/p"
        .metadata)
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform=android-arm

