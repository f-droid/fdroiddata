Builds:
  - versionName: 0.2.0
    versionCode: 161
    commit: b23f4e8dd9fc34d0a9ec1418a6818d6f9f0ea5b9
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    binary: 
      https://codeberg.org/mathewmolt/WasteWorks/releases/download/v%v/WasteWorks-%v-armeabi-v7a.apk
    srclibs:
      - flutter@stable
    prebuild:
      - export version=$(sed -nE 's/^  flutter:\s*([0-9.]+)$/\1/p' pubspec.yaml)
      - git -C $$flutter$$ checkout -f $version
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
      - sed -i -e 's/-Wl,/-Wl,--build-id=none,/' $PUB_CACHE/hosted/*/jni-*/src/CMakeLists.txt
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform=android-arm
    ndk: 28.2.13676358

