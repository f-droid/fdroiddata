      - apt-get install -y build-essential libssl-dev zlib1g-dev libbz2-dev liblzma-dev
        libffi-dev
    init: git -C .. submodule update --init --depth 1 cpython
    gradle:
      - armeabi-v7a
    output: build/outputs/apk/armeabi-v7a/release/app-armeabi-v7a-release-unsigned.apk
    prebuild: sed -i "s|python3.11|$(realpath ../cpython)/python|" build.gradle.kts
    scandelete:
      - cpython/Tools/peg_generator/data/xxl.zip
      - cpython/Modules/_xxtestfuzz/fuzz_struct_unpack_corpus/varied_format_string
      - cpython/Modules/_xxtestfuzz/fuzz_struct_unpack_corpus/long_zero
      - cpython/Modules/_xxtestfuzz/fuzz_struct_unpack_corpus/hello_string
    build:
      - pushd ../cpython
      - ./configure --with-ensurepip=no --disable-test-modules
      - make -j$(nproc)
      - ./python -c 'import sys, ssl, zlib, bz2, lzma, ctypes; assert sys.version_info[:3]
        == (3, 11, 17)'
      - popd
    ndk: r30

