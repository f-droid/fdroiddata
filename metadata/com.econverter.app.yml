  - versionName: 1.2.0
    versionCode: 1301
    commit: ade3d4e9537a693f310a1598fd20a7c580f2d48c
    subdir: app
    sudo:
      - apt-get update
      - apt-get install -y build-essential libssl-dev zlib1g-dev libbz2-dev liblzma-dev
        libffi-dev
    gradle:
      - yes
    output: build/outputs/apk/release/app-armeabi-v7a-release-unsigned.apk
    srclibs:
      - cpython@v3.11.17
    prebuild: sed -i "s|python3.11|$(realpath $$cpython$$)/python|" build.gradle.kts
    build:
      - pushd $$cpython$$
      - ./configure --with-ensurepip=no
      - make -j$(nproc)
      - ./python -c 'import sys, ssl, zlib, bz2, lzma, ctypes; assert sys.version_info[:2]
        == (3, 11)'
      - popd
    ndk: r26b

