MaintainerNotes: |-
  Godot 4.7.2 project with a Rust GDExtension (native/shogi_core: move
  generation, rules, MCTS, ONNX inference via tract). Both the engine
  (editor + arm64 Android template) and the GDExtension are built from
  source; the export uses the scons-built android_release.apk as
  custom template and package/signed=false, so F-Droid signs the result.

  rustup comes from the Debian repository; the Rust toolchain is pinned
  in native/shogi_core/rust-toolchain.toml (1.99.1) — keep the
  `rustup toolchain install` version in sync with it. cargo-ndk version
  follows the one used upstream (4.1.2).

  Godot's android gradle template requires the NDK version from
  platform/android/java/app/config.gradle (29.0.14206865 for 4.7.2);
  swappy=no avoids Godot downloading a prebuilt Swappy binary.

  The Android template must be a full engine build: the GDExtension is
  built with godot-rust, which loads the method tables of every engine
  class at startup and panics ("Failed to load class method
  OpenXRExtensionWrapper::get_openxr_api") if any class is missing, so
  the extension never registers and the board stays empty. Do not pass
  disable_3d / disable_xr or module_*_enabled=no to the template_release
  build. Only the editor build (used just for --import and --export)
  drops unused modules to cut compile time; the extension is not needed
  there. Texture encoders (etcpak/astcenc) stay enabled because some
  textures are imported VRAM-compressed.

  models/bonanza.onnx (12 MB) is the policy + value network, trained by
  the upstream author with the sibling ShogiDojo project (GPL-3.0-or-later)
  on Floodgate game records published by the shogi-server project
  (Bonanza-method supervised training). The weights ship under the repo's
  GPL-3.0-or-later; provenance is in models/README.md upstream and in
  ShogiDojo's NOTICE.md. It is an app asset (export
  include_filter="*.onnx") loaded at runtime, not executable code.

  tools/fixtures/fixtures.bin is a byte-parity test fixture for the Rust
  position encoder (generated by tools/gen_fixtures.py from the ShogiDojo
  Python encoder); it is only read by `cargo test`, hence scandelete.

  The app UI is Japanese-only; fastlane metadata exists for ja and en-US.
  See models/README.md upstream for the ONNX model's provenance and licence.

