Builds:
  - versionName: 1.0.12
    versionCode: 20
    commit: c167ceebc644ff66d65f4bf8e8c2d4839af382a7
    timeout: 14400
    sudo:
      - apt-get update
      - apt-get install -y pkgconf scons g++ rustup libx11-dev libxcursor-dev libxinerama-dev
        libgl1-mesa-dev libglu1-mesa-dev libasound2-dev libpulse-dev libudev-dev libxi-dev
        libxrandr-dev
    output: seishingakuen.apk
    srclibs:
      - Godot@4.7.2-stable
    scandelete:
      - tools/fixtures/fixtures.bin
    build:
      - export ANDROID_NDK_ROOT=$$NDK$$
      - export ANDROID_HOME=$$SDK$$
      - export ANDROID_SDK_ROOT=$$SDK$$
      - export JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64
      - export PATH="$HOME/.cargo/bin:$PATH"
      - rustup toolchain install 1.99.1 --profile minimal --target aarch64-linux-android
      - cargo install cargo-ndk --version 4.1.2 --locked
      - pushd native/shogi_core
      - cargo build --release --locked
      - cargo ndk --platform 24 -t arm64-v8a --output-dir ../bin/android build --release
        --locked
      - popd
      - mkdir -p native/bin/linux/x86_64
      - cp native/shogi_core/target/release/libshogi_core.so native/bin/linux/x86_64/
      - pushd $$Godot$$
      - export SCONS="scons -j `nproc` verbose=no warnings=no progress=no"
      - export COMMON_OFF="module_webrtc_enabled=no module_webxr_enabled=no module_websocket_enabled=no
        module_jsonrpc_enabled=no module_enet_enabled=no module_upnp_enabled=no module_theora_enabled=no
        module_mp3_enabled=no module_tinyexr_enabled=no module_noise_enabled=no module_interactive_music_enabled=no
        module_camera_enabled=no module_visual_shader_enabled=no"
      - export EDITOR_OFF="disable_xr=yes module_jolt_physics_enabled=no module_godot_physics_3d_enabled=no
        module_navigation_3d_enabled=no module_raycast_enabled=no module_lightmapper_rd_enabled=no
        module_csg_enabled=no module_gridmap_enabled=no module_vhacd_enabled=no module_xatlas_unwrap_enabled=no
        module_gltf_enabled=no module_fbx_enabled=no module_objectdb_profiler_enabled=no"
      - $SCONS target=editor platform=linuxbsd $COMMON_OFF $EDITOR_OFF
      - $SCONS target=template_release platform=android arch=arm64 production=yes
        swappy=no generate_android_binaries=yes generate_apk=yes
      - popd
      - mv $$Godot$$/bin/android_release.apk ./android_release.apk
      - sed -i -e 's|^package/signed=.*|package/signed=false|' export_presets.cfg
      - sed -i -e 's|^custom_template/release=.*|custom_template/release="./android_release.apk"|'
        export_presets.cfg
      - $$Godot$$/bin/godot.linuxbsd.editor.x86_64 --headless --import
      - export GODOT_CFG=$(ls ~/.config/godot/editor_settings-*.tres)
      - sed -i -e "s|^export/android/java_sdk_path.*|export/android/java_sdk_path
        = \"$JAVA_HOME\"|" $GODOT_CFG
      - sed -i -e 's|^export/android/android_sdk_path.*|export/android/android_sdk_path
        = "$$SDK$$"|' $GODOT_CFG
      - grep -q '^export/android/java_sdk_path' $GODOT_CFG || echo "export/android/java_sdk_path
        = \"$JAVA_HOME\"" >> $GODOT_CFG
      - grep -q '^export/android/android_sdk_path' $GODOT_CFG || echo 'export/android/android_sdk_path
        = "$$SDK$$"' >> $GODOT_CFG
      - $$Godot$$/bin/godot.linuxbsd.editor.x86_64 --headless --export-release "Android
        arm64" seishingakuen.apk
    ndk: 29.0.14206865

