Repo: https://codeberg.org/shroff/phylum.git
Binaries: 
  https://codeberg.org/shroff/phylum/releases/download/releases%2Fv%v/phylum-%v-release.apk

Builds:
  - versionName: 0.11.0
    versionCode: 1101
    commit: 90fad6a5e484b3bc87ccf0d14e45bfc051d9ca0f
    sudo:
      - mkdir -p /build/phylum
      - chown -R vagrant /build/phylum
    output: client/build/app/outputs/flutter-apk/app-x86_64-release.apk
    binary: 
      https://codeberg.org/shroff/phylum/releases/download/releases%2Fv%v/phylum-%v-x86_64-release.apk
    srclibs:
      - flutter@stable
    rm:
      - client/ios
      - client/linux
      - client/macos
      - client/dist
      - client/web
      - client/windows
      - client/fastlane
    prebuild:
      - export repo=/build/phylum
      - cd ..
      - mv cloud.phylum.drive $repo
      - pushd $repo/cloud.phylum.drive/client
      - flutterVersion=$(python3 -c "import json; print(json.load(open('.fvmrc'))['flutter'])")
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
      - popd
      - mv $repo/cloud.phylum.drive .
    scandelete:
      - client/.pub-cache
    build:
      - export repo=/build/phylum
      - cd ..
      - mv cloud.phylum.drive $repo
      - pushd $repo/cloud.phylum.drive/client
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --no-pub
      - popd
      - mv $repo/cloud.phylum.drive .

