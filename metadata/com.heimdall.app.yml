AutoName: Heimdall
Summary: On-device SMS spam firewall

Description: |-
  Heimdall is an on-device, privacy-first SMS spam firewall and intelligent message filter.

  Unlike conventional spam blockers that upload your conversations and contacts to remote servers, Heimdall runs entirely locally on your device with zero telemetry, zero analytics, and zero external tracking.

  Key Features:
  * 100% on-device heuristic & regex rule engine
  * Intercepts spam silently before it reaches Android's system storage
  * Automatic clean message sync to Android's SMS database
  * One-tap OTP copying from notifications
  * Contact whitelisting ensures messages from contacts are never blocked
  * Cyberpunk dark-mode monospace UI

