  https://github.com/Lord1Egypt/PocketClaw/releases/download/v%v/PocketClaw-v%v-arm64-v8a.apk

Builds:
  - versionName: 0.2.3
    versionCode: 65
    commit: ee68747ba385d59f9719b475b98e298825899717
    timeout: 14400
    sudo:
      - apt-get update
      - apt-get install -y --no-install-recommends build-essential bzip2 cmake file
        golang-go make nodejs npm pkg-config rustup unzip xz-utils zlib1g-dev
    output: build/app/outputs/apk/release/app-release-unsigned.apk
    srclibs:
      - flutter@stable
    rm:
      - android/app/src/main/jniLibs/arm64-v8a/*.so
    prebuild:
      - npm install --prefix $HOME/pnpm --no-audit --no-fund pnpm@10.33.0
      - rustup toolchain install 1.94.1 --profile minimal --target aarch64-linux-android
      - flutterVersion=$(sed -n -E 's/^ +- flutter@([0-9]+\.[0-9]+\.[0-9]+)$/\1/p'
        fdroid/metadata.yml.in)
      - '[[ $flutterVersion =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - $$flutter$$/bin/flutter config --no-analytics
      - export PUB_CACHE="$(pwd)/.pub-cache"
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
    scandelete:
      - .pub-cache/hosted/pub.dev/*/example
      - .pub-cache/hosted/pub.dev/*/extension/devtools/build
    build:
      - export PATH="$$flutter$$/bin:$PATH"
      - export PUB_CACHE="$(pwd)/.pub-cache"
      - export NDK_ROOT="$$NDK$$" GO_CACHE_ROOT="$HOME/go-cache" PNPM_BIN_DIR="$HOME/pnpm/node_modules/.bin"
      - runtime/build-curl-android-arm64.sh
      - runtime/build-git-android-arm64.sh
      - runtime/build-gh-android-arm64.sh
      - runtime/build-ripgrep-android-arm64.sh
      - runtime/build-sqlite3-android-arm64.sh
      - runtime/build-jq-android-arm64.sh
      - runtime/build-python-android-arm64.sh
      - source runtime/toolchains.env
      - pushd core/src
      - GOTOOLCHAIN=$POCKETCLAW_CORE_GO_TOOLCHAIN GOCACHE=$GO_CACHE_ROOT/go-build
        GOMODCACHE=$GO_CACHE_ROOT/go-mod go test -tags "stdjson goolm" -count=1 -run
        TestBundledPayloadsMatchTheirPinnedChecksums ./pkg/pcruntime/
      - popd
      - core/build-android-arm64.sh
      - python3 tool/build_hardened_android.py --signing unsigned
    ndk: r28c

