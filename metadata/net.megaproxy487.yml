Categories:
  - VPN & Proxy
License: MIT
AuthorName: Andrey Prokopyuk
AuthorWebSite: https://github.com/andre487
SourceCode: https://github.com/andre487/AndroidMegaProxy
IssueTracker: https://github.com/andre487/AndroidMegaProxy/issues
Changelog: https://github.com/andre487/AndroidMegaProxy/releases

AutoName: MegaProxy

RepoType: git
Repo: https://github.com/andre487/AndroidMegaProxy.git

Builds:
  - versionName: 1.0.3
    versionCode: 18001
    commit: 0b2f7804d88a2488cf5897b65db5ce3d32382f6b
    subdir: app
    sudo:
      - apt-get update
      - apt-get install -t trixie-backports -y golang-1.27-go
      - apt-get install -y gcc libc-dev make
    gradle:
      - yes
    binary: 
      https://github.com/andre487/AndroidMegaProxy/releases/download/v%v/mega-proxy-armeabi-v7a.apk
    srclibs:
      - go@go1.26.3
    prebuild: sdkmanager 'platforms;android-26' 'platforms;android-36' 'build-tools;36.0.0'
    build:
      - pushd $$go$$/src
      - GOROOT_BOOTSTRAP=/usr/lib/go-1.27 ./make.bash
      - popd
      - export GOROOT=$$go$$
      - export GOPATH=$HOME/go
      - export PATH=$GOROOT/bin:$GOPATH/bin:$PATH
      - MEGAPROXY_ANDROID_ABI=armeabi-v7a ../scripts/build-fdroid-native.sh
    ndk: 29.0.14206865
    gradleprops:
      - megaproxyVersionVariant=armeabi-v7a

