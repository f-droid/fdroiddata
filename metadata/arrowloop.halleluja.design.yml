Categories:
  - Cloud Storage & File Sync
License: AGPL-3.0-only
AuthorName: junkerderprovinz
SourceCode: https://github.com/junkerderprovinz/arrowloop
IssueTracker: https://github.com/junkerderprovinz/arrowloop/issues
Changelog: https://github.com/junkerderprovinz/arrowloop/releases
Donate: https://buymeacoffee.com/junkerderprovinz

AutoName: ArrowLoop

RepoType: git
Repo: https://github.com/junkerderprovinz/arrowloop.git

Builds:
  - versionName: 2.4.4
    versionCode: 20404
    commit: 27dd86b02a398dc81523740614e6bcd6404fb266
    subdir: mobile/android/app
    sudo:
      - apt-get update
      - apt-get install -y nodejs npm
      - apt-get install -y -t trixie-backports golang-go
    init:
      - cd ../../..
      - npm --prefix web ci
      - npm --prefix mobile ci
    gradle:
      - yes
    output: build/outputs/apk/release/app-arm64-v8a-release-unsigned.apk
    prebuild:
      - cd ../../..
      - npm --prefix web run build
      - cd mobile
      - sed -i -e '1a "expo":{"autolinking":{"android":{"buildFromSource":[".*"]}}},'
        package.json
      - find node_modules -type f \( -name "*.gradle" -o -name "*.gradle.kts" -o -name
        "*.kt" \) -exec sed -i -e 's/JavaVersion.VERSION_17/JavaVersion.VERSION_21/g'
        -e 's/jvmToolchain(17)/jvmToolchain(21)/g' -e 's/JvmTarget.fromTarget("17")/JvmTarget.fromTarget("21")/g'
        -e 's/JvmTarget.JVM_17/JvmTarget.JVM_21/g' -e "s/jvmTarget = '17'/jvmTarget
        = '21'/g" {} +
      - ARROWLOOP_ENGINE_AFTER_PREBUILD=1 npx expo prebuild -p android --clean
      - sed -i -e '/signingConfig /d' android/app/build.gradle
      - sed -i -e 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m/'
        android/gradle.properties
      - printf '\norg.gradle.workers.max=2\n' >> android/gradle.properties
    scanignore:
      - mobile/node_modules/hermes-compiler/hermesc/linux64-bin/hermesc
      - mobile/node_modules/expo-modules-core/android/ExpoModulesCorePlugin.gradle
      - mobile/node_modules/react-native-pager-view/android/build.gradle
      - mobile/node_modules/react-native-safe-area-context/android/build.gradle
      - mobile/node_modules/react-native-screens/android/build.gradle
      - mobile/node_modules/react-native-svg/android/build.gradle
    scandelete:
      - mobile/node_modules
      - web/node_modules
    build:
      - cd ../../..
      - mkdir -p mobile/android/app/src/main/jniLibs/arm64-v8a
      - CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w -X
        github.com/junkerderprovinz/arrowloop/internal/boot.Version=$$VERSION$$" -o
        mobile/android/app/src/main/jniLibs/arm64-v8a/libarrowloop.so ./cmd/arrowloop
    gradleprops:
      - reactNativeArchitectures=arm64-v8a

