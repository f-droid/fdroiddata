RepoType: git
Repo: https://github.com/Slime-jkl/enclavd-android-source.git

Builds:
  - versionName: 1.3.1
    versionCode: 31
    commit: 1134d8525f425cd5a430fb312179bfbe67fb64a5
    subdir: app
    gradle:
      - yes
    binary: 
      https://github.com/Slime-jkl/enclavd-android-source/releases/download/v%v/Enclavd_v%v--github.apk

  - versionName: 1.3.2
    versionCode: 32
    commit: 2dc38dbe3fa92457fc7ba5c697b1914f01cea222
    subdir: app
    gradle:
      - yes
    binary: 
      https://github.com/Slime-jkl/enclavd-android-source/releases/download/v%v/Enclavd_v%v--fdroid.apk

  - versionName: 2.0.3
    versionCode: 2031
    commit: ffb857f6307aed339dd5a8d99c467c906ca87327
    sudo:
      - mkdir -p /home/runner/work/enclavd-android-source
      - chown -R vagrant /home/runner/work/enclavd-android-source
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-fdroid-release.apk
    binary: 
      https://github.com/Slime-jkl/enclavd-android-source/releases/download/v%v/binary-armeabi-v7a.apk
    srclibs:
      - flutter@stable
    prebuild:
      - flutterVersion=$(sed -n -E "s/.*flutter-version:\\ '(.*)'/\\1/p" .github/workflows/build.yml)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export repo=/home/runner/work/enclavd-android-source/enclavd-android-source
      - cd ..
      - mv com.enclavd.app $repo
      - pushd $repo
      - export PUB_CACHE=$(pwd)/.pub-cache
      - python3 tool/strip_firebase.py
      - cp pubspec-fdroid.lock pubspec.lock
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
      - popd
      - mv $repo com.enclavd.app
    scandelete:
      - .pub-cache
    build: bash tool/fdroid_build.sh $$flutter$$ android-arm

