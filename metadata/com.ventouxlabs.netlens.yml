AntiFeatures:
  NonFreeNet:
    en-US: "Connects to third-party network services. ipinfo.io (IP Info screen and,
      after a separate consent, the home screen widget's public-IP display), ipwho.is
      (Traceroute hop geolocation), api.abuseipdb.com (IP reputation lookup, requires
      the user's own API key) and speed.cloudflare.com (Speed Test) are contacted
      when the user opens the tool; the widget refreshes on a schedule once added.
      DNS Lookup defaults to Google Public DNS (8.8.8.8), the widget measures latency
      over a TCP connection to 8.8.8.8:53, and the latency monitor defaults to 1.1.1.1.\n"
