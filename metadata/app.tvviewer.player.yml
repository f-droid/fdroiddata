Builds:
  - versionName: 2.25.3
    versionCode: 1431
    commit: ecfb2610b6c43f605c593bbf1641945bdf2b719a
    subdir: flutter_app
    sudo:
      - mkdir -p /home/runner/work/tv_viewer
      - chown -R vagrant /home/runner
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    binary: 
      https://github.com/tv-viewer-app/tv_viewer/releases/download/v%v/TV_Viewer_v%v_Android-armeabi-v7a.apk
    srclibs:
      - flutter@stable
    rm:
      - store-listings/tv-viewer-chrome-extension.zip
    prebuild:
      - flutterVersion=$(sed -n -E "s/.*flutter-version:\ '(.*)'/\1/p" ../.github/workflows/release-gate.yml
        | head -n 1)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -q -f $flutterVersion
      - export repo=/home/runner/work/tv_viewer/tv_viewer
      - cd ../..
      - mv app.tvviewer.player $repo
      - pushd $repo/flutter_app
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
      - popd
      - mv $repo app.tvviewer.player
    scandelete:
      - flutter_app/.pub-cache
    build:
      - export repo=/home/runner/work/tv_viewer/tv_viewer
      - cd ../..
      - mv app.tvviewer.player $repo
      - pushd $repo/flutter_app
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform=android-arm
        --no-tree-shake-icons
      - popd
      - mv $repo app.tvviewer.player

