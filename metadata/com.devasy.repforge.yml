Builds:
  - versionName: 2.1.5
    versionCode: 631
    commit: b816c150b1f2a377e14ca2037e368849813b28d8
    subdir: workout-logger
    sudo:
      - mkdir -p /home/runner/
      - chown vagrant /home/runner/
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    binary: 
      https://github.com/Devasy/RepForge/releases/download/v%v/repforge-v%v-armeabi-v7a.apk
    srclibs:
      - flutter@stable
    prebuild:
      - export repo=/home/runner/work/RepForge
      - mkdir -p $repo
      - cd ../..
      - mv com.devasy.repforge $repo/RepForge
      - pushd $repo/RepForge/workout-logger
      - export PUB_CACHE=$(pwd)/.pub-cache
      - 'export FLUTTER_VERSION=$(sed -n -E "s/^  flutter: (.+)/\1/p" pubspec.yaml)'
      - '[[ $FLUTTER_VERSION ]]'
      - git -C $$flutter$$ checkout -f $FLUTTER_VERSION
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
      - sed -i -e 's/-Wl,/-Wl,--build-id=none,/' $PUB_CACHE/hosted/pub.dev/jni-*/src/CMakeLists.txt
      - popd
      - mv $repo/RepForge com.devasy.repforge
      - cd com.devasy.repforge/workout-logger
    scandelete:
      - workout-logger/.pub-cache
    build:
      - export repo=/home/runner/work/RepForge
      - cd ../..
      - mv com.devasy.repforge $repo/RepForge
      - pushd $repo/RepForge/workout-logger
      - export PUB_CACHE=$(pwd)/.pub-cache
      - export LDFLAGS="-Wl,--build-id=none"
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform="android-arm"
      - popd
      - mv $repo/RepForge com.devasy.repforge
      - cd com.devasy.repforge/workout-logger
    ndk: 28.2.13676358

