      - apt-get install -y rustup gcc libc-dev meson ninja-build pkg-config autoconf
        automake libtool make python3
    gradle:
      - yes
    srclibs:
      - dav1d@1.4.3
      - FFmpeg@n7.1
      - freetype@VER-2-13-3
      - fribidi@v1.0.16
      - harfbuzz@10.0.1
      - libass@0.17.3
      - libplacebo@v7.349.0
      - mpv@v0.39.0
    prebuild:
      - rustup default 1.99.1
      - rustup target add aarch64-linux-android
      - mkdir -p ../mpv/deps
      - cp -r $$dav1d$$ ../mpv/deps/dav1d
      - cp -r $$FFmpeg$$ ../mpv/deps/ffmpeg
      - cp -r $$freetype$$ ../mpv/deps/freetype
      - cp -r $$fribidi$$ ../mpv/deps/fribidi
      - cp -r $$harfbuzz$$ ../mpv/deps/harfbuzz
      - cp -r $$libass$$ ../mpv/deps/libass
      - cp -r $$libplacebo$$ ../mpv/deps/libplacebo
      - cp -r $$mpv$$ ../mpv/deps/mpv
    scandelete:
      - android/mpv/deps/harfbuzz/src/wasm/
      - android/mpv/deps/libplacebo/3rdparty/glad/example/
      - android/mpv/deps/libplacebo/3rdparty/glad/glad/generator/rust/
      - android/mpv/deps/libplacebo/3rdparty/jinja/tests/
    ndk: r26b

