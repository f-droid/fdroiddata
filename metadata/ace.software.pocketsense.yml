Builds:
  - versionName: 2.2.7
    versionCode: 5021
    commit: e4af843b9f11418255f026a5a9cfae2ec15cf2b8
    sudo:
      - mkdir -p /home/runner/work/PocketSense
      - chown -R vagrant /home/runner
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    binary: 
      https://github.com/software-ace/PocketSense/releases/download/v%v/PocketSense-v%v-armeabi-v7a.apk
    srclibs:
      - flutter@stable
    prebuild:
      - export flutterVersion=$(sed -n -E 's/^ +flutter[:] +([0-9.]+)$/\1/p' pubspec.yaml)
      - git -C $$flutter$$ checkout -f $flutterVersion
      - cd ..
      - mv ace.software.pocketsense /home/runner/work/PocketSense/PocketSense
      - pushd /home/runner/work/PocketSense/PocketSense
      - export HOME=/home/runner PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
      - sed -i '/build-id=none/!s/-Wl,/-Wl,--build-id=none,/' .pub-cache/hosted/pub.dev/jni-*/src/CMakeLists.txt
      - popd
      - mv /home/runner/work/PocketSense/PocketSense ace.software.pocketsense
    scandelete:
      - .pub-cache
    build:
      - cd ..
      - mv ace.software.pocketsense /home/runner/work/PocketSense/PocketSense
      - pushd /home/runner/work/PocketSense/PocketSense
      - export HOME=/home/runner PUB_CACHE=$(pwd)/.pub-cache UNSIGNED_RELEASE=1
      - $$flutter$$/bin/flutter build apk --release --split-per-abi
      - popd
      - mv /home/runner/work/PocketSense/PocketSense ace.software.pocketsense
    ndk: r28c

