        libc6-dev-arm64-cross
      - mkdir -p /data/data/com.ivarna.fluxlinux/files/usr
      - chown -R vagrant:vagrant /data
    gradle:
      - ivarna
    scanignore:
      - assets/xfce4/
      - assets/wallpaper/
      - native/termux-packages/packages/python-torch/0011-dlopen-libc.so.patch
