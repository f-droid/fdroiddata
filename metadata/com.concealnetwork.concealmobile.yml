Builds:
  - versionName: 6.0.0
    versionCode: 51
    commit: 877b96ee12a258e4e356f84fac5c34b8007c896b
    subdir: platforms/android/app
    gradle:
      - yes
    srclibs:
      - reproducible-apk-tools@v0.3.0
    prebuild:
      - sed -i -e '/addSigningProps(cdv/d' build.gradle
      - cp src/main/assets/www/cordova.js src/main/assets/www/cordova_plugins.js /tmp/
      - cp -a src/main/assets/www/plugins /tmp/cordova-plugins
      - rm -rf src/main/assets/www
      - cp -a ../../../www src/main/assets/
      - mv /tmp/cordova.js /tmp/cordova_plugins.js src/main/assets/www/
      - mv /tmp/cordova-plugins src/main/assets/www/plugins
    scanignore:
      - www/_next/static/media
      - platforms/android/app/src/main/assets/www/_next/static/media
    postbuild: $$reproducible-apk-tools$$/inplace-fix.py --zipalign fix-newlines $$OUT$$
      'assets/www/*.html' 'assets/www/*/*.html' 'assets/www/*/*/*.html' 'assets/www/*/*/*/*.html'
      'assets/www/*.txt' 'assets/www/*/*.txt' 'assets/www/*/*/*.txt' 'assets/www/*/*/*/*.txt'
      'assets/www/manifest.webmanifest' 'assets/www/_next/static/chunks/*.js' 'assets/www/_next/static/chunks/*.css'
      'assets/www/_next/static/*/*.js' 'assets/www/_next/static/*/*.json' 'assets/www/_next/static/media/*.svg'
      'assets/www/brand/*.svg' 'assets/www/plugins/*/*.js'

