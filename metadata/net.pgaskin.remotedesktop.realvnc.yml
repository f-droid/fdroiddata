Builds:
  - versionName: '6'
    versionCode: 6
    commit: 438b6926c7927832e622e5a95b3979ea2a69f629
    subdir: plugins/realvnc
    gradle:
      - yes
    prebuild: sdkmanager 'cmake;3.30.5'
    ndk: 28.2.13676358

  - versionName: '7'
    versionCode: 7
    commit: edafb480bf16b4275ac40e5380b770948b0df41e
    subdir: plugins/realvnc
    sudo:
      - apt-get update
      - apt-get install -y clang gcc libc-dev libclang-dev rustup xz-utils
    gradle:
      - yes
    prebuild:
      - git -C .. submodule update --init
      - ../../patch.sh -n
      - sdkmanager 'cmake;3.30.5'
      - export RUST_VERSION=$(sed -n -E 's/channel = "(.*)"/\1/p' ../../rust-toolchain.toml)
      - rustup default $RUST_VERSION
    scandelete:
      - third_party/freerdp/libfreerdp/codec/test
      - third_party/ironrdp/crates/ironrdp-graphics/src/rdp6/test_assets
      - third_party/ironrdp/crates/ironrdp-graphics/src/zgfx/test_assets
      - third_party/ironrdp/crates/ironrdp-testsuite-core
      - third_party/openssl/test
      - third_party/rustdesk/flutter
      - third_party/ryll/shakenfist-spice-compression/tests/fixtures

