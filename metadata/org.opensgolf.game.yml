AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[0-9.]+$
VercodeOperation:
  - 10 * %c + 1
  - 10 * %c + 2
  - 10 * %c + 3
UpdateCheckData: crates/simgolf/Cargo.toml|version_code = (\d+)|.|version_name = "(.+)"
