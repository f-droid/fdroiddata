Categories:
  - Strategy Game
License: GPL-2.0-or-later
AuthorName: The OpenSGolf contributors
SourceCode: https://github.com/crspytopgn/opensgolf
IssueTracker: https://github.com/crspytopgn/opensgolf/issues
Changelog: https://github.com/crspytopgn/opensgolf/releases
Donate: https://buymeacoffee.com/crspytopgn

AutoName: OpenSGolf

RepoType: git
Repo: https://github.com/crspytopgn/opensgolf.git

Builds:
  - versionName: 0.8.5
    versionCode: 711
    commit: 91ff346cfb1f46b237caec004a2ff56f151e5df7
    sudo:
      - apt-get update
      - apt-get install -y build-essential cmake pkg-config unzip zip rustup
      - apt-get install -y libssl-dev zlib1g-dev
    output: apk/opensgolf-release.apk
    prebuild:
      - cd crates/simgolf
      - sed -i '/permission\]\]$/{N;/REQUEST_INSTALL/d}' Cargo.toml
      - sed -i 's/^version_code = .*/version_code = $$VERCODE$$/' Cargo.toml
    scandelete:
      - crates/sg-core/tests/data
      - stats
    build:
      - rustup default 1.97.0
      - rustup target add armv7-linux-androideabi
      - export SKIP_RUSTUP=1
      - export PATH=$HOME/.cargo/bin:$PATH
      - export QURL=https://github.com/not-fl3/cargo-quad-apk
      - export QREV=d411c8fe1c08339e46d7dc6b40ac04ea5e3a01b6
      - cargo install --locked --git $QURL --rev $QREV cargo-quad-apk
      - sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - export ANDROID_HOME=$$SDK$$ NDK_HOME=$$NDK$$
      - export ANDROID_BUILD_DIR=$HOME/opensgolf-android
      - export OPENSGOLF_NO_SELF_UPDATE=1
      - export ANDROID_TARGETS=armv7-linux-androideabi
      - export PATH=$$SDK$$/build-tools/36.0.0:$PATH
      - tools/android_build.sh release $PWD/apk
    ndk: 25.0.8775105

