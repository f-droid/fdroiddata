Builds:
  - versionName: 1.1.3
    versionCode: 6
    commit: 0c94f266bdbc4549d2c98bdd3667899047008651
    sudo:
      - apt-get update
      - apt-get install -y python3-venv
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
    prebuild:
      - flutterVersion=$(sed -n -E 's/.*"flutter":[[:space:]]*"([^"]+)".*/\1/p' .fvmrc)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export REPO=/tmp/com.domai_tb.openplants
      - cd ..
      - mv com.domai_tb.openplants "$REPO"
      - pushd "$REPO"
      - export PUB_CACHE="$REPO/.pub-cache"
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
      - popd
      - mv "$REPO" com.domai_tb.openplants
    scandelete:
      - .pub-cache
    build:
      - export REPO=/tmp/com.domai_tb.openplants
      - cd ..
      - mv com.domai_tb.openplants "$REPO"
      - pushd "$REPO"
      - export PUB_CACHE="$REPO/.pub-cache"
      - ./scripts/run_export.sh
      - $$flutter$$/bin/flutter build apk --release
      - popd
      - mv "$REPO" com.domai_tb.openplants

