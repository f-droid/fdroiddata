IssueTracker: https://github.com/nightdropapp/nightdrop/issues

RepoType: git
Repo: https://github.com/nightdropapp/nightdrop.git

Builds:
  - versionName: 0.1.21
    versionCode: 4071
    commit: 011a26d75f5d561874608065372c6eacb578e0c7
    subdir: app
    sudo:
      - apt-get update
      - apt-get install -y build-essential clang cmake pkg-config rustup
      - mkdir -p /build
      - chown -R vagrant /build
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    binary: 
      https://github.com/nightdropapp/nightdrop/releases/download/v%v/NightDrop-armeabi-v7a.apk
    srclibs:
      - flutter@stable
    rm:
      - app/ios
      - app/linux
      - app/macos
      - app/windows
    prebuild:
      - export repo=/build/nightdrop
      - flutterVersion=$(sed -n -E 's/.*"flutter"[^"]*"([^"]+)".*/\1/p' .fvmrc)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - cd ../..
      - mv app.nightdrop $repo
      - pushd $repo/app
      - sed -i -e "s|_buildOptions?.toolchain.name ?? 'stable'|'1.96.0'|" rust_builder/cargokit/build_tool/lib/src/builder.dart
      - rustup default 1.96.0
      - rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
      - popd
      - mv $repo app.nightdrop
    scandelete:
      - app/.pub-cache
      - core/fuzz/seeds
    build:
      - export repo=/build/nightdrop
      - export PATH="$$flutter$$/bin:$PATH"
      - cd ../..
      - mv app.nightdrop $repo
      - pushd $repo/app
      - export PUB_CACHE=$(pwd)/.pub-cache
      - export CARGO_HOME="$HOME/.cargo"
      - export CARGO_ENCODED_RUSTFLAGS="--remap-path-prefix=$(cd ../ && pwd)=.$(printf
        '\037')--remap-path-prefix=$CARGO_HOME=/cargo"
      - flutter build apk --release --split-per-abi --target-platform=android-arm
        --dart-define=NIGHTDROP_TOR=1 
        --dart-define=NIGHTDROP_RELAY=bzcqxuxwvtmrmvprsoscnronkjf5wknfuj5ozxiq5fr6qowvnkwrwwad.onion
      - popd
      - mv $repo app.nightdrop
    ndk: r28c

