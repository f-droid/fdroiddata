MaintainerNotes: |
  Flutter UI over a cross-compiled Rust core (libnightdrop.so, built by cargokit through the
  NDK), so the recipe provisions both toolchains.

  Only 0.1.19 is offered. 0.1.0-0.1.3 shipped without the Android INTERNET permission and cannot
  connect; 0.1.4 embedded AGP's opaque "dependency metadata" signing block, which check-apk
  rejects (fixed in 0.1.5); 0.1.6 and 0.1.7 predate the build fixes below, so their published
  APKs cannot be byte-matched. From 0.1.8 every release is built by this recipe exactly as it
  stands, which is what makes binary: reproducible verification possible.

  The build is moved to a fixed path, per the template. This is load-bearing, not cosmetic:
  measured across two build paths, libapp.so (the Flutter AOT snapshot) plus libdartjni.so and
  libflutter_zxing.so differ, while libnightdrop.so does not - the Rust remap flags below cover
  our own crate, but nothing else. Without the fixed path a rebuild elsewhere cannot match the
  published APK.

  Pins, all needed to stay reproducible - bump together and re-verify:
  Flutter is pinned upstream in app/.fvmrc (the standard fvm file, also consumed by the repo's
  own CI) and extracted here, so a Flutter bump needs no change to this recipe. NDK r28c
  (flutter.ndkVersion for that Flutter release), Rust 1.96.0 (also pinned in
  rust-toolchain.toml). The remap flags strip the
  build dir and cargo registry paths from the Rust core. They have to go in
  CARGO_ENCODED_RUSTFLAGS, not RUSTFLAGS: cargokit's Android environment sets the encoded
  variable for its NDK libgcc workaround, and that overrides plain RUSTFLAGS entirely. The
  \037 is the unit separator cargo expects between encoded flags.

  The sed patches cargokit, which otherwise runs "rustup run stable cargo build" and would
  silently ignore rust-toolchain.toml. The usual "s/'stable'/'<version>'/" does not work here:
  the crate ships a cargokit.yaml, so the toolchain comes from the parsed options rather than
  the ?? fallback, and the whole expression has to be replaced.

  core/fuzz/seeds is a binary fuzz corpus that trips the source scanner; not needed to build.

  Version codes are versionCode * 10 + ABI (1 armeabi-v7a, 2 arm64-v8a, 3 x86_64), set in
  app/android/app/build.gradle.kts, which is why VercodeOperation multiplies rather than adds.
  The pubspec base jumped to 402 when the scheme changed: Flutter's own --split-per-abi offsets
  had already published 1016/2016/4016, and every new code has to stay above those or Android
  refuses the update.

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[\d.]+$
VercodeOperation:
  - '%c * 10 + 1'
  - '%c * 10 + 2'
  - '%c * 10 + 3'
UpdateCheckData: app/pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
