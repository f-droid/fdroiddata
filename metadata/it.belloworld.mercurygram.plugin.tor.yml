    commit: 5a8375fdf0bfea64fb425b416eff2edddd979b28
    subdir: TMessagesProj_PluginTor
    submodules: true
    sudo:
      - apt-get update
      - apt-get install -y automake autoconf cmake g++ golang-go libtool make ninja-build
        pkg-config
      - echo "deb https://deb.debian.org/debian bookworm main" > /etc/apt/sources.list.d/bookworm.list
      - apt-get update
      - apt-get install -y -t bookworm openjdk-17-jdk-headless
      - update-java-alternatives -s java-1.17.0-openjdk-amd64
    gradle:
      - afatFdX86
    rm:
      - TMessagesProj_AppHockeyApp
      - TMessagesProj_AppHuawei
      - TMessagesProj_App
      - TMessagesProj
    prebuild:
      - echo 'QUIET_NATIVE_BUILD=true' >> ../local.properties
      - printf '\nMG_BUILD_TAG=$$VERSION$$\n' >> ../gradle.properties
    scandelete:
      - TMessagesProj_PluginTor/jni
    ndk: 27.2.12479018

