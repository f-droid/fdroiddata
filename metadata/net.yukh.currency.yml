AntiFeatures:
  NonFreeNet:
    en-US: Exchange rates are fetched from non-libre network services. The CBR source
      uses cbr-xml-daily.ru (a third-party mirror of Central Bank of Russia rates,
      not an official Bank of Russia endpoint); the market source uses open.er-api.com
      (ExchangeRate-API). With the CBR source the app also queries isdayoff.ru, the
      Russian working-day calendar, to skip polling on days when no new rate is published.
