Builds:
  - versionName: 1.0.1
    versionCode: 2
    commit: a2c266e3e07b79bf5da941e8cbc44837642ebc8a
    subdir: app
    gradle:
      - yes
    srclibs:
      - reproducible-apk-tools@v0.3.2
    postbuild:
      - mv $$OUT$$ unaligned.apk
      - $$reproducible-apk-tools$$/zipalign.py --page-size 16 --pad-like-apksigner
        --replace unaligned.apk $$OUT$$

