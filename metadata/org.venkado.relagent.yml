Builds:
  - versionName: 0.1.28
    versionCode: 251
    commit: 472658d1accea8a8bf20d3cf827b23c96d0662be
    output: apps/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    binary: 
      https://gitlab.com/RmMsr/relagent/-/releases/%v/downloads/relagent-%v-android-arm.apk
    srclibs:
      - flutter@stable
    prebuild:
      - flutterVersion=$(sed -n -E 's/.*"flutter":\ "(.*)"/\1/p' .fvmrc)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - rm -rf /tmp/build/org.venkado.relagent
      - mkdir -p /tmp/build
      - cd ..
      - mv org.venkado.relagent /tmp/build/
      - pushd /tmp/build/org.venkado.relagent/apps
      - cp assets/config.template.json assets/config.json
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
      - popd
      - mv /tmp/build/org.venkado.relagent ./
    scanignore:
      - apps/.pub-cache
      - dart_packages
    build:
      - cd ..
      - mv org.venkado.relagent /tmp/build/
      - pushd /tmp/build/org.venkado.relagent/apps
      - export PUB_CACHE=$(pwd)/.pub-cache
      - export ANDROID_ALLOW_UNSIGNED_RELEASE=true
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform=android-arm
      - popd
      - mv /tmp/build/org.venkado.relagent ./

