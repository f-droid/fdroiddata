Repo: https://github.com/duelago/svampkompass

Builds:
  - versionName: 1.0.2
    versionCode: 20031
    commit: f8222e62bd94374448ec189152072cd2dc325712
    sudo:
      - mkdir -p /home/runner/work/svampkompass
      - chown -R vagrant /home/runner
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    binary: 
      https://github.com/duelago/svampkompass/releases/download/v%v/%c-armeabi-v7a-fdroid.apk
    srclibs:
      - flutter@stable
    prebuild:
      - export repo=/home/runner/work/svampkompass/svampkompass
      - cd ..
      - mv bengtsson.net.svampkompass $repo
      - pushd $repo
      - flutterVersion=$(sed -n -E "s/.*flutter-version:\ '(.*)'/\1/p" .github/workflows/release.yml)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
      - cd $PUB_CACHE/hosted/pub.dev/geolocator_android-*/android
      - sed -i -e '/gms/d' build.gradle
      - cd src/main/java/com/baseflow/geolocator/location
      - rm FusedLocationClient.java
      - sed -i -e '/if (forceAndroidLocationManager) {/,/^  }/c return new LocationManagerClient(context,
        locationOptions);}' -e '/isGooglePlayServicesAvailable/,/^  }/d' -e '/gms/d'
        GeolocationManager.java
      - popd
      - mv $repo bengtsson.net.svampkompass
    scandelete:
      - .pub-cache
    build:
      - export repo=/home/runner/work/svampkompass/svampkompass
      - cd ..
      - mv bengtsson.net.svampkompass $repo
      - pushd $repo
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --no-pub --split-per-abi
      - popd
      - mv $repo bengtsson.net.svampkompass

