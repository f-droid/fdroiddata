Categories:
  - Health Manager
License: Apache-2.0
AuthorName: Benedikt Burger
SourceCode: https://github.com/BenediktBurger/cycle-app
IssueTracker: https://github.com/BenediktBurger/cycle-app/issues

AutoName: NER Cycle App

RepoType: git
Repo: https://github.com/BenediktBurger/cycle-app.git

Builds:
  - versionName: 0.3.0
    versionCode: 81
    commit: e8f8086c191224e665b1d98c91ba17aaa3cf44a9
    sudo:
      - mkdir -p /home/runner/work/cycle-app
      - chown -R vagrant /home/runner/work
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    binary: 
      https://github.com/BenediktBurger/cycle-app/releases/download/v%v/cycle-app-%v-armeabi-v7a.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
      - web
    prebuild:
      - flutterVersion=$(grep -v '^#' tool/flutter-version | tail -n 1)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export repo=/home/runner/work/cycle-app/cycle-app
      - export rootdir=$PWD
      - mv $rootdir $repo
      - pushd $repo
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
      - mv $repo $rootdir
    scandelete:
      - .pub-cache
    build:
      - export repo=/home/runner/work/cycle-app/cycle-app
      - export rootdir=$PWD
      - mv $rootdir $repo
      - pushd $repo
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --android-project-arg
        allowDebugSigning=true
      - mv $repo $rootdir

