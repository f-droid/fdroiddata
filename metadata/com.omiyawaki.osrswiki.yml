AntiFeatures:
  NonFreeNet:
    en-US: Loads content from oldschool.runescape.wiki (User-Agent includes the app
      version, Android version, and device model) and related community APIs. Feedback
      posts to https://osrswiki-feedback.omiyawaki.workers.dev/ include device model
      and Android version. YouTube thumbnails load from i.ytimg.com. GE charts call
      prices.runescape.wiki. Voice search uses the platform SpeechRecognizer, often
      Google online.
  NonFreeAssets:
    en-US: Bundles map_floor_*.mbtiles rendered from the game cache, and the RuneScape
      fonts runescape_plain.ttf and runescape_bold.ttf (Jagex Ltd. named as manufacturer
      and designer).
