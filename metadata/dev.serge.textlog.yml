AutoName: textlog

RepoType: git
Repo: https://github.com/Faultless/textlog_flutter.git

Builds:
  - versionName: 0.7.3
    versionCode: 3001
    commit: 527cad121247b92cea3050e4dfe654c05151ccf0
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    binary: 
      https://github.com/Faultless/textlog_flutter/releases/download/v%v/textlog-%v-armeabi-v7a.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
      - macos
      - web
      - test
    prebuild:
      - FLUTTER_VERSION=$(sed -n -E 's/.*flutter-version:[[:space:]]*([^[:space:]]+).*/\1/p'
        .github/workflows/pages.yml)
      - '[[ $FLUTTER_VERSION ]]'
      - git -C $$flutter$$ checkout -f $FLUTTER_VERSION
      - $$flutter$$/bin/flutter config --no-analytics
      - export REPRO=/tmp/build
      - mkdir -p $REPRO
      - cd ..
      - mv dev.serge.textlog $REPRO/textlog_flutter
      - pushd $REPRO/textlog_flutter
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
      - popd
      - mv $REPRO/textlog_flutter dev.serge.textlog
      - cd dev.serge.textlog
    scandelete:
      - .pub-cache
    build:
      - export REPRO=/tmp/build
      - mkdir -p $REPRO
      - cd ..
      - mv dev.serge.textlog $REPRO/textlog_flutter
      - pushd $REPRO/textlog_flutter
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform=android-arm
      - popd
      - mv $REPRO/textlog_flutter dev.serge.textlog
      - cd dev.serge.textlog
    ndk: r28c

