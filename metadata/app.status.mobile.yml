MaintainerNotes: |-
  Status App requires Qt 6.9.2 built from source for Android. The build process:
  1. Builds OpenSSL 3.0.15 for Android arm64-v8a
  2. Builds Qt 6.9.2 for Linux host then Android arm64-v8a with OpenSSL
  3. Builds the Status app using the Qt Android toolchain

  Full build takes around 2 hours depending on host resources.

  Dependencies:
  - Qt 6.9.2 (built from source via srclib)
  - Nim 2.2.4 (built from source via srclib)
  - Go (from Debian)
  - Android SDK (API 35) and NDK (27.2.12479018)
  - OpenSSL 3.0.15 (built from source via srclib)
  - FFmpeg 7.1.1 for Android arm64-v8a (built from source via ffmpeg-android-maker srclib,
    required by Qt 6.9 QtMultimedia's FFmpeg backend for QCamera / QR scanning)

