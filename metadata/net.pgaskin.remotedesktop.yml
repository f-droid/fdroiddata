Builds:
  - versionName: '4'
    versionCode: 4
    commit: 2063cff794982a0645b0d89a616570f0edd70874
    subdir: app
    sudo:
      - apt-get update
      - apt-get install -y gcc libc-dev rustup xz-utils
    gradle:
      - yes
    prebuild:
      - git -C .. submodule update --init
      - ../patch.sh -n
      - sdkmanager 'cmake;3.30.5'
      - gradle :backends:fetchCryptoSources
      - export RUST_VERSION=$(sed -n -E 's/channel = "(.*)"/\1/p' ../rust-toolchain.toml)
      - rustup default $RUST_VERSION
      - rustup target add aarch64-linux-android x86_64-linux-android
      - cargo install cargo-ndk@4.1.2
    scandelete:
      - third_party/freerdp/libfreerdp/codec/test
      - third_party/gnutls/fuzz
      - third_party/ironrdp/crates/ironrdp-graphics/src/rdp6/test_assets
      - third_party/ironrdp/crates/ironrdp-graphics/src/zgfx/test_assets
      - third_party/ironrdp/crates/ironrdp-testsuite-core
      - third_party/libjpeg-turbo/java
      - third_party/openssl/test

