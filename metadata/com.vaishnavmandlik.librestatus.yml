Builds:
  - versionName: 1.0.1
    versionCode: 21
    commit: 4766eca01c13dbc0b3835ae78df66c0357c938a3
    subdir: android/app
    sudo:
      - apt-get update
      - apt-get install -y npm
    init: npm ci
    gradle:
      - yes
    rm:
      - ios
    prebuild:
      - sed -i -e 's/include "armeabi-v7a", "arm64-v8a", "x86", "x86_64"/include "armeabi-v7a"/'
        build.gradle
      - sed -i -E '/jvmToolchain|JavaVersion/s/17/21/' ../../node_modules/@react-native/gradle-plugin/*/build.gradle.kts
        ../../node_modules/@react-native/gradle-plugin/react-native-gradle-plugin/src/main/kotlin/com/facebook/react/utils/JdkConfiguratorUtils.kt
    scanignore:
      - node_modules/react-native/sdks/hermesc/linux64-bin/hermesc
      - node_modules/@react-native-async-storage/async-storage/android/build.gradle
      - node_modules/react-native-video/android/build.gradle
      - node_modules/react-native-share/android/build.gradle
      - node_modules/react-native-safe-area-context/android/build.gradle
      - node_modules/react-native-permissions/android/build.gradle
      - node_modules/react-native-localize/android/build.gradle
      - node_modules/react-native-linear-gradient/android/build.gradle
      - node_modules/@react-native-camera-roll/camera-roll/android/build.gradle
      - node_modules/react-native-vector-icons/android/build.gradle
    scandelete:
      - node_modules

