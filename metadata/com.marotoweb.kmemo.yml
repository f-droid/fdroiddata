AutoName: kMemo

RepoType: git
Repo: https://github.com/marotoweb/kmemo.git

Builds:
  - versionName: 0.3.1
    versionCode: 241
    commit: 1fc6834f9bc73895ad5490bf35e43bd666460947
    sudo:
      - mkdir -p /home/runner/work/kmemo
      - chown -R vagrant /home/runner
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    binary: 
      https://github.com/marotoweb/kmemo/releases/download/v%v/kMemo-v%v-armeabi-v7a.apk
    srclibs:
      - flutter@stable
    prebuild:
      - export repo=/home/runner/work/kmemo/kmemo
      - cd ..
      - mv com.marotoweb.kmemo $repo
      - pushd $repo
      - export RELEASE_FILE=.github/workflows/release.yml
      - ver=$(sed -n -E "s/.*flutter-version:\ '(.*)'/\1/p" $RELEASE_FILE|head -n1)
      - '[[ $ver ]]'
      - git -C $$flutter$$ checkout -f $ver
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
      - export LOCATION=$(find "$PUB_CACHE" -name CMakeLists.txt -path '*jni*')
      - export OPTS="-ffile-prefix-map=$(pwd)=/tmp/build"
      - sed -i "1a add_link_options(\"LINKER:--build-id=none\")" $LOCATION
      - sed -i "1a add_compile_options(\"$OPTS\")" $LOCATION
      - popd
      - mv $repo com.marotoweb.kmemo
    scandelete:
      - .pub-cache
    build:
      - export repo=/home/runner/work/kmemo/kmemo
      - cd ..
      - mv com.marotoweb.kmemo $repo
      - pushd $repo
      - export PUB_CACHE=$(pwd)/.pub-cache
      - export PATH=$$flutter$$/bin/:$PATH
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --no-tree-shake-icons
      - popd
      - mv $repo com.marotoweb.kmemo
    ndk: 28.2.13676358

