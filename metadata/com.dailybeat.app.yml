MaintainerNotes: |-
  Latest-only recipe pinned to the immutable v4.3.9 release source.
  Store builds exclude Google dependencies and all private
  build-time backup configuration. The removed files are unused GMS sources and
  test-only map fixtures; removing them does not change the store APK.
  Version 43 scanignore covers only the two deterministic, hash-pinned GeoNames
  data archives, licensed CC BY 4.0. DBT2 is used at runtime; the reviewed DBT1
  extract is retained for reproducible regeneration. Neither contains code.
  Provenance and both hashes are in docs/offline-place-names.md; runtime
  attribution is included. Do not broaden these exceptions.
  MapLibre and other FLOSS dependencies come from Google Maven or Maven Central.
  The downloaded map is data only, with hashes pinned in the APK; there is no
  executable-code downloader or in-app updater. Network flags are deliberately
  disclosed for review; no advertising or analytics SDK is shipped.

