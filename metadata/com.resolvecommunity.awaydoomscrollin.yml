AntiFeatures:
  Tracking:
    en-US: Telemetry is disabled by default and no telemetry is sent until the user
      explicitly opts in. While enabled, the app sends the constant PSEUDONYMOUS_TELEMETRY
      type marker, a random per-installation UUID, a report identifier and snapshot
      sequence number, device manufacturer/model, Android/SDK/app version, the installed
      versions of Instagram/TikTok/YouTube, screen resolution and density, aggregate
      platform and total intervention counts, and measured Instagram and YouTube curtain
      visibility time to awaydoomscrollin.com. Users who opted in to the narrower
      v2 summary are asked again before any expanded v3 report is sent. Explicit opt-in
      may trigger one immediate attempt; afterward automatic app-startup and blocking-event
      triggers share one persisted 24-hour attempt interval, including failed attempts.
      Opting out stops future submissions; an in-flight request may finish. The latest
      active server snapshot expires within 90 days, and encrypted local operational
      backups use a separate 14-day rotation.
