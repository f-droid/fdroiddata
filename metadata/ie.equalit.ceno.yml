MaintainerNotes: |-
  Version code scheme:
  2XYZAR, where X.Y.Z is upstream version, A is architecture (0 = ARMv7, 1 = ARMv8,  2 = x86-64), R is upstream revision number * 2 + 1 (if we need to re-release).
  * Example: 2020110221 = Ceno 2.11.2 for x86-64, revision 0
  * Example: 2020120013 = Ceno 2.12.0 for ARMv8, revision 1

  MozFennec:
  https://github.com/mozilla-firefox/firefox/tags

  MozAppServices, Glean versions:
  grep 'VERSION =' build/srclib/MozFennec/mobile/android/android-components/plugins/dependencies/src/main/java/ApplicationServices.kt
  grep '^glean =' build/srclib/MozFennec/gradle/libs.versions.toml

  GleanAS version:
  grep '^glean =' build/srclib/MozAppServices/gradle/libs.versions.toml

  NDK version:
  grep 'NDK_VERSION =' build/srclib/MozFennec/python/mozboot/mozboot/android.py

  wasi-sdk version:
  grep -A5 '^wasi-sdk:' build/srclib/MozFennec/taskcluster/kinds/fetch/toolchains.yml

  Rust:
  * https://github.com/rust-lang/rustup/tags
  * https://firefox-source-docs.mozilla.org/writing-rust-code/update-policy.html#schedule

  llvm:
  grep 'Base revision:' {NDK}/toolchains/llvm/prebuilt/linux-x86_64/clang_source_info.md

  llvm_android, toolchain_utils:
  {NDK}/toolchains/llvm/prebuilt/linux-x86_64/bin/clang --version | grep -o 'based on r[0-9a-z]*'
  * https://android.googlesource.com/toolchain/llvm_android.git/+refs
  * https://android.googlesource.com/platform/external/toolchain-utils.git/+refs

  Scanner detects 'com/google/firebase/messaging/FirebaseMessagingService' from stubs and 'com/google/android/gms/...' from microG libs for webauth

ArchivePolicy: 6
AutoUpdateMode: None
UpdateCheckMode: None
