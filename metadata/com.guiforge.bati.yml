MaintainerNotes: |-
  Expo / React Native app following templates/build-react-native.yml. android/ is
  committed upstream so the subdir check passes, but `expo prebuild --clean` still
  regenerates it at build time. package.json already sets
  expo.autolinking.buildFromSource [".*"], so no sed is needed for it; init: purges
  the bundled prebuilt local-maven-repo AARs and the expo-dev-* dev tooling instead
  of sed-editing package.json, which would break `npm ci`. scanignore lists only the
  scanner's false positives (legitimate local `maven { url }` lines); everything else
  under node_modules is scandelete'd. No Firebase and no network code in the app;
  since 1.2.4 the INTERNET permission itself is stripped via blockedPermissions,
  so the manifest carries no network permissions at all.

