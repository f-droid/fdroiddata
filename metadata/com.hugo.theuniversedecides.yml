IssueTracker: https://github.com/vitorhugo-dotnet/the_universe_decides/issues

AutoName: The Universe Decides

RepoType: git
Repo: https://github.com/vitorhugo-dotnet/the_universe_decides.git

Builds:
  - versionName: 2.5.0
    versionCode: 1001281
    commit: cac3b5e4aa1fa71516917c27a32f8399fd0375f0
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-fdroid-release.apk
    srclibs:
      - flutter@stable
    rm:
      - android/app/src/play
      - ios
    prebuild:
      - sed -i '/playImplementation/d' android/app/build.gradle.kts
      - flutterVersion=$(sed -n -E 's/^[[:space:]]*FLUTTER_VERSION:[[:space:]]*"([^"]+)".*$/\1/p'
        .github/workflows/build-signed-apk.yml)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f "$flutterVersion"
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --flavor fdroid --split-per-abi
        --target-platform=android-arm --build-number=$(( $$VERCODE$$ / 10 ))

