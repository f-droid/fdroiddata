AntiFeatures:
  NonFreeNet:
    en-US: Typhoon data is fetched through the project's open-source relay (te-relay.seamain.org),
      which forwards requests to the non-free Juhe and QWeather APIs. The basemap
      defaults to OpenFreeMap; the non-free Amap basemap can optionally be selected.
    zh-CN: 台风数据经项目自有的开源中转服务（te-relay.seamain.org）转发至聚合数据和和风天气的非自由 API。底图默认使用 OpenFreeMap，可选用非自由的高德地图底图。
