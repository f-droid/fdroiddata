Builds:
  - versionName: 0.8.119
    versionCode: 8119
    commit: b591028d0885ed50e49ef38c9d3852a029f8431a
    subdir: packages/mobile/android/app
    sudo:
      - echo "deb https://deb.debian.org/debian forky main" > /etc/apt/sources.list.d/forky.list
      - apt-get update
      - apt-get install -y -t forky npm
      - npm -g install --allow-scripts=bun bun@1.3.14
    gradle:
      - tv
    prebuild:
      - cd ../../../..
      - bun install --frozen-lockfile
      - bun run --filter @nicotind/web build -- --configuration tv
      - cd packages/mobile
      - bunx cap sync android
    scandelete:
      - node_modules

