  - versionName: 1.7.1
    versionCode: 1101
    commit: acef361124e74a8c68db6e81b888e136e5b6fffc
    submodules: true
    output: build/app/outputs/flutter-apk/app-release.apk
    binary: 
      https://github.com/R0b0To/VaultExplorer/releases/download/v%v/VaultExplorer-v%v-armeabi.apk
    prebuild:
      - cd ..
      - mv com.aeidolon.vaultexplorer /tmp/build
      - pushd /tmp/build
      - export PUB_CACHE=$(pwd)/.pub-cache
      - .flutter/bin/flutter config --no-analytics
      - .flutter/bin/flutter pub get --enforce-lockfile
      - popd
      - mv /tmp/build com.aeidolon.vaultexplorer
    scanignore:
      - .flutter/bin/cache
    scandelete:
      - .flutter
      - .pub-cache
    build:
      - cd ..
      - mv com.aeidolon.vaultexplorer /tmp/build
      - pushd /tmp/build
      - export PUB_CACHE=$(pwd)/.pub-cache
      - .flutter/bin/flutter build apk --release --target-platform=android-arm --build-number=1101
      - popd
      - mv /tmp/build com.aeidolon.vaultexplorer
    ndk: r28c

