Builds:
  - versionName: 1.3.0
    versionCode: 501
    commit: 3c23a04edbc718b11a5eb1200af6dd4609a8ff77
    subdir: android
    output: build/app/outputs/flutter-apk/app-arm64-release.apk
    binary: 
      https://github.com/R0b0To/VaultExplorer/releases/download/v%v/VaultExplorer-v%v-arm64.apk
    srclibs:
      - flutter@stable
    prebuild:
      - flutterVersion=$(sed -n -E "s/.*flutter-version:\ '(.*)'/\1/p" ../.github/workflows/build-release.yml)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
    build:
      - export PATH="$$flutter$$/bin:$PATH"
      - cd ..
      - bash ./scripts/reproducible_build.sh arm64
      - mkdir -p android/build/app/outputs/flutter-apk
      - cp build/app/outputs/flutter-apk/app-arm64-release.apk android/build/app/outputs/flutter-apk/app-arm64-release.apk
    ndk: r28c

