AntiFeatures:
  NonFreeNet:
    en-US: Streams from YouTube Music. Stream addresses are decoded with PipePipe's
      decoder service (api.pipepipe.dev), which receives only YouTube's player version
      and the scrambled values. A table of YouTube player settings is downloaded from
      GitHub (raw.githubusercontent.com, mirrored on cdn.jsdelivr.net). Lyrics come
      from LRCLIB, KuGou, Paxsenix and similar providers. Optional features use other
      non-free services (Last.fm, song recognition, Discord, AI translation with your
      own key).
