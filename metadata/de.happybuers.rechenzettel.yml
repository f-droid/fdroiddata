RepoType: git
Repo: https://gitlab.com/DaWasch/rechenzettel-app.git
Binaries: 
  https://gitlab.com/DaWasch/rechenzettel-app/-/releases/v%v/downloads/app-arm64-v8a-release.apk

Builds:
  - versionName: 0.1.58
    versionCode: 2058
    commit: 6ec1a768645dafaa6894d76fb5612946cabc4572
    sudo:
      - mkdir -p /builds/DaWasch
      - chown -R vagrant /builds
    output: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
    prebuild:
      - flutterVersion=$(sed -n -E "s/^[[:space:]]*FLUTTER_VERSION:[[:space:]]*(.*)$/\1/p"
        .gitlab-ci.yml)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export repo=/builds/DaWasch/rechenzettel-app
      - cd ..
      - mv de.happybuers.rechenzettel $repo
      - pushd $repo
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
      - popd
      - mv $repo de.happybuers.rechenzettel
    scandelete:
      - .pub-cache
    build:
      - export repo=/builds/DaWasch/rechenzettel-app
      - cd ..
      - mv de.happybuers.rechenzettel $repo
      - pushd $repo
      - export PUB_CACHE=$(pwd)/.pub-cache
      - export ORG_GRADLE_PROJECT_rechenzettelLegacyPackaging=true
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform="android-arm64"
      - popd
      - mv $repo de.happybuers.rechenzettel

