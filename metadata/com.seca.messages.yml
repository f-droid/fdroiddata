AutoName: Seca Messages

RepoType: git
Repo: https://github.com/arditore/Seca.git
Binaries: https://github.com/arditore/Seca/releases/download/v%v/seca-messages-%v.apk

Builds:
  - versionName: 0.1.0-beta10
    versionCode: 10
    commit: da6b4deaab2627674bacb3dac2c035998a895018
    subdir: apps/messages
    sudo:
      - apt-get update
      - apt-get install -y --no-install-recommends build-essential protobuf-compiler
        libprotobuf-dev cmake ninja-build clang libclang-dev pkg-config rustup
    gradle:
      - yes
    srclibs:
      - libsignal@v0.102.2
      - Secp256k1Kmp@v0.24.0
    prebuild:
      - export PATH="$HOME/.cargo/bin:$PATH"
      - rustup default 1.98.1
      - rustup target add aarch64-linux-android armv7-linux-androideabi
      - sed -i '/libsignal repository (start)/,/libsignal repository (end)/c\exclusiveContent
        { forRepository { mavenLocal() } ; filter { includeGroup("org.signal") ; includeModule("fr.acinq.secp256k1",
        "secp256k1-kmp-jni-android") } }' ../../settings.gradle.kts
      - echo 'target_link_options( secp256k1-jni PRIVATE -Wl,--build-id=none )' >>
        $$Secp256k1Kmp$$/jni/android/src/main/CMakeLists.txt
      - cd $$libsignal$$ && export CFLAGS="-ffile-prefix-map=$(pwd -P)=." CXXFLAGS="-ffile-prefix-map=$(pwd
        -P)=."
      - export RUSTFLAGS="-C link-arg=-Wl,--build-id=none"
      - sed -i 's|-Wl,--build-id|-Wl,--build-id=none|' $$libsignal$$/rust/bridge/jni/build.rs
      - cd $$libsignal$$/java && ANDROID_NDK_HOME=$$NDK$$ ./gradlew --no-daemon -PandroidArchs=aarch64,arm
        :android:publishToMavenLocal :client:publishToMavenLocal
    build:
      - sdkmanager "cmake;3.31.5"
      - pushd $$Secp256k1Kmp$$
      - gradle :jni:android:publishToMavenLocal
      - popd
    ndk: 28.0.13004108

