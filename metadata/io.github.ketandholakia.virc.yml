AutoName: VIRC

RepoType: git
Repo: https://github.com/ketandholakia/vittixIRC.git

Builds:
  - versionName: 1.0.1
    versionCode: 21
    commit: 429c7e13e5e5888fa525d97d40f735720c9eba1f
    submodules: true
    sudo:
      - mkdir -p /home/runner/work/vittixIRC
      - chown -R vagrant /home/runner
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    binary: 
      https://github.com/ketandholakia/vittixIRC/releases/download/v%v/virc-%v-armeabi-v7a.apk
    prebuild:
      - export repo=/home/runner/work/vittixIRC/vittixIRC
      - cd ..
      - mv io.github.ketandholakia.virc $repo
      - pushd $repo
      - export PUB_CACHE=$(pwd)/.pub-cache
      - .flutter/bin/flutter config --no-analytics
      - .flutter/bin/flutter pub get --enforce-lockfile
      - sed -i -e 's/-Wl,/-Wl,--build-id=none,/' $PUB_CACHE/hosted/pub.dev/jni-*/src/CMakeLists.txt
      - popd
      - mv $repo io.github.ketandholakia.virc
    scanignore:
      - .flutter/bin/cache
    scandelete:
      - .flutter
      - .pub-cache
    build:
      - export repo=/home/runner/work/vittixIRC/vittixIRC
      - cd ..
      - mv io.github.ketandholakia.virc $repo
      - pushd $repo
      - export PUB_CACHE=$(pwd)/.pub-cache
      - .flutter/bin/flutter build apk --release --split-per-abi --target-platform="android-arm"
      - popd
      - mv $repo io.github.ketandholakia.virc
    ndk: r28c

