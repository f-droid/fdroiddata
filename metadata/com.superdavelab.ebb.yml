Builds:
  - versionName: 0.6.0
    versionCode: 6001
    commit: e06fd57a06d5f75e3d28aff2de3cfd71f7ee51dc
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    binary: https://github.com/SuperDaveOrg/Ebb/releases/download/v%v/ebb-%v-armeabi-v7a.apk
    srclibs:
      - flutter@stable
    prebuild:
      - flutterVersion=$(sed -n -E "s/.*flutter-version:\ \"(.*)\"/\1/p" .github/workflows/ci.yml)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export repo=/tmp/ebb-build
      - cd ..
      - mv com.superdavelab.ebb $repo
      - pushd $repo
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
      - popd
      - mv $repo com.superdavelab.ebb
    scandelete:
      - .pub-cache
    build:
      - export repo=/tmp/ebb-build
      - cd ..
      - mv com.superdavelab.ebb $repo
      - pushd $repo
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform
        android-arm
      - popd
      - mv $repo com.superdavelab.ebb

