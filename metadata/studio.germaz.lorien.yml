Repo: https://github.com/germaz-studio/lorien.git

Builds:
  - versionName: 0.7.4
    versionCode: 5
    commit: b602d8a39f2d8b481eb9fdf7e23e80f78c5feb9b
    timeout: 14400
    subdir: lorien
    sudo:
      - apt-get update
      - apt-get install -y build-essential scons pkg-config libx11-dev libxcursor-dev
        libxinerama-dev libgl1-mesa-dev libglu-dev libasound2-dev libpulse-dev libudev-dev
        libxi-dev libxrandr-dev
      - echo "deb https://deb.debian.org/debian bookworm main" > /etc/apt/sources.list.d/bookworm.list
      - apt-get update
      - apt-get install -y -t bookworm openjdk-17-jdk-headless
      - update-java-alternatives -s java-1.17.0-openjdk-amd64
    output: lorien.apk
    srclibs:
      - Godot@4.3-stable
    prebuild:
      - sed -i -e 's:\(^.*package/signed\)\s*=.*$:\1 = false:' export_presets.cfg
      - sed -i -e 's:\(^.*architectures/armeabi-v7a\)\s*=.*$:\1 = false:' export_presets.cfg
      - sed -i -e 's:\(^.*architectures/x86\)\s*=.*$:\1 = false:' export_presets.cfg
      - sed -i -e 's:\(^.*architectures/x86_64\)\s*=.*$:\1 = false:' export_presets.cfg
      - sed -i -e '/^keystore\//d' export_presets.cfg
    build:
      - export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
      - export PATH=$JAVA_HOME/bin:$PATH
      - export ANDROID_SDK_ROOT=$$SDK$$
      - pushd $$Godot$$
      - scons -j `nproc` platform=linuxbsd target=editor
      - scons -j `nproc` platform=android target=template_release arch=arm64
      - cd platform/android/java
      - gradle generateGodotTemplates
      - popd
      - sed -i -e 's:\(^.*package/signed\)\s*=.*$:\1 = false:' export_presets.cfg
      - sed -i -e '/custom_template\/release/s|=.*|="$$Godot$$/bin/android_release.apk"|'
        export_presets.cfg
      - mkdir -p ~/.config/godot/
      - echo '[gd_resource type="EditorSettings" format=3]' > ~/.config/godot/editor_settings-4.tres
      - echo '[resource]' >> ~/.config/godot/editor_settings-4.tres
      - echo 'export/android/android_sdk_path = "$$SDK$$"' >> ~/.config/godot/editor_settings-4.tres
      - echo "export/android/java_sdk_path = \"$JAVA_HOME\"" >> ~/.config/godot/editor_settings-4.tres
      - echo 'export/android/shutdown_adb_on_exit = true' >> ~/.config/godot/editor_settings-4.tres
      - cp ~/.config/godot/editor_settings-4.tres ~/.config/godot/editor_settings-4.3.tres
      - $$Godot$$/bin/godot.linuxbsd.editor.x86_64 --headless --import
      - $$Godot$$/bin/godot.linuxbsd.editor.x86_64 --headless --export-release 'Android'
        lorien.apk
    ndk: 23.2.8568313

AutoUpdateMode: Version
UpdateCheckMode: Tags
UpdateCheckData: lorien/export_presets.cfg|version/code=(\d+)|.|version/name="([\d.]+)"
