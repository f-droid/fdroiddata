Builds:
  - versionName: 1.3.23
    versionCode: 10323000
    commit: 6a56845db0c7835b843c2d7d9b59b2aa1a04f974
    subdir: apps/mobile/android/app
    sudo:
      - echo "deb https://deb.debian.org/debian forky main" > /etc/apt/sources.list.d/forky.list
      - apt-get update
      - apt-get install -y -t forky nodejs npm golang-go cargo cmake build-essential
      - npm install -g pnpm@11.12.0
    init: pnpm -C ../../../.. install --frozen-lockfile --no-optional --filter @how2vote/web...
      --filter @how2vote/mobile
    gradle:
      - yes
    srclibs:
      - esbuild@v0.28.1
      - rollup@v4.62.4
    prebuild:
      - printf 'versionCode=$$VERCODE$$\nversionName=$$VERSION$$\n' >> ../gradle.properties
      - cargo fetch --locked --manifest-path $$rollup$$/rust/Cargo.toml
      - mkdir -p src/main/assets
      - mkdir -p ../../../web/build
      - touch ../../../web/build/index.html
      - pnpm -C ../../../.. --filter @how2vote/mobile exec cap update android
    scandelete:
      - node_modules/.pnpm/@capacitor+cli@8.4.2/node_modules/@capacitor/cli/assets
    build:
      - go build -C $$esbuild$$ ./cmd/esbuild
      - cargo build --release --offline --manifest-path $$rollup$$/rust/bindings_napi/Cargo.toml
      - install -D -m644 $$rollup$$/rust/target/release/libbindings_napi.so 
        ../../../../node_modules/.pnpm/rollup@4.62.4/node_modules/@rollup/rollup-linux-x64-gnu/rollup.linux-x64-gnu.node
      - printf 
        '{"name":"@rollup/rollup-linux-x64-gnu","version":"4.62.4","main":"./rollup.linux-x64-gnu.node"}'
        > 
        ../../../../node_modules/.pnpm/rollup@4.62.4/node_modules/@rollup/rollup-linux-x64-gnu/package.json
      - pnpm -C ../../../.. --filter @how2vote/web^... build
      - ESBUILD_BINARY_PATH=$$esbuild$$/esbuild APP_VERSION=$$VERSION$$ PUBLIC_DIST_CHANNEL=fdroid
        pnpm -C ../../../.. --filter @how2vote/web build:app
      - pnpm -C ../../../.. --filter @how2vote/mobile exec cap copy android

