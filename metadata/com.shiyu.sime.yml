MaintainerNotes: |-
  The project uses source submodules for Sime, ncnn, and its optional
  Handwritten runtime. The F-Droid build intentionally disables Handwritten:
  its CASIA-trained model data is not included because its redistribution
  terms are not suitable for F-Droid. Sime's Apache-2.0 runtime data is in
  the Sime submodule's save/ directory and is required to build a functional
  offline input method. The two ignored GRU ncnn binaries are the required
  Apache-2.0 model weights; their source and training pipeline are in the
  Sime submodule. The upstream developer APK includes the optional Handwritten
  feature, while the F-Droid build intentionally omits it; F-Droid therefore
  signs and publishes its own build rather than verifying the upstream APK.

