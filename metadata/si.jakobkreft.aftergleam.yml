AntiFeatures:
  TetheredNet:
    en-US: Papers come from fixed servers that cannot be changed in the app. They
      are arXiv, bioRxiv, medRxiv, OSF (PsyArXiv, SocArXiv, EdArXiv, Law Archive)
      and Crossref for ChemRxiv. The Popular tab uses the Hugging Face daily papers
      list.
