  TetheredNet:
    en-US: Depends on Framasoft services (framadate.org, framapad.org, framatalk.org…)
      which are not user configurable
Categories:
  - Internet
License: GPL-3.0-or-later
AuthorName: Framasoft
AuthorWebSite: https://framasoft.org/
WebSite: https://framasoft.org/
SourceCode: https://framagit.org/framasoft/application-mobile
IssueTracker: https://framagit.org/framasoft/application-mobile/issues
Donate: https://soutenir.framasoft.org/

AutoName: Framasoft

RepoType: git
Repo: https://framagit.org/framasoft/application-mobile.git

Builds:
  - versionName: 1.0.0
    versionCode: 401
    commit: 85b07b896a9460ca7832acebf03b1d71ec2fdffc
    sudo:
      - mkdir -p /builds/framasoft
      - chown -R vagrant /builds
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-stable-release.apk
    binary: 
      https://framadrive.org/s/6BFNPWxLs3wy7rE/download?path=%2F&files=framasoft_app_v%v_arm.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
    prebuild:
      - flutterVersion=$(sed -n -E "s/.*flutter:\ '(.*)'/\1/p" pubspec.yaml)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export repo=/builds/framasoft/application-mobile
      - cd ..
      - mv org.framasoft.app $repo
      - pushd $repo
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
      - sed -i -e 's/-Wl,/-Wl,--build-id=none,/' .pub-cache/hosted/pub.dev/jni-*/src/CMakeLists.txt
      - $$flutter$$/bin/dart run build_runner build --delete-conflicting-outputs
      - popd
      - mv $repo org.framasoft.app
    scandelete:
      - .pub-cache
    build:
      - export repo=/builds/framasoft/application-mobile
      - cd ..
      - mv org.framasoft.app $repo
      - pushd $repo
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --dart-define-from-file=env-stable.json
        --flavor=stable --dart-define=buildType=fdroid --split-per-abi --target-platform="android-arm"
      - popd
      - mv $repo org.framasoft.app

