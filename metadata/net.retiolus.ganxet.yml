AutoName: Ganxet

RepoType: git
Repo: https://codeberg.org/retiolus/ganxet.git

Builds:
  - versionName: 0.1.2
    versionCode: 3001
    commit: aaca5899817a481cbcdb02e9316e133ed1704f37
    sudo:
      - mkdir -p /home/jenkins/agent/workspace
      - chown -R vagrant /home/jenkins
    output: build/app/outputs/flutter-apk/app-x86_64-release.apk
    binary: 
      https://codeberg.org/retiolus/ganxet/releases/download/v%v/net.retiolus.ganxet-x86_64-v%v.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
      - linux
    prebuild:
      - export flutterVersion=$(sed -n -E "s/^\s*flutter-version:\s(.*)/\1/p" pubspec.yaml)
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
    scandelete:
      - .pub-cache
    build:
      - export repo=/home/jenkins/agent/workspace/ganxet_v$$VERSION$$
      - mkdir -p $repo
      - cd ..
      - mv net.retiolus.ganxet $repo/_build
      - pushd $repo/_build
      - export PUB_CACHE=$(pwd)/.pub-cache
      - export PATH=$$flutter$$/bin/:$PATH
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform="android-x64"
      - popd
      - mv $repo/_build net.retiolus.ganxet
    ndk: r28c

