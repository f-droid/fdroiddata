License: GPL-3.0-only
AuthorName: hellArcom
SourceCode: https://github.com/hellArcom/life_rpg
IssueTracker: https://github.com/hellArcom/life_rpg/issues
Changelog: https://github.com/hellArcom/life_rpg/releases

AutoName: Life RPG

RepoType: git
Repo: https://github.com/hellArcom/life_rpg.git

Builds:
  - versionName: 0.5.1
    versionCode: 21
    commit: 38c1b5cb784a9654264946bbd14c88d2c5a8774f
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
      - linux
      - windows
    prebuild:
      - flutterVersion=$(sed -n -E "s/.*flutter-version:\ '(.*)'/\1/p" .github/workflows/release.yml)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --dart-define=FDROID_BUILD=true
        --split-per-abi --target-platform="android-arm"

  - versionName: 0.5.1
    versionCode: 22
