  https://github.com/20genesis14-sys/StudyBible/releases/download/v%v/dev.studybible_%c.apk

Builds:
  - versionName: 1.1.1
    versionCode: 7051
    commit: d79472e945f51eb9791c99b190c03117c7841cce
    sudo:
      - apt-get update
      - apt-get install -y unzip xz-utils clang cmake ninja-build pkg-config rustup
    output: 
      apps/studybible-flutter/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    srclibs:
      - flutter@stable
    rm:
      - apps/studybible-flutter/linux
      - apps/studybible-flutter/web
      - apps/studybible-flutter/windows
    prebuild:
      - rustup toolchain install 1.99.0 --profile minimal
      - rustup default 1.99.0
      - rustup target add armv7-linux-androideabi
      - export PATH="$HOME/.cargo/bin:$PATH"
      - export PUB_CACHE=$(pwd)/apps/studybible-flutter/.pub-cache
      - "flutterVersion=$(sed -n -E \"s/.*flutter-version: '(.*)'/\\1/p\" .github/workflows/release.yml)"
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter precache --android
      - cd apps/studybible-flutter
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
    scandelete:
      - apps/studybible-flutter/.pub-cache
    build:
      - export PATH="$HOME/.cargo/bin:$PATH"
      - export PUB_CACHE=$(pwd)/apps/studybible-flutter/.pub-cache
      - cd apps/studybible-flutter
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform
        android-arm
    ndk: r28c

