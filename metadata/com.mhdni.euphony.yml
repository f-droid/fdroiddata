AntiFeatures:
  NonFreeNet:
    en-US: Streams music from YouTube Music (InnerTube / youtube_explode_dart)
Categories:
  - Online Media Player
License: GPL-3.0-only
AuthorName: Mohammed Nihad
AuthorWebSite: https://github.com/MohammedNihadv
WebSite: https://euphony.fedaration.in/
SourceCode: https://github.com/MohammedNihadv/Euphony
IssueTracker: https://github.com/MohammedNihadv/Euphony/issues

AutoName: Euphony

RepoType: git
Repo: https://github.com/MohammedNihadv/Euphony

Builds:
  - versionName: 1.0.1
    versionCode: 100011
    commit: 8773edb8a463b0b8d32ac6cec04a33bd20cc2fb4
    sudo:
      - mkdir -p /home/runner/work/Euphony
      - chown -R vagrant /home/runner
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    binary: 
      https://github.com/MohammedNihadv/Euphony/releases/download/v%v/app-armeabi-v7a-release.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
      - linux
      - macos
      - web
      - windows
    prebuild:
      - cd ..
      - export repo=/home/runner/work/Euphony/Euphony
      - export HOME=/home/runner
      - export ANDROID_NDK_HOME=$$NDK$$
      - export ANDROID_NDK_ROOT=$$NDK$$
      - mv com.mhdni.euphony $repo
      - pushd $repo
      - export PUB_CACHE=$(pwd)/.pub-cache
      - export flutterVersion=$(sed -n -E "s/.*FLUTTER_VERSION:\ '(.*)'/\1/p" .github/workflows/ci.yml)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
      - sed -i -e 's/-Wl,/-Wl,--build-id=none,/' $PUB_CACHE/hosted/pub.dev/jni-*/src/CMakeLists.txt
      - popd
      - mv $repo com.mhdni.euphony
    scandelete:
      - .pub-cache
    build:
      - cd ..
      - export repo=/home/runner/work/Euphony/Euphony
      - export HOME=/home/runner
      - export ANDROID_NDK_HOME=$$NDK$$
      - export ANDROID_NDK_ROOT=$$NDK$$
      - mv com.mhdni.euphony $repo
      - pushd $repo
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --dart-define=ENABLE_UPDATES=false
      - popd
      - mv $repo com.mhdni.euphony
    ndk: r27d

