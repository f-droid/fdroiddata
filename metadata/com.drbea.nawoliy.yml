Builds:
  - versionName: 1.0.2
    versionCode: 31
    commit: edffb965a705d3730a1bb757a239a560ae57c627
    submodules: true
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    binary: 
      https://gitlab.com/api/v4/projects/86081394/packages/generic/nawoliy/%v/app-armeabi-v7a-release.apk
    rm:
      - ios
      - linux
      - macos
      - web
      - windows
    prebuild:
      - sed -i 's/signingConfigs.getByName("debug")/null/' android/app/build.gradle.kts
      - export repo=/tmp/upstream-nawoliy
      - cd ..
      - mv com.drbea.nawoliy $repo
      - pushd $repo
      - export PUB_CACHE=$(pwd)/.pub-cache
      - flutter/bin/flutter config --no-analytics
      - flutter/bin/flutter pub get --enforce-lockfile
      - popd
      - mv $repo com.drbea.nawoliy
    scanignore:
      - flutter/bin/cache
    scandelete:
      - flutter
      - .pub-cache
    build:
      - export repo=/tmp/upstream-nawoliy
      - cd ..
      - mv com.drbea.nawoliy $repo
      - pushd $repo
      - export PUB_CACHE=$(pwd)/.pub-cache
      - flutter/bin/flutter build apk --release --split-per-abi --target-platform=android-arm
      - popd
      - mv $repo com.drbea.nawoliy

