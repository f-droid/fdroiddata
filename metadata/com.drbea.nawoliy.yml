MaintainerNotes: |
  Flutter is pinned upstream as a git submodule at flutter/.

  The build is moved to the same fixed path as the upstream release job
  (/tmp/upstream-nawoliy) for reproducible builds: libapp.so and libdartjni.so
  embed the build path.

  Version codes are versionCode * 10 + ABI (1 armeabi-v7a, 2 arm64-v8a,
  3 x86_64), set in android/app/build.gradle.kts.

AutoUpdateMode: Version
UpdateCheckMode: Tags
VercodeOperation:
  - '%c * 10 + 1'
  - '%c * 10 + 2'
  - '%c * 10 + 3'
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 1.0.4
CurrentVersionCode: 53
