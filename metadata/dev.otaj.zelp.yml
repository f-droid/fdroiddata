Repo: https://github.com/otaj/zelp.git

Builds:
  - versionName: 0.0.6
    versionCode: 61
    commit: 16465ac16c44813624730b9dd2fa3af06b5d1fd0
    sudo:
      - apt-get update
      - apt-get install -y jq
      - mkdir -p /home/runner/work/zelp
      - chown -R vagrant /home/runner
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-prod-release.apk
    binary: https://github.com/otaj/zelp/releases/download/v%v/zelp-%v-armeabi-v7a.apk
    srclibs:
      - flutter@stable
    prebuild:
      - flutterVersion=$(jq -r .flutter .fvmrc)
      - test -n "$flutterVersion"
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export repo=/home/runner/work/zelp/zelp
      - cd ..
      - mv dev.otaj.zelp $repo
      - pushd $repo
      - export PATH="$$flutter$$/bin:$PATH"
      - flutter config --no-analytics
      - flutter config --android-sdk "$ANDROID_SDK_ROOT"
      - flutter pub get --enforce-lockfile
      - popd
      - mv $repo dev.otaj.zelp
    build:
      - export repo=/home/runner/work/zelp/zelp
      - cd ..
      - mv dev.otaj.zelp $repo
      - pushd $repo
      - export PATH="$$flutter$$/bin:$PATH"
      - bash ./scripts/fdroid_build.sh android-arm
      - popd
      - mv $repo dev.otaj.zelp

