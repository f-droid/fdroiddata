MaintainerNotes: |-
  Reproducible developer-signed APKs from GitHub Releases.
  versionCode = 10 * (major*10000 + minor*100 + patch) + ABI
  ABI: 1=armeabi-v7a, 2=arm64-v8a, 3=x86_64 (v0.0.6 → 61/62/63).
  Flutter pin is jq -r .flutter .fvmrc (not FVM on the buildserver).
  scripts/fdroid_build.sh builds --flavor prod, one ABI per process.
  Binaries: https://github.com/otaj/zelp/releases/download/v%v/zelp-%v-<abi>.apk
  Fastlane listing is in the source repo (en-US).

AutoUpdateMode: Version
