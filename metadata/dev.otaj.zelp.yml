AntiFeatures:
  NonFreeAdd:
    en-US: Install QR codes target Zepp developer mode (the proprietary Zepp Android
      app). Pairing keys, GPS packs, and firmware work without Zepp installed.
  NonFreeNet:
    en-US: Account, GPS, firmware, and store features use Amazfit/Zepp cloud APIs.
      An optional setting scrapes the Zepp listing on Google Play for the current
      Android version. Get device list from GitHub.
  TetheredNet:
    en-US: Those Amazfit/Zepp servers have no self-hosted substitute.
Categories:
  - Connectivity
License: GPL-3.0-or-later
