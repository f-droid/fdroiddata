IssueTracker: https://github.com/DottoXD/NetManager/issues
Changelog: https://github.com/DottoXD/NetManager/releases

AutoName: NetManager

RepoType: git
Repo: https://github.com/DottoXD/NetManager.git

Builds:
  - versionName: 0.2.3
    versionCode: 5161
    commit: 1e45eeaecf3618e2206439d38e26080a8265852d
    sudo:
      - mkdir -p /home/runner/work/NetManager
      - chown -R vagrant /home/runner
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-foss-release.apk
    binary: 
      https://github.com/DottoXD/NetManager/releases/download/%v/NetManager-FOSS-v7a.apk
    srclibs:
      - flutter@stable
    rm:
      - test
      - android/wear
    prebuild:
      - export repo=/home/runner/work/NetManager
      - cd ..
      - mv pw.dotto.netmanager.foss $repo/NetManager
      - pushd $repo/NetManager
      - sed -i '/:wear/d' android/settings.gradle.kts
      - flutterVersion=$(sed -n -E "s/.*flutter-version:\ '?(.*)'?/\1/p" .github/workflows/android-foss.yml)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -B stable -f $flutterVersion
      - export PUB_CACHE=$(pwd)/.pub-cache
      - export PATH=$$flutter$$/bin:$PATH
      - export SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)
      - flutter config --no-analytics
      - flutter pub get --enforce-lockfile
      - popd
      - mv $repo/NetManager pw.dotto.netmanager.foss
    scandelete:
      - .pub-cache
    build:
      - export repo=/home/runner/work/NetManager
      - cd ..
      - mv pw.dotto.netmanager.foss $repo/NetManager
      - pushd $repo/NetManager
      - export PUB_CACHE=$(pwd)/.pub-cache
      - export PATH=$$flutter$$/bin:$PATH
      - export SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)
      - export GIT_COMMIT=$(git rev-parse --short=7 HEAD)
      - flutter build apk --release --flavor foss --extra-gen-snapshot-options=--strip
        --dart-define=SENTRY_DSN=https://8be4a19c082841f4958cb347196914f9@netmanager.bugsink.com/2
        --dart-define=GIT_COMMIT=$GIT_COMMIT --target-platform android-arm --split-per-abi
      - popd
      - mv $repo/NetManager pw.dotto.netmanager.foss
    ndk: 28.2.13676358

