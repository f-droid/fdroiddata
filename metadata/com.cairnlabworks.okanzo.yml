AntiFeatures:
  NonFreeNet:
    en-US: Fetches stock, fund and crypto prices from the Yahoo Finance API and currency
      exchange rates from open.er-api.com, both non-free network services. Only ticker
      symbols and currency codes are sent; no personal or portfolio data leaves the
      device.
Categories:
  - Finance Manager
License: MIT
AuthorName: Cairn Labworks
SourceCode: https://github.com/cairn-labworks/Okanzo
IssueTracker: https://github.com/cairn-labworks/Okanzo/issues

