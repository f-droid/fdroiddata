MaintainerNotes: |-
  Capacitor app (plain HTML/JS in www/, no bundler). The output of `cap sync`
  (web assets copy, plugin module, configs) is committed, so the build needs
  no Capacitor CLI; nodejs/npm from Debian forky only install the Capacitor Android
  sources into node_modules. Upstream CI fails if the committed copy drifts.
  Reproducible: Binaries points at the GitHub release built by CI.

