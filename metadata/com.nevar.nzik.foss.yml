AntiFeatures:
  NonFreeNet:
    en-US: Relies on YouTube/YouTube Music for core playback and metadata. Uses Piped
      and Invidious as alternative frontends, with instance lists fetched from GitHub.
      Uses external APIs for lyrics and stats (KuGou, LrcLib, BetterLyrics, Return
      YouTube Dislike) and Google Translate for lyrics translation. Connects to GitHub
      for app updates and to Crowdin for translator avatars. Optionally connects to
      Discord for Rich Presence.
