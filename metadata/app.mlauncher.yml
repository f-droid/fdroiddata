Builds:
  - versionName: 1.12.0.0
    versionCode: 1120000
    commit: 0094d9aaf1cec3fb2721b693671ede46a9381085
    subdir: app
    sudo:
      - export CPUS_MAX=16
      - export CPUS=$(getconf _NPROCESSORS_ONLN)
      - for (( c=$CPUS_MAX; c<$CPUS; c++ )) ; do echo 0 > /sys/devices/system/cpu/cpu$c/online
        ; done
    gradle:
      - prod
    binary: 
      https://github.com/CodeWorksCreativeHub/mLauncher/releases/download/%v/MultiLauncher-%v-Signed.apk
    prebuild:
      - sed -i -e '/foojay/d' -e '/jetbrains.space/d' ../settings.gradle.kts
      - sed -i -e 's/2.4.0-279/2.4.0/' ../gradle/libs.versions.toml

