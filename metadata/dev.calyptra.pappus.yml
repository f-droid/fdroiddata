Builds:
  - versionName: 1.13.2
    versionCode: 4061
    commit: 6f978969b02cbe9a7c314e3aab70de2c2db5f8bf
    sudo:
      - mkdir -p /home/runner/work/PappusTravelPlanner
      - chown -R vagrant /home/runner
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    binary: 
      https://github.com/Calyptra-Software/PappusTravelPlanner/releases/download/v%v/app-armeabi-v7a-release.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
      - linux
      - macos
      - web
      - windows
    prebuild:
      - flutterVersion=$(sed -n -E "s/^ *FLUTTER_VERSION:\ '(.*)'$/\1/p" .github/workflows/release.yml)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export repo=/home/runner/work/PappusTravelPlanner/PappusTravelPlanner
      - cd ..
      - mv dev.calyptra.pappus $repo
      - pushd $repo
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
      - popd
      - mv $repo dev.calyptra.pappus
    scandelete:
      - .pub-cache
    build:
      - export repo=/home/runner/work/PappusTravelPlanner/PappusTravelPlanner
      - cd ..
      - mv dev.calyptra.pappus $repo
      - pushd $repo
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --split-per-abi
      - popd
      - mv $repo dev.calyptra.pappus
    ndk: r28c

