Builds:
  - versionName: 1.1.10
    versionCode: 5061
    commit: 5032069985cf30a9588e473a04c37233a68fddb5
    submodules: true
    sudo:
      - mkdir -p /home/runner/work/EmberSpark
      - chown -R vagrant /home/runner
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    binary: 
      https://github.com/TrepnickKev/EmberSpark/releases/download/v%v/EmberSpark-v%v-armeabi-v7a.apk
    rm:
      - ios
      - linux
      - macos
      - web
      - windows
    prebuild:
      - export repo=/home/runner/work/EmberSpark/EmberSpark
      - cd ..
      - mv com.emberspark.wallet $repo
      - pushd $repo
      - export PUB_CACHE=$(pwd)/.pub-cache
      - .flutter/bin/flutter config --no-analytics
      - .flutter/bin/flutter pub get --enforce-lockfile
      - popd
      - mv $repo com.emberspark.wallet
    scanignore:
      - .flutter/bin/cache
    scandelete:
      - .flutter
      - .pub-cache
    build:
      - export repo=/home/runner/work/EmberSpark/EmberSpark
      - cd ..
      - mv com.emberspark.wallet $repo
      - pushd $repo
      - export PUB_CACHE=$(pwd)/.pub-cache ES_UNSIGNED_RELEASE=1
      - .flutter/bin/flutter build apk --release --split-per-abi --target-platform=android-arm
      - popd
      - mv $repo com.emberspark.wallet
    ndk: r28c

