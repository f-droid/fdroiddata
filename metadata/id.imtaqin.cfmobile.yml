AntiFeatures:
  NonFreeNet:
    en-US: Needs a Cloudflare account. Sign-in with Cloudflare (OAuth) is relayed
      through the author's server; signing in with an API token avoids it. The optional
      AI features use a hosted backend whose source is not public.
