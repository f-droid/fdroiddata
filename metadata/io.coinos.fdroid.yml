Builds:
  - versionName: '1.9'
    versionCode: 10
    commit: e1bc34923bed8fd00c5a3cdacdfb7f102c87d7a3
    subdir: android/app
    sudo:
      - curl -fsSL -o /tmp/bun.zip 
        https://github.com/oven-sh/bun/releases/download/bun-v1.3.9/bun-linux-x64-baseline.zip
      - echo "104d4d037f4b35e10215c0507e1779691f39c57bd91ddeefe11cad781e3fc4b9  /tmp/bun.zip"
        | sha256sum -c
      - unzip -q /tmp/bun.zip -d /tmp/bun
      - install -m 0755 /tmp/bun/bun-linux-x64-baseline/bun /usr/local/bin/bun
    gradle:
      - fdroid
    prebuild:
      - cd ../..
      - bun install --frozen-lockfile
      - HAL_NO_SW=1 bun run build
    scandelete:
      - node_modules

