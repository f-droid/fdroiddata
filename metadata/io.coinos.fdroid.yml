AntiFeatures:
  NonFreeNet:
    en-US: Posts load pictures, videos and link previews from third-party media hosts
      (nostr.build, primal.net and others, YouTube thumbnails from i.ytimg.com), name@domain
      payment addresses are looked up through Cloudflare's and Google's DNS-over-HTTPS
      resolvers, and block explorer data comes from mempool.space.
  TetheredNet:
    en-US: Spending and Lightning payments go through the coinos Ark server (ark.coinos.io),
      @coinos.io payment addresses through the coinos name registrar, and chat and
      notifications through the coinos relays. The server code is published at git.coinos.io,
      but this build is fixed to the coinos instances.
